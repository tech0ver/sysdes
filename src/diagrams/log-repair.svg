  <rect class="dg-box-accent" x="358" y="216" width="40" height="24" rx="4"/>
  <text class="dg-code" x="378.0" y="232.0" text-anchor="middle">t3</text>
  <rect class="dg-box-accent" x="410" y="216" width="40" height="24" rx="4"/>
  <text class="dg-code" x="430.0" y="232.0" text-anchor="middle">t3</text>
  <line class="dg-cross" x1="151" y1="131" x2="161" y2="141"/>
  <line class="dg-cross" x1="151" y1="141" x2="161" y2="131"/>
  <text class="dg-mono dg-muted-text" x="174" y="140" text-anchor="start">APPEND 6, PREVIOUS (5, t3): NO MATCH</text>
  <path class="dg-arrow" d="M150 166 L154 171 L163 160"/>
  <text class="dg-mono dg-accent-text" x="174" y="170" text-anchor="start">APPEND 5–6, PREVIOUS (4, t2): MATCH</text>
</svg>
