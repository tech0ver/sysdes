<svg class="diagram-svg" viewBox="0 0 720 270" role="img" aria-labelledby="dirty-read-write-title dirty-read-write-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dirty-read-write-title">A dirty read and a dirty write</title>
  <desc id="dirty-read-write-desc">Dirty read: purchase A marks seats 14 and 15 as sold without committing; buyer B reads them as sold and picks other seats; then A rolls back, and the seats are free again. Dirty write: A sells seat 14, B sells seat 15, B overwrites seat 14, A overwrites seat 15; each buyer gets one of the two seats.</desc>
  <defs>
    <marker id="dirty-read-write-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="dirty-read-write-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="262"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Dirty read</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="56" text-anchor="middle">PURCHASE A</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="56" text-anchor="middle">BUYER B</text>
  <text class="dg-mono dg-muted-text" x="180.0" y="56" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="98.0" y1="64" x2="98.0" y2="224"/>
  <line class="dg-lifeline" x1="262.0" y1="64" x2="262.0" y2="224"/>
  <path class="dg-arrow" d="M180.0 64 V224" marker-end="url(#dirty-read-write-head)"/>
  <rect class="dg-box" x="28.0" y="74" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="91" text-anchor="middle">14, 15 → sold</text>
  <rect class="dg-box-accent" x="192.0" y="110" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="127" text-anchor="middle">read: sold</text>
  <rect class="dg-box" x="192.0" y="146" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="163" text-anchor="middle">picks other seats</text>
  <rect class="dg-box" x="28.0" y="182" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="199" text-anchor="middle">ROLLBACK</text>
  <text class="dg-result" x="180.0" y="250" text-anchor="middle">14, 15 are free again</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Dirty write</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="56" text-anchor="middle">PURCHASE A</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="56" text-anchor="middle">PURCHASE B</text>
  <text class="dg-mono dg-muted-text" x="540.0" y="56" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="458.0" y1="64" x2="458.0" y2="224"/>
  <line class="dg-lifeline" x1="622.0" y1="64" x2="622.0" y2="224"/>
  <path class="dg-arrow" d="M540.0 64 V224" marker-end="url(#dirty-read-write-head)"/>
  <rect class="dg-box" x="388.0" y="74" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="91" text-anchor="middle">seat 14 → A</text>
  <rect class="dg-box" x="552.0" y="110" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="127" text-anchor="middle">seat 15 → B</text>
  <rect class="dg-box-accent" x="552.0" y="146" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="163" text-anchor="middle">seat 14 → B</text>
  <rect class="dg-box-accent" x="388.0" y="182" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="199" text-anchor="middle">seat 15 → A</text>
  <text class="dg-result" x="540.0" y="250" text-anchor="middle">14 is B’s, 15 is A’s</text>
</svg>
