  <text class="dg-code" x="380.0" y="276.0" text-anchor="middle">88129 · email</text>
  <path class="dg-line" d="M468 36 H474 V116 H468" fill="none"/>
  <text class="dg-mono dg-muted-text" x="482" y="80.0" text-anchor="start">WORKER A</text>
  <path class="dg-line" d="M468 120 H474 V200 H468" fill="none"/>
  <text class="dg-mono dg-muted-text" x="482" y="164.0" text-anchor="start">WORKER B</text>
  <path class="dg-line" d="M468 204 H474 V284 H468" fill="none"/>
  <text class="dg-mono dg-muted-text" x="482" y="248.0" text-anchor="start">WORKER C</text>
