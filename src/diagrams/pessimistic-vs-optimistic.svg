<svg class="diagram-svg" viewBox="0 0 720 242" role="img" aria-labelledby="pessimistic-vs-optimistic-title pessimistic-vs-optimistic-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="pessimistic-vs-optimistic-title">Pessimistic locking makes the second buyer wait; optimistic locking makes it retry</title>
  <desc id="pessimistic-vs-optimistic-desc">Both panels use seat 14. FOR UPDATE: A locks seat 14 as it reads it; B waits for the lock; A sells and commits; B then reads the seat as sold. Version check: both read seat 14 as free with version 3; A sells it only if the version is still 3, sets version 4, and commits; B tries the same, no rows change, and B starts again from the read.</desc>
  <defs>
    <marker id="pessimistic-vs-optimistic-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="pessimistic-vs-optimistic-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="234"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Lock on read</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">FOR UPDATE</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="62" text-anchor="middle">PURCHASE A</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="62" text-anchor="middle">PURCHASE B</text>
  <text class="dg-mono dg-muted-text" x="180.0" y="62" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="98.0" y1="70" x2="98.0" y2="230"/>
  <line class="dg-lifeline" x1="262.0" y1="70" x2="262.0" y2="230"/>
  <path class="dg-arrow" d="M180.0 70 V230" marker-end="url(#pessimistic-vs-optimistic-head)"/>
  <rect class="dg-box" x="28.0" y="80" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="97" text-anchor="middle">lock 14: free</text>
  <rect class="dg-box-failed" x="192.0" y="116" width="140" height="26" rx="4"/>
  <text class="dg-code-muted" x="262.0" y="133" text-anchor="middle">waits for A</text>
  <rect class="dg-box" x="28.0" y="152" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="169" text-anchor="middle">sell, COMMIT</text>
  <rect class="dg-box-accent" x="192.0" y="188" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="205" text-anchor="middle">read 14: sold</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Version check</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">version column</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="62" text-anchor="middle">PURCHASE A</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="62" text-anchor="middle">PURCHASE B</text>
  <text class="dg-mono dg-muted-text" x="540.0" y="62" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="458.0" y1="70" x2="458.0" y2="230"/>
  <line class="dg-lifeline" x1="622.0" y1="70" x2="622.0" y2="230"/>
  <path class="dg-arrow" d="M540.0 70 V230" marker-end="url(#pessimistic-vs-optimistic-head)"/>
  <rect class="dg-box" x="388.0" y="80" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="97" text-anchor="middle">read 14: free, v3</text>
  <rect class="dg-box" x="552.0" y="116" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="133" text-anchor="middle">read 14: free, v3</text>
  <rect class="dg-box" x="388.0" y="152" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="169" text-anchor="middle">v3 → v4, COMMIT</text>
  <rect class="dg-box-accent" x="552.0" y="188" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="205" text-anchor="middle">sell if v3: 0 rows</text>
</svg>
