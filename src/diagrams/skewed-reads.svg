<svg class="diagram-svg" viewBox="0 0 716 270" role="img" aria-labelledby="skewed-reads-title skewed-reads-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="skewed-reads-title">Skewed reads and the hit ratio</title>
  <desc id="skewed-reads-desc">Left: reads of 30 articles, where the article at rank N gets 1/N of the top article's reads. The six most read articles get 61% of all reads. Right: the hit ratio of a cache that holds the most read articles: 1 article gives 25%, 2 give 38%, 4 give 52%, 8 give 68%, 16 give 85%. Each doubling adds about the same number of points.</desc>
  <defs>
    <marker id="skewed-reads-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="skewed-reads-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-2 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="262"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Reads per article</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">example: 30 articles, N-th gets 1/N of the top</text>
  <rect class="dg-bar" x="22.0" y="64.0" width="8" height="156.0" rx="1"/>
  <rect class="dg-bar" x="32.4" y="142.0" width="8" height="78.0" rx="1"/>
  <rect class="dg-bar" x="42.8" y="168.0" width="8" height="52.0" rx="1"/>
  <rect class="dg-bar" x="53.2" y="181.0" width="8" height="39.0" rx="1"/>
  <rect class="dg-bar" x="63.6" y="188.8" width="8" height="31.2" rx="1"/>
  <rect class="dg-bar" x="74.0" y="194.0" width="8" height="26.0" rx="1"/>
  <rect class="dg-bar" x="84.4" y="197.7" width="8" height="22.3" rx="1"/>
  <rect class="dg-bar" x="94.8" y="200.5" width="8" height="19.5" rx="1"/>
  <rect class="dg-bar" x="105.2" y="202.7" width="8" height="17.3" rx="1"/>
  <rect class="dg-bar" x="115.6" y="204.4" width="8" height="15.6" rx="1"/>
  <rect class="dg-bar" x="126.0" y="205.8" width="8" height="14.2" rx="1"/>
  <rect class="dg-bar" x="136.4" y="207.0" width="8" height="13.0" rx="1"/>
  <rect class="dg-bar" x="146.8" y="208.0" width="8" height="12.0" rx="1"/>
  <rect class="dg-bar" x="157.2" y="208.9" width="8" height="11.1" rx="1"/>
  <rect class="dg-bar" x="167.6" y="209.6" width="8" height="10.4" rx="1"/>
  <rect class="dg-bar" x="178.0" y="210.2" width="8" height="9.8" rx="1"/>
  <rect class="dg-bar" x="188.4" y="210.8" width="8" height="9.2" rx="1"/>
  <rect class="dg-bar" x="198.8" y="211.3" width="8" height="8.7" rx="1"/>
  <rect class="dg-bar" x="209.2" y="211.8" width="8" height="8.2" rx="1"/>
  <rect class="dg-bar" x="219.6" y="212.2" width="8" height="7.8" rx="1"/>
  <rect class="dg-bar" x="230.0" y="212.6" width="8" height="7.4" rx="1"/>
