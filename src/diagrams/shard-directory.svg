  <text class="dg-code" x="539.0" y="74.0" text-anchor="middle">shard 2</text>
  <rect class="dg-chip" x="384" y="88" width="66" height="24" rx="4"/>
  <text class="dg-code" x="417.0" y="104.0" text-anchor="middle">ws 33</text>
  <path class="dg-arrow" d="M456 100 H486" marker-end="url(#shard-directory-head)"/>
  <rect class="dg-box-accent" x="494" y="88" width="90" height="24" rx="4"/>
  <text class="dg-code" x="539.0" y="104.0" text-anchor="middle">shard 2</text>
  <text class="dg-sub" x="596" y="104">moved</text>
  <rect class="dg-chip" x="384" y="118" width="66" height="24" rx="4"/>
  <text class="dg-code" x="417.0" y="134.0" text-anchor="middle">ws 42</text>
  <path class="dg-arrow" d="M456 130 H486" marker-end="url(#shard-directory-head)"/>
  <rect class="dg-box-accent" x="494" y="118" width="90" height="24" rx="4"/>
  <text class="dg-code" x="539.0" y="134.0" text-anchor="middle">shard 3</text>
  <text class="dg-sub" x="596" y="134">big, own shard</text>
