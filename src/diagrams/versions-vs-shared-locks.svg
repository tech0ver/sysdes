<svg class="diagram-svg" viewBox="0 0 720 236" role="img" aria-labelledby="versions-vs-shared-locks-title versions-vs-shared-locks-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="versions-vs-shared-locks-title">A report next to a purchase: with a snapshot and with shared locks</title>
  <desc id="versions-vs-shared-locks-desc">With snapshot isolation, the purchase writes seat 14 and commits while the report runs, and the report keeps reading free from its snapshot. With shared locks, the report locks seat 14 when it reads it, and the purchase waits until the report commits.</desc>
  <defs>
    <marker id="versions-vs-shared-locks-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="versions-vs-shared-locks-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="228"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Snapshot isolation</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="56" text-anchor="middle">REPORT</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="56" text-anchor="middle">PURCHASE</text>
  <line class="dg-lifeline" x1="98.0" y1="64" x2="98.0" y2="224"/>
  <line class="dg-lifeline" x1="262.0" y1="64" x2="262.0" y2="224"/>
  <rect class="dg-box" x="28.0" y="74" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="91" text-anchor="middle">read 14: free</text>
  <rect class="dg-box" x="192.0" y="110" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="127" text-anchor="middle">seat 14 → sold</text>
  <rect class="dg-box" x="192.0" y="146" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="163" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="28.0" y="182" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="199" text-anchor="middle">read 14: free</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Shared locks</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="56" text-anchor="middle">REPORT</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="56" text-anchor="middle">PURCHASE</text>
  <line class="dg-lifeline" x1="458.0" y1="64" x2="458.0" y2="224"/>
  <line class="dg-lifeline" x1="622.0" y1="64" x2="622.0" y2="224"/>
  <rect class="dg-box" x="388.0" y="74" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="91" text-anchor="middle">read 14: free</text>
  <rect class="dg-box-accent dg-empty" x="552.0" y="110" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="127" text-anchor="middle">waits for report</text>
  <rect class="dg-box" x="388.0" y="146" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="163" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="552.0" y="182" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="199" text-anchor="middle">seat 14 → sold</text>
</svg>
