<svg class="diagram-svg" viewBox="0 0 720 244" role="img" aria-labelledby="analytics-store-title analytics-store-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="analytics-store-title">Raw events answer new questions; a rollup answers a fixed one</title>
  <desc id="analytics-store-desc">Left: raw view events in the analytics store, one row per view with the post, the country, and the time. A new question from the product team, views by country, scans all of these rows. Right: a rollup precomputed from them, one row per post and day with the number of views. The app shows daily views of post 81 by reading one row.</desc>
  <defs>
    <marker id="analytics-store-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="analytics-store-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="16" y="24" text-anchor="start">Raw events</text>
  <text class="dg-mono dg-muted-text" x="156" y="52" text-anchor="middle">POST | COUNTRY | TIME</text>
  <text class="dg-name" x="424" y="24" text-anchor="start">Rollup</text>
  <text class="dg-mono dg-muted-text" x="564" y="52" text-anchor="middle">POST | DAY | VIEWS</text>
  <rect class="dg-box" x="16" y="60" width="280" height="24" rx="4"/>
  <text class="dg-code" x="156.0" y="76.0" text-anchor="middle">81 | BR | 10:01:07</text>
  <rect class="dg-box" x="16" y="88" width="280" height="24" rx="4"/>
  <text class="dg-code" x="156.0" y="104.0" text-anchor="middle">90 | US | 10:01:09</text>
  <rect class="dg-box" x="16" y="116" width="280" height="24" rx="4"/>
  <text class="dg-code" x="156.0" y="132.0" text-anchor="middle">81 | DE | 10:01:12</text>
  <rect class="dg-box" x="16" y="144" width="280" height="24" rx="4"/>
  <text class="dg-code-muted" x="156.0" y="160.0" text-anchor="middle">…</text>
  <rect class="dg-box" x="424" y="60" width="280" height="24" rx="4"/>
  <text class="dg-code" x="564.0" y="76.0" text-anchor="middle">90 | Oct 12 | 310</text>
  <rect class="dg-box" x="424" y="88" width="280" height="24" rx="4"/>
  <text class="dg-code" x="564.0" y="104.0" text-anchor="middle">81 | Oct 12 | 2,140</text>
  <path class="dg-arrow" d="M296 72 H418" marker-end="url(#analytics-store-head)"/>
  <text class="dg-mono dg-muted-text" x="357" y="64" text-anchor="middle">PRECOMPUTE</text>
  <rect class="dg-chip" x="16" y="204" width="280" height="32" rx="4"/>
  <text class="dg-note" x="156.0" y="224.0" text-anchor="middle">Product team: views by country</text>
  <path class="dg-arrow dg-message" d="M156 204 V178" marker-end="url(#analytics-store-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="166" y="194">SCAN ALL ROWS</text>
  <rect class="dg-chip" x="424" y="204" width="280" height="32" rx="4"/>
  <text class="dg-note" x="564.0" y="224.0" text-anchor="middle">App: daily views of post 81</text>
  <path class="dg-arrow" d="M564 204 V118" marker-end="url(#analytics-store-head)"/>
  <text class="dg-mono dg-muted-text" x="574" y="166">READ ONE ROW</text>
</svg>
