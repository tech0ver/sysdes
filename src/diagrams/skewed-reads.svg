  <rect class="dg-bar" x="250.8" y="213.2" width="8" height="6.8" rx="1"/>
  <rect class="dg-bar" x="261.2" y="213.5" width="8" height="6.5" rx="1"/>
  <rect class="dg-bar" x="271.6" y="213.8" width="8" height="6.2" rx="1"/>
  <rect class="dg-bar" x="282.0" y="214.0" width="8" height="6.0" rx="1"/>
  <rect class="dg-bar" x="292.4" y="214.2" width="8" height="5.8" rx="1"/>
