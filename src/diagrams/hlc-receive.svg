<svg class="diagram-svg" viewBox="0 0 720 268" role="img" aria-labelledby="hlc-receive-title hlc-receive-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hlc-receive-title">How a hybrid logical clock sets its timestamp when a message arrives</title>
  <desc id="hlc-receive-desc">Node B's last timestamp is (100, 4), and a message arrives from node A with (100, 7). Left: B's own clock reads 99, so the physical part stays 100, the largest known; the physical parts are equal, so the counter becomes the larger of 4 and 7, plus one: (100, 8). Right: B's clock reads 103, ahead of both, so the physical part becomes 103 and the counter starts at 0: (103, 0).</desc>
  <defs>
    <marker id="hlc-receive-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="hlc-receive-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="260"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">Own clock behind</text>
  <text class="dg-mono dg-muted-text" x="70" y="50" text-anchor="middle">NODE A</text>
  <line class="dg-lifeline" x1="70" y1="62" x2="70" y2="200"/>
  <text class="dg-mono dg-muted-text" x="250" y="50" text-anchor="middle">NODE B</text>
  <line class="dg-lifeline" x1="250" y1="62" x2="250" y2="200"/>
  <rect class="dg-box" x="185.0" y="70" width="130" height="24" rx="4"/>
  <text class="dg-code" x="250.0" y="86.0" text-anchor="middle">last: (100, 4)</text>
  <rect class="dg-box" x="185.0" y="100" width="130" height="24" rx="4"/>
  <text class="dg-code" x="250.0" y="116.0" text-anchor="middle">clock: 99</text>
  <text class="dg-mono dg-muted-text" x="160.0" y="142" text-anchor="middle">MESSAGE (100, 7)</text>
  <path class="dg-arrow" d="M70 150 H242" marker-end="url(#hlc-receive-head)"/>
  <rect class="dg-box-accent" x="185.0" y="160" width="130" height="24" rx="4"/>
  <text class="dg-code" x="250.0" y="176.0" text-anchor="middle">now: (100, 8)</text>
  <text class="dg-mono dg-accent-text" x="180" y="228" text-anchor="middle">SAME PHYSICAL 100: COUNTER max(4, 7) + 1</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Own clock ahead</text>
  <text class="dg-mono dg-muted-text" x="430" y="50" text-anchor="middle">NODE A</text>
  <line class="dg-lifeline" x1="430" y1="62" x2="430" y2="200"/>
  <text class="dg-mono dg-muted-text" x="610" y="50" text-anchor="middle">NODE B</text>
  <line class="dg-lifeline" x1="610" y1="62" x2="610" y2="200"/>
  <rect class="dg-box" x="545.0" y="70" width="130" height="24" rx="4"/>
  <text class="dg-code" x="610.0" y="86.0" text-anchor="middle">last: (100, 4)</text>
  <rect class="dg-box" x="545.0" y="100" width="130" height="24" rx="4"/>
  <text class="dg-code" x="610.0" y="116.0" text-anchor="middle">clock: 103</text>
  <text class="dg-mono dg-muted-text" x="520.0" y="142" text-anchor="middle">MESSAGE (100, 7)</text>
  <path class="dg-arrow" d="M430 150 H602" marker-end="url(#hlc-receive-head)"/>
  <rect class="dg-box-accent" x="545.0" y="160" width="130" height="24" rx="4"/>
  <text class="dg-code" x="610.0" y="176.0" text-anchor="middle">now: (103, 0)</text>
  <text class="dg-mono dg-accent-text" x="540" y="228" text-anchor="middle">PHYSICAL 103 IS LARGEST: COUNTER 0</text>
</svg>
