<svg class="diagram-svg" viewBox="0 0 720 370" role="img" aria-labelledby="encoding-integer-range-title encoding-integer-range-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="encoding-integer-range-title">A wider Protobuf type still has old readers</title>
  <desc id="encoding-integer-range-desc">Hypothetical int32 to int64 widening, not the history of the article schema, which already uses int64. Both old and new readers obtain 1990. For the wider value 4294967303, equal to two to the power 32 plus 7, the old int32 reader obtains 7 while the int64 reader preserves the value.</desc>
  <defs>
    <marker id="encoding-integer-range-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="encoding-integer-range-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="354"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Write inside the old range</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">considered int32 → int64 change</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Write outside the old range</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">considered int32 → int64 change</text>
  <rect class="dg-box" x="24" y="72" width="312" height="50" rx="6"/>
  <text class="dg-code" x="38" y="100">int64 writer: 1990</text>
  <path class="dg-arrow" d="M180 122 V190" marker-end="url(#encoding-integer-range-head)"/>
  <text class="dg-mono dg-muted-text" x="194" y="160.0">READ</text>
  <rect class="dg-box" x="24" y="190" width="312" height="76" rx="6"/>
  <text class="dg-code" x="38" y="218">int64 reader: 1990</text>
  <text class="dg-code" x="38" y="244">int32 reader: 1990</text>
  <text class="dg-result" x="180" y="320" text-anchor="middle">Both preserve the value</text>
  <rect class="dg-box" x="384" y="72" width="312" height="50" rx="6"/>
  <text class="dg-code" x="398" y="100">int64 writer: 4294967303</text>
  <path class="dg-arrow" d="M540 122 V190" marker-end="url(#encoding-integer-range-head)"/>
  <text class="dg-mono dg-muted-text" x="554" y="160.0">READ</text>
  <rect class="dg-box-accent" x="384" y="190" width="312" height="76" rx="6"/>
  <text class="dg-code" x="398" y="218">int64 reader: 4294967303</text>
  <text class="dg-code" x="398" y="244">int32 reader: 7</text>
  <text class="dg-result" x="540" y="320" text-anchor="middle">Old reader truncates the value</text>
</svg>
