<svg class="diagram-svg" viewBox="0 0 720 430" role="img" aria-labelledby="encoding-translation-loss-title encoding-translation-loss-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="encoding-translation-loss-title">Translation must preserve the promised meaning</title>
  <desc id="encoding-translation-loss-desc">An old delivery_note string can become a one-item delivery_steps list. Converting a multi-item list to plain text can lose item boundaries: two lists shown here produce the same joined text. That is acceptable only if the old contract needs plain text and preserves its meaning, not when it needs to distinguish those list structures.</desc>
  <defs>
    <marker id="encoding-translation-loss-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="encoding-translation-loss-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="414"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">String → one-item list</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">keep the original text</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">List → plain text</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">item boundaries can disappear</text>
  <rect class="dg-box" x="24" y="72" width="312" height="76" rx="6"/>
  <text class="dg-code" x="38" y="100">delivery_note:</text>
  <text class="dg-code" x="38" y="126">  "Leave at reception"</text>
  <rect class="dg-box" x="384" y="72" width="312" height="102" rx="6"/>
  <text class="dg-code" x="398" y="100">delivery_steps:</text>
  <text class="dg-code" x="398" y="126">  ["Ring; wait", "Leave"]</text>
  <text class="dg-code" x="398" y="152">  or ["Ring", "wait; Leave"]</text>
  <path class="dg-arrow" d="M180 148 V232" marker-end="url(#encoding-translation-loss-head)"/>
  <text class="dg-mono dg-muted-text" x="194" y="194.0">WRAP TEXT</text>
  <path class="dg-arrow" d="M540 174 V232" marker-end="url(#encoding-translation-loss-head)"/>
  <text class="dg-mono dg-muted-text" x="554" y="207.0">JOIN WITH ;</text>
  <rect class="dg-box-accent" x="24" y="232" width="312" height="76" rx="6"/>
  <text class="dg-code" x="38" y="260">delivery_steps:</text>
  <text class="dg-code" x="38" y="286">  ["Leave at reception"]</text>
  <rect class="dg-box-accent" x="384" y="232" width="312" height="76" rx="6"/>
  <text class="dg-code" x="398" y="260">delivery_note:</text>
  <text class="dg-code" x="398" y="286">  "Ring; wait; Leave"</text>
  <text class="dg-result" x="180" y="358" text-anchor="middle">Original text survives</text>
  <text class="dg-result" x="540" y="358" text-anchor="middle">Different lists, identical text</text>
  <text class="dg-sub" x="540" y="390" text-anchor="middle">safe only when the promised meaning survives</text>
</svg>
