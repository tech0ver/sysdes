<svg class="diagram-svg" viewBox="0 0 720 222" role="img" aria-labelledby="ordered-writes-title ordered-writes-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ordered-writes-title">Writes keyed by time alone and by workspace first</title>
  <desc id="ordered-writes-desc">Three new activity entries from workspaces 12, 42, and 77 arrive on Oct 17 at 10:01 and 10:02. Keyed by created_at, all three fall into the last range, from Oct 17 on, so shard 3 takes every write. Keyed by workspace_id and then created_at, they fall into the ranges of their workspaces on shards 1, 2, and 3.</desc>
  <defs>
    <marker id="ordered-writes-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ordered-writes-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="214"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">Key: created_at</text>
  <text class="dg-mono dg-muted-text" x="180" y="42" text-anchor="middle">NEW ENTRIES, OCT 17</text>
  <rect class="dg-chip" x="14" y="50" width="100" height="22" rx="4"/>
  <text class="dg-code" x="64.0" y="65.0" text-anchor="middle">ws 12, 10:01</text>
  <rect class="dg-chip" x="130" y="50" width="100" height="22" rx="4"/>
  <text class="dg-code" x="180.0" y="65.0" text-anchor="middle">ws 42, 10:01</text>
  <rect class="dg-chip" x="246" y="50" width="100" height="22" rx="4"/>
  <text class="dg-code" x="296.0" y="65.0" text-anchor="middle">ws 77, 10:02</text>
  <rect class="dg-box" x="12" y="140" width="104" height="46" rx="6"/>
  <text class="dg-name" x="64" y="160" text-anchor="middle">Shard 1</text>
  <text class="dg-sub" x="64" y="177" text-anchor="middle">before Oct 16</text>
  <rect class="dg-box" x="128" y="140" width="104" height="46" rx="6"/>
  <text class="dg-name" x="180" y="160" text-anchor="middle">Shard 2</text>
  <text class="dg-sub" x="180" y="177" text-anchor="middle">Oct 16</text>
  <rect class="dg-box-accent" x="244" y="140" width="104" height="46" rx="6"/>
  <text class="dg-name" x="296" y="160" text-anchor="middle">Shard 3</text>
  <text class="dg-sub" x="296" y="177" text-anchor="middle">Oct 17 on</text>
  <path class="dg-arrow dg-message" d="M64 72 L274 132" marker-end="url(#ordered-writes-head-accent)"/>
  <path class="dg-arrow dg-message" d="M180 72 L296 132" marker-end="url(#ordered-writes-head-accent)"/>
  <path class="dg-arrow dg-message" d="M296 72 L318 132" marker-end="url(#ordered-writes-head-accent)"/>
  <text class="dg-result" x="180" y="210" text-anchor="middle">One shard takes every write</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Key: (workspace_id, created_at)</text>
  <text class="dg-mono dg-muted-text" x="540" y="42" text-anchor="middle">NEW ENTRIES, OCT 17</text>
  <rect class="dg-chip" x="374" y="50" width="100" height="22" rx="4"/>
  <text class="dg-code" x="424.0" y="65.0" text-anchor="middle">ws 12, 10:01</text>
  <rect class="dg-chip" x="490" y="50" width="100" height="22" rx="4"/>
  <text class="dg-code" x="540.0" y="65.0" text-anchor="middle">ws 42, 10:01</text>
  <rect class="dg-chip" x="606" y="50" width="100" height="22" rx="4"/>
  <text class="dg-code" x="656.0" y="65.0" text-anchor="middle">ws 77, 10:02</text>
  <rect class="dg-box" x="372" y="140" width="104" height="46" rx="6"/>
  <text class="dg-name" x="424" y="160" text-anchor="middle">Shard 1</text>
  <text class="dg-sub" x="424" y="177" text-anchor="middle">ws 1–30</text>
  <rect class="dg-box" x="488" y="140" width="104" height="46" rx="6"/>
  <text class="dg-name" x="540" y="160" text-anchor="middle">Shard 2</text>
  <text class="dg-sub" x="540" y="177" text-anchor="middle">ws 31–60</text>
  <rect class="dg-box" x="604" y="140" width="104" height="46" rx="6"/>
  <text class="dg-name" x="656" y="160" text-anchor="middle">Shard 3</text>
  <text class="dg-sub" x="656" y="177" text-anchor="middle">ws 61–90</text>
  <path class="dg-arrow" d="M424 72 L424 132" marker-end="url(#ordered-writes-head)"/>
  <path class="dg-arrow" d="M540 72 L540 132" marker-end="url(#ordered-writes-head)"/>
  <path class="dg-arrow" d="M656 72 L656 132" marker-end="url(#ordered-writes-head)"/>
  <text class="dg-result" x="540" y="210" text-anchor="middle">Writes spread over shards</text>
</svg>
