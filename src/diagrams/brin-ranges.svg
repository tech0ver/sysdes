<svg class="diagram-svg" viewBox="0 0 694 250" role="img" aria-labelledby="brin-ranges-title brin-ranges-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="brin-ranges-title">A BRIN index before and after a late insert</title>
  <desc id="brin-ranges-desc">Five ranges of four pages each, with the lowest and highest date in each range. Top: rows arrive in time order, and a query for 2 May reads only the first range. Bottom: a row dated 2 May was inserted late into the last range, which now covers 2 to 15 May, so the same query reads two ranges.</desc>
  <defs>
    <marker id="brin-ranges-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="brin-ranges-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-13 0)">
