<svg class="diagram-svg" viewBox="0 0 720 330" role="img" aria-labelledby="timeout-choice-title timeout-choice-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="timeout-choice-title">The same pause with a short and a long session timeout</title>
  <desc id="timeout-choice-desc">Both panels show node 9 in a garbage collection pause of 6 seconds, during which it sends no heartbeats. Left, a timeout of 4 seconds: the session ends at 4 seconds, the heartbeat after the pause comes too late, and the controller moves 128 replicas off a healthy node. Right, a timeout of 10 seconds: the heartbeat arrives at 6 seconds, with 4 seconds left, and restarts the timer. A time axis from 0 to 10 seconds runs between the panels.</desc>
  <defs>
    <marker id="timeout-choice-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="timeout-choice-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Timeout 4 s</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Timeout 10 s</text>
  <line class="dg-rule" x1="360" y1="66" x2="360" y2="282"/>
  <line class="dg-line" x1="354" y1="76" x2="366" y2="76"/>
  <text class="dg-mono dg-muted-text" x="372" y="80" text-anchor="start">0 s</text>
  <line class="dg-line" x1="354" y1="116" x2="366" y2="116"/>
  <text class="dg-mono dg-muted-text" x="372" y="120" text-anchor="start">2 s</text>
  <line class="dg-line" x1="354" y1="156" x2="366" y2="156"/>
  <text class="dg-mono dg-muted-text" x="372" y="160" text-anchor="start">4 s</text>
  <line class="dg-line" x1="354" y1="196" x2="366" y2="196"/>
  <text class="dg-mono dg-muted-text" x="372" y="200" text-anchor="start">6 s</text>
  <line class="dg-line" x1="354" y1="236" x2="366" y2="236"/>
  <text class="dg-mono dg-muted-text" x="372" y="240" text-anchor="start">8 s</text>
  <line class="dg-line" x1="354" y1="276" x2="366" y2="276"/>
  <text class="dg-mono dg-muted-text" x="372" y="280" text-anchor="start">10 s</text>
  <text class="dg-mono dg-muted-text" x="90" y="52" text-anchor="middle">NODE 9</text>
  <line class="dg-lifeline" x1="90" y1="60" x2="90" y2="296"/>
  <text class="dg-mono dg-muted-text" x="250" y="52" text-anchor="middle">SERVICE</text>
  <line class="dg-lifeline" x1="250" y1="60" x2="250" y2="296"/>
  <rect class="dg-box-failed" x="40" y="76" width="100" height="120" rx="4"/>
  <text class="dg-code-muted" x="90.0" y="140.0" text-anchor="middle">GC pause</text>
  <line class="dg-arrow dg-wait" x1="250" y1="76" x2="250" y2="156"/>
  <text class="dg-mono dg-accent-text" x="260" y="120.0" text-anchor="start">TIMEOUT 4 s</text>
  <rect class="dg-box-accent" x="190.0" y="162" width="120" height="24" rx="4"/>
  <text class="dg-code" x="250.0" y="178.0" text-anchor="middle">session ends</text>
  <path class="dg-arrow dg-empty" d="M140 196 H242" marker-end="url(#timeout-choice-head)"/>
  <text class="dg-mono dg-muted-text" x="181.0" y="212" text-anchor="middle">LATE HEARTBEAT</text>
  <text class="dg-mono dg-muted-text" x="450" y="52" text-anchor="middle">NODE 9</text>
  <line class="dg-lifeline" x1="450" y1="60" x2="450" y2="296"/>
  <text class="dg-mono dg-muted-text" x="610" y="52" text-anchor="middle">SERVICE</text>
  <line class="dg-lifeline" x1="610" y1="60" x2="610" y2="296"/>
  <rect class="dg-box-failed" x="400" y="76" width="100" height="120" rx="4"/>
  <text class="dg-code-muted" x="450.0" y="140.0" text-anchor="middle">GC pause</text>
  <line class="dg-arrow dg-wait" x1="610" y1="76" x2="610" y2="196"/>
  <text class="dg-mono dg-accent-text" x="620" y="140.0" text-anchor="start">6 s OF 10 USED</text>
  <path class="dg-arrow" d="M500 196 H602" marker-end="url(#timeout-choice-head)"/>
  <text class="dg-mono dg-muted-text" x="541.0" y="212" text-anchor="middle">RENEWED, 4 s LEFT</text>
  <text class="dg-result" x="180" y="312" text-anchor="middle">128 replicas leave a healthy node</text>
  <text class="dg-result" x="540" y="312" text-anchor="middle">The pause passes unnoticed</text>
</svg>
