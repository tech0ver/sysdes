<svg class="sk-svg" viewBox="0 0 312 212" role="img" aria-labelledby="framework-data-flow-title framework-data-flow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="framework-data-flow-title">Board after the data flow</title>
