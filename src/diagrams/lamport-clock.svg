<svg class="diagram-svg" viewBox="0 0 720 328" role="img" aria-labelledby="lamport-clock-title lamport-clock-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lamport-clock-title">Lamport numbers on the same events, and the one sort order they give</title>
  <desc id="lamport-clock-desc">Payments (P1): payment 1, message sent 2. Refunds (P2): a check 1, then it receives the message with 2, so the receive gets max(1, 2) + 1 = 3, and the refund gets 4. Reports (P3): report 1, export 2. Sorted by (number, process ID): (1, P1), (1, P2), (1, P3), (2, P1), (2, P3), (3, P2), (4, P2). The refund sorts after the payment.</desc>
  <defs>
    <marker id="lamport-clock-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="lamport-clock-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="140" y="20" text-anchor="middle">P1, PAYMENTS</text>
  <line class="dg-lifeline" x1="140" y1="34" x2="140" y2="222"/>
  <text class="dg-mono dg-muted-text" x="380" y="20" text-anchor="middle">P2, REFUNDS</text>
  <line class="dg-lifeline" x1="380" y1="34" x2="380" y2="222"/>
  <text class="dg-mono dg-muted-text" x="600" y="20" text-anchor="middle">P3, REPORTS</text>
  <line class="dg-lifeline" x1="600" y1="34" x2="600" y2="222"/>
  <circle class="dg-dot-muted" cx="140" cy="70" r="4"/>
  <rect class="dg-chip" x="112.7" y="58" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="120.35000000000001" y="74.0" text-anchor="middle">1</text>
  <text class="dg-sub" x="104.7" y="74" text-anchor="end">payment</text>
  <circle class="dg-dot-muted" cx="140" cy="110" r="4"/>
  <rect class="dg-chip" x="112.7" y="98" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="120.35000000000001" y="114.0" text-anchor="middle">2</text>
  <text class="dg-sub" x="104.7" y="114" text-anchor="end">sent</text>
  <path class="dg-arrow" d="M140 110 L372.2 158.4" marker-end="url(#lamport-clock-head)"/>
  <text class="dg-mono dg-muted-text" x="260.0" y="124" text-anchor="middle">CARRIES 2</text>
  <circle class="dg-dot-muted" cx="380" cy="80" r="4"/>
  <rect class="dg-chip" x="392" y="68" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="399.65" y="84.0" text-anchor="middle">1</text>
  <text class="dg-sub" x="415.3" y="84" text-anchor="start">check</text>
  <circle class="dg-dot" cx="380" cy="160" r="4"/>
  <rect class="dg-box-accent" x="392" y="148" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="399.65" y="164.0" text-anchor="middle">3</text>
  <text class="dg-sub" x="415.3" y="164" text-anchor="start">received: max(1, 2) + 1</text>
  <circle class="dg-dot-muted" cx="380" cy="200" r="4"/>
  <rect class="dg-chip" x="392" y="188" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="399.65" y="204.0" text-anchor="middle">4</text>
  <text class="dg-sub" x="415.3" y="204" text-anchor="start">refund</text>
  <circle class="dg-dot-muted" cx="600" cy="90" r="4"/>
  <rect class="dg-chip" x="572.7" y="78" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="580.35" y="94.0" text-anchor="middle">1</text>
  <text class="dg-sub" x="564.7" y="94" text-anchor="end">report</text>
  <circle class="dg-dot-muted" cx="600" cy="180" r="4"/>
  <rect class="dg-chip" x="572.7" y="168" width="15.3" height="24" rx="4"/>
  <text class="dg-code" x="580.35" y="184.0" text-anchor="middle">2</text>
  <text class="dg-sub" x="564.7" y="184" text-anchor="end">export</text>
  <line class="dg-rule" x1="8" y1="238" x2="712" y2="238"/>
  <text class="dg-mono dg-muted-text" x="360" y="262" text-anchor="middle">SORTED BY (NUMBER, PROCESS ID)</text>
  <rect class="dg-chip" x="52" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="92.0" y="292.0" text-anchor="middle">1, P1</text>
  <text class="dg-sub" x="92" y="318" text-anchor="middle">payment</text>
  <rect class="dg-chip" x="142" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="182.0" y="292.0" text-anchor="middle">1, P2</text>
  <text class="dg-sub" x="182" y="318" text-anchor="middle">check</text>
  <rect class="dg-chip" x="232" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="272.0" y="292.0" text-anchor="middle">1, P3</text>
  <text class="dg-sub" x="272" y="318" text-anchor="middle">report</text>
  <rect class="dg-chip" x="322" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="362.0" y="292.0" text-anchor="middle">2, P1</text>
  <text class="dg-sub" x="362" y="318" text-anchor="middle">sent</text>
  <rect class="dg-chip" x="412" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="452.0" y="292.0" text-anchor="middle">2, P3</text>
  <text class="dg-sub" x="452" y="318" text-anchor="middle">export</text>
  <rect class="dg-chip" x="502" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="542.0" y="292.0" text-anchor="middle">3, P2</text>
  <text class="dg-sub" x="542" y="318" text-anchor="middle">received</text>
  <rect class="dg-chip" x="592" y="276" width="80" height="24" rx="4"/>
  <text class="dg-code" x="632.0" y="292.0" text-anchor="middle">4, P2</text>
  <text class="dg-sub" x="632" y="318" text-anchor="middle">refund</text>
</svg>
