<svg class="diagram-svg" viewBox="0 0 720 420" role="img" aria-labelledby="jsonb-indexes-title jsonb-indexes-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jsonb-indexes-title">A GIN index and an expression index on the same documents</title>
  <desc id="jsonb-indexes-desc">Three homes with JSONB attributes. Left, a GIN index on the whole column has an entry for every key and every value: elevator, floor, parking, pool, 3, street, and true, each with the homes that contain it. Right, a B-tree index on attrs-&gt;&gt;'floor' has one entry per home: 3 for home 3317 and NULL for the others. On 2.4 million documents, such a GIN index took 1,680 MB and the B-tree 61 MB.</desc>
  <defs>
    <marker id="jsonb-indexes-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="jsonb-indexes-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="160" y="24">HOMES</text>
  <rect class="dg-chip" x="160" y="34" width="60" height="24" rx="4"/>
  <text class="dg-code" x="190.0" y="50.0" text-anchor="middle">1042</text>
  <rect class="dg-box" x="226" y="34" width="334" height="24" rx="4"/>
  <text class="dg-code" x="393.0" y="50.0" text-anchor="middle">{"pool": true, "parking": "street"}</text>
  <rect class="dg-chip" x="160" y="64" width="60" height="24" rx="4"/>
  <text class="dg-code" x="190.0" y="80.0" text-anchor="middle">2210</text>
  <rect class="dg-box" x="226" y="64" width="334" height="24" rx="4"/>
  <text class="dg-code" x="393.0" y="80.0" text-anchor="middle">{"pool": true}</text>
  <rect class="dg-chip" x="160" y="94" width="60" height="24" rx="4"/>
  <text class="dg-code" x="190.0" y="110.0" text-anchor="middle">3317</text>
  <rect class="dg-box" x="226" y="94" width="334" height="24" rx="4"/>
  <text class="dg-code" x="393.0" y="110.0" text-anchor="middle">{"floor": 3, "elevator": true}</text>
  <line class="dg-rule" x1="16" y1="136" x2="704" y2="136"/>
  <line class="dg-rule" x1="360" y1="148" x2="360" y2="412"/>
  <text class="dg-code" x="180" y="166" text-anchor="middle">GIN on attrs</text>
  <text class="dg-code" x="540" y="166" text-anchor="middle">B-tree on (attrs-&gt;&gt;'floor')</text>
  <rect class="dg-box" x="40" y="182" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="197.0" text-anchor="middle">elevator</text>
  <path class="dg-arrow" d="M146 193 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="197">3317</text>
  <rect class="dg-box" x="40" y="210" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="225.0" text-anchor="middle">floor</text>
  <path class="dg-arrow" d="M146 221 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="225">3317</text>
  <rect class="dg-box" x="40" y="238" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="253.0" text-anchor="middle">parking</text>
  <path class="dg-arrow" d="M146 249 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="253">1042</text>
  <rect class="dg-box" x="40" y="266" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="281.0" text-anchor="middle">pool</text>
  <path class="dg-arrow" d="M146 277 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="281">1042 2210</text>
  <rect class="dg-box" x="40" y="294" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="309.0" text-anchor="middle">3</text>
  <path class="dg-arrow" d="M146 305 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="309">3317</text>
  <rect class="dg-box" x="40" y="322" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="337.0" text-anchor="middle">"street"</text>
  <path class="dg-arrow" d="M146 333 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="337">1042</text>
  <rect class="dg-box" x="40" y="350" width="100" height="22" rx="4"/>
  <text class="dg-code" x="90.0" y="365.0" text-anchor="middle">true</text>
  <path class="dg-arrow" d="M146 361 H164" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="172" y="365">1042 2210 3317</text>
  <rect class="dg-box" x="400" y="182" width="100" height="22" rx="4"/>
  <text class="dg-code" x="450.0" y="197.0" text-anchor="middle">3</text>
  <path class="dg-arrow" d="M506 193 H524" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code" x="532" y="197">3317</text>
  <rect class="dg-box-failed" x="400" y="210" width="100" height="22" rx="4"/>
  <text class="dg-code-muted" x="450.0" y="225.0" text-anchor="middle">NULL</text>
  <path class="dg-arrow" d="M506 221 H524" marker-end="url(#jsonb-indexes-head)"/>
  <text class="dg-code-muted" x="532" y="225">1042 2210</text>
  <text class="dg-result" x="180" y="400" text-anchor="middle">1,680 MB on 2.4 M documents</text>
  <text class="dg-result" x="540" y="400" text-anchor="middle">61 MB on 2.4 M documents</text>
</svg>
