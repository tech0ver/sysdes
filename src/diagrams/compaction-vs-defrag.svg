<svg class="diagram-svg" viewBox="0 0 720 196" role="img" aria-labelledby="compaction-vs-defrag-title compaction-vs-defrag-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="compaction-vs-defrag-title">Compaction frees space inside the file; defragmentation shrinks the file</title>
  <desc id="compaction-vs-defrag-desc">The database file is 2 GiB: 0.3 GiB of current data and 1.7 GiB of old versions. After compaction, the old versions are gone, but the file is still 2 GiB, with 1.7 GiB free inside. After defragmentation, the file is 0.3 GiB.</desc>
  <defs>
    <marker id="compaction-vs-defrag-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="compaction-vs-defrag-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="40" y="26" text-anchor="start">BEFORE</text>
  <rect class="dg-box" x="40" y="34" width="84.0" height="30" rx="3"/>
  <text class="dg-code" x="82.0" y="53" text-anchor="middle">current</text>
  <rect class="dg-chip" x="124.0" y="34" width="476.0" height="30" rx="3"/>
  <text class="dg-code" x="362.0" y="53" text-anchor="middle">old versions 1.7 GiB</text>
  <text class="dg-code" x="612.0" y="53" text-anchor="start">file: 2 GiB</text>
  <text class="dg-mono dg-muted-text" x="40" y="88" text-anchor="start">AFTER COMPACTION</text>
  <rect class="dg-box" x="40" y="96" width="84.0" height="30" rx="3"/>
  <text class="dg-code" x="82.0" y="115" text-anchor="middle">current</text>
  <rect class="dg-box-failed" x="124.0" y="96" width="476.0" height="30" rx="3"/>
  <text class="dg-code" x="362.0" y="115" text-anchor="middle">free inside the file 1.7 GiB</text>
  <text class="dg-code" x="612.0" y="115" text-anchor="start">file: 2 GiB</text>
  <text class="dg-mono dg-accent-text" x="40" y="150" text-anchor="start">AFTER DEFRAGMENTATION</text>
  <rect class="dg-box" x="40" y="158" width="84.0" height="30" rx="3"/>
  <text class="dg-code" x="82.0" y="177" text-anchor="middle">current</text>
  <text class="dg-code" x="136.0" y="177" text-anchor="start">file: 0.3 GiB</text>
</svg>
