<svg class="diagram-svg" viewBox="0 0 720 268" role="img" aria-labelledby="write-round-trip-title write-round-trip-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="write-round-trip-title">A transfer from New York waits for Europe; a read that allows stale data does not</title>
  <desc id="write-round-trip-desc">Left: a client in New York sends a transfer to the leader in Europe and waits for its answer, a round trip across the ocean. Right: the client reads its balance, where stale data is allowed, from the US copy nearby; it waits only for a local round trip.</desc>
  <defs>
    <marker id="write-round-trip-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="write-round-trip-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="260"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">Transfer: to the leader</text>
  <text class="dg-mono dg-muted-text" x="50" y="54" text-anchor="middle">CLIENT, NY</text>
  <line class="dg-lifeline" x1="50" y1="68" x2="50" y2="234"/>
  <text class="dg-mono dg-muted-text" x="170" y="54" text-anchor="middle">US COPY</text>
  <line class="dg-lifeline" x1="170" y1="68" x2="170" y2="234"/>
  <text class="dg-mono dg-muted-text" x="300" y="54" text-anchor="middle">EU LEADER</text>
  <line class="dg-lifeline" x1="300" y1="68" x2="300" y2="234"/>
  <path class="dg-arrow" d="M50 84 L292.3 148.0" marker-end="url(#write-round-trip-head)"/>
  <text class="dg-mono dg-muted-text" x="175.0" y="104" text-anchor="middle">TRANSFER</text>
  <path class="dg-arrow" d="M300 158 L57.7 222.0" marker-end="url(#write-round-trip-head)"/>
  <text class="dg-mono dg-muted-text" x="175.0" y="178" text-anchor="middle">DONE</text>
  <path class="dg-bracket-accent" d="M38 84 H32 V224 H38"/>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Balance read, staleness allowed</text>
  <text class="dg-mono dg-muted-text" x="410" y="54" text-anchor="middle">CLIENT, NY</text>
  <line class="dg-lifeline" x1="410" y1="68" x2="410" y2="234"/>
  <text class="dg-mono dg-muted-text" x="530" y="54" text-anchor="middle">US COPY</text>
  <line class="dg-lifeline" x1="530" y1="68" x2="530" y2="234"/>
  <text class="dg-mono dg-muted-text" x="660" y="54" text-anchor="middle">EU LEADER</text>
  <line class="dg-lifeline" x1="660" y1="68" x2="660" y2="234"/>
  <path class="dg-arrow" d="M410 84 L522.0 95.2" marker-end="url(#write-round-trip-head)"/>
  <text class="dg-mono dg-muted-text" x="470.0" y="80" text-anchor="middle">READ</text>
  <path class="dg-arrow" d="M530 104 L418.0 115.2" marker-end="url(#write-round-trip-head)"/>
  <text class="dg-mono dg-muted-text" x="470.0" y="132" text-anchor="middle">$150</text>
  <path class="dg-bracket-accent" d="M398 84 H392 V116 H398"/>
  <text class="dg-mono dg-accent-text" x="180" y="256" text-anchor="middle">CROSS-REGION ROUND TRIP</text>
  <text class="dg-mono dg-accent-text" x="540" y="256" text-anchor="middle">LOCAL ROUND TRIP</text>
</svg>
