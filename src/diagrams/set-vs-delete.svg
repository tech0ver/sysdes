<svg class="diagram-svg" viewBox="0 0 696 310" role="img" aria-labelledby="set-vs-delete-title set-vs-delete-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="set-vs-delete-title">Writing the new value versus deleting the key</title>
  <desc id="set-vs-delete-desc">Two writers commit A and then B. Left: they write their values into the cache in the other order, B and then A, so the cache keeps the older A. Right: they delete the key instead; the next read misses and loads B from the database.</desc>
  <defs>
    <marker id="set-vs-delete-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="set-vs-delete-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-12 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="302"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Set the new value</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">commits: A, then B</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="58" text-anchor="middle">DATABASE</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="58" text-anchor="middle">CACHE</text>
  <text class="dg-mono dg-muted-text" x="180.0" y="58" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="98.0" y1="66" x2="98.0" y2="262"/>
  <line class="dg-lifeline" x1="262.0" y1="66" x2="262.0" y2="262"/>
  <path class="dg-arrow" d="M180.0 66 V262" marker-end="url(#set-vs-delete-head)"/>
  <rect class="dg-box" x="28.0" y="76" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="93" text-anchor="middle">commit A</text>
  <rect class="dg-box" x="28.0" y="112" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="129" text-anchor="middle">commit B</text>
  <rect class="dg-box" x="192.0" y="148" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="165" text-anchor="middle">set B</text>
  <rect class="dg-box-accent" x="192.0" y="184" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="201" text-anchor="middle">set A</text>
  <text class="dg-result" x="180.0" y="288" text-anchor="middle">The cache keeps A</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Delete the key</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">commits: A, then B</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="58" text-anchor="middle">DATABASE</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="58" text-anchor="middle">CACHE</text>
  <text class="dg-mono dg-muted-text" x="540.0" y="58" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="458.0" y1="66" x2="458.0" y2="262"/>
  <line class="dg-lifeline" x1="622.0" y1="66" x2="622.0" y2="262"/>
  <path class="dg-arrow" d="M540.0 66 V262" marker-end="url(#set-vs-delete-head)"/>
  <rect class="dg-box" x="388.0" y="76" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="93" text-anchor="middle">commit A</text>
  <rect class="dg-box" x="388.0" y="112" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="129" text-anchor="middle">commit B</text>
  <rect class="dg-box" x="552.0" y="148" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="165" text-anchor="middle">delete</text>
  <rect class="dg-box" x="552.0" y="184" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="201" text-anchor="middle">delete</text>
  <rect class="dg-box-accent" x="552.0" y="220" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="237" text-anchor="middle">read: load B</text>
  <text class="dg-result" x="540.0" y="288" text-anchor="middle">The next read gets B</text>
  </g>
</svg>
