<svg class="diagram-svg" viewBox="0 0 690 250" role="img" aria-labelledby="sequence-gaps-title sequence-gaps-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="sequence-gaps-title">Every number a sequence gives out is used up, even when no row keeps it</title>
  <desc id="sequence-gaps-desc">Seven calls to a sequence return 1 to 7. The transactions that got 1, 3, 5, and 7 commit. The one that got 2 rolls back, the insert with 4 fails a CHECK constraint, and the insert with 6 ends in ON CONFLICT DO NOTHING. The table holds 1, 3, 5, and 7, with gaps at 2, 4, and 6. After a crash, the next call returns 34, because the sequence had logged its position 32 numbers ahead.</desc>
  <defs>
    <marker id="sequence-gaps-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="sequence-gaps-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-7 0)">
  <text class="dg-mono dg-muted-text" x="24" y="24">NUMBERS THE SEQUENCE GAVE OUT</text>
  <rect class="dg-box" x="24" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="64.0" y="54.0" text-anchor="middle">1</text>
  <text class="dg-mono dg-muted-text" x="64" y="84" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="120" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="160.0" y="54.0" text-anchor="middle">2</text>
  <text class="dg-mono dg-accent-text" x="160" y="84" text-anchor="middle">ROLLBACK</text>
  <rect class="dg-box" x="216" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="256.0" y="54.0" text-anchor="middle">3</text>
  <text class="dg-mono dg-muted-text" x="256" y="84" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="312" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="352.0" y="54.0" text-anchor="middle">4</text>
  <text class="dg-mono dg-accent-text" x="352" y="84" text-anchor="middle">CHECK FAILED</text>
  <rect class="dg-box" x="408" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="448.0" y="54.0" text-anchor="middle">5</text>
  <text class="dg-mono dg-muted-text" x="448" y="84" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="504" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="544.0" y="54.0" text-anchor="middle">6</text>
  <text class="dg-mono dg-accent-text" x="544" y="84" text-anchor="middle">ON CONFLICT</text>
  <rect class="dg-box" x="600" y="36" width="80" height="28" rx="4"/>
  <text class="dg-code" x="640.0" y="54.0" text-anchor="middle">7</text>
  <text class="dg-mono dg-muted-text" x="640" y="84" text-anchor="middle">COMMIT</text>
  <text class="dg-mono dg-muted-text" x="24" y="124">ROWS IN THE TABLE</text>
  <rect class="dg-box" x="24" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code" x="64.0" y="154.0" text-anchor="middle">1</text>
  <rect class="dg-box-failed" x="120" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code-muted" x="160.0" y="154.0" text-anchor="middle">gap</text>
  <rect class="dg-box" x="216" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code" x="256.0" y="154.0" text-anchor="middle">3</text>
  <rect class="dg-box-failed" x="312" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code-muted" x="352.0" y="154.0" text-anchor="middle">gap</text>
  <rect class="dg-box" x="408" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code" x="448.0" y="154.0" text-anchor="middle">5</text>
  <rect class="dg-box-failed" x="504" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code-muted" x="544.0" y="154.0" text-anchor="middle">gap</text>
  <rect class="dg-box" x="600" y="136" width="80" height="28" rx="4"/>
  <text class="dg-code" x="640.0" y="154.0" text-anchor="middle">7</text>
  <text class="dg-mono dg-muted-text" x="24" y="204">AFTER A CRASH, THE NEXT CALL RETURNS</text>
  <rect class="dg-box-accent" x="408" y="188" width="80" height="28" rx="4"/>
  <text class="dg-code" x="448.0" y="206.0" text-anchor="middle">34</text>
  <text class="dg-sub" x="500" y="207">the log already said 33</text>
  </g>
</svg>
