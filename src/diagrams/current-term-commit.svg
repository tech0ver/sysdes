<svg class="diagram-svg" viewBox="0 0 720 250" role="img" aria-labelledby="current-term-commit-title current-term-commit-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="current-term-commit-title">An older entry commits only with an entry of the current term</title>
  <desc id="current-term-commit-desc">Columns are log positions 1 to 6; each cell shows the term in which that entry was written. Node 1 has just become the leader of term 3. Left: entry 5, from term 2, is on nodes 1 and 2, a majority, but it is not committed by that alone. Right: the leader appends an empty entry 6 in term 3 and saves it on nodes 1 and 2; once entry 6 is committed, entry 5 is committed with it.</desc>
