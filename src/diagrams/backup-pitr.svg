<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="backup-pitr-title backup-pitr-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="backup-pitr-title">Recovering from a bad write with a backup</title>
  <desc id="backup-pitr-desc">A time line from 13:00 to 14:40. At 14:02 a bad write sets every price to zero, and it is noticed at 14:40. The leader and the followers applied it at once and hold price 0. The delayed follower is one hour behind, at 13:40, so it still holds the good data. The backup is a snapshot from 13:00 plus the log archived since then. Recovery loads the snapshot and replays the archived log up to 14:01, just before the bad write.</desc>
  <defs>
    <marker id="backup-pitr-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="backup-pitr-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-line" x1="170" y1="40" x2="690" y2="40"/>
  <line class="dg-line" x1="170.0" y1="36" x2="170.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="170.0" y="28" text-anchor="middle">13:00</text>
  <line class="dg-line" x1="274.0" y1="36" x2="274.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="274.0" y="28" text-anchor="middle">13:20</text>
  <line class="dg-line" x1="378.0" y1="36" x2="378.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="378.0" y="28" text-anchor="middle">13:40</text>
  <line class="dg-line" x1="482.0" y1="36" x2="482.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="482.0" y="28" text-anchor="middle">14:00</text>
  <line class="dg-line" x1="586.0" y1="36" x2="586.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="586.0" y="28" text-anchor="middle">14:20</text>
  <line class="dg-line" x1="690.0" y1="36" x2="690.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="690.0" y="28" text-anchor="middle">14:40</text>
  <line class="dg-rule" x1="492.4" y1="48" x2="492.4" y2="262"/>
  <text class="dg-mono dg-muted-text" x="498.4" y="60" text-anchor="start">BAD WRITE, 14:02</text>
  <text class="dg-name" x="20" y="92" text-anchor="start">Leader, followers</text>
  <rect class="dg-box" x="170" y="76" width="322.4" height="24" rx="4"/>
  <text class="dg-code" x="331.2" y="92.0" text-anchor="middle">good data</text>
  <rect class="dg-box-failed" x="492.4" y="76" width="197.60000000000002" height="24" rx="4"/>
  <text class="dg-code-muted" x="591.2" y="92.0" text-anchor="middle">price 0</text>
  <text class="dg-name" x="20" y="136" text-anchor="start">Delayed follower</text>
  <rect class="dg-box" x="170" y="120" width="208.0" height="24" rx="4"/>
  <text class="dg-code" x="274.0" y="136.0" text-anchor="middle">good data, 1 h late</text>
  <text class="dg-name" x="20" y="180" text-anchor="start">Snapshot</text>
  <rect class="dg-chip" x="170" y="164" width="64" height="24" rx="4"/>
  <text class="dg-code" x="202.0" y="180.0" text-anchor="middle">13:00</text>
  <text class="dg-name" x="20" y="224" text-anchor="start">Archived log</text>
  <rect class="dg-chip" x="170" y="208" width="520.0" height="24" rx="4"/>
  <text class="dg-code" x="430.0" y="224.0" text-anchor="middle">every change since 13:00</text>
  <text class="dg-name" x="20" y="276" text-anchor="start">Recovery</text>
  <path class="dg-arrow dg-message" d="M170 272 H479.2" marker-end="url(#backup-pitr-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="328.6" y="264" text-anchor="middle">SNAPSHOT + LOG UP TO 14:01</text>
</svg>
