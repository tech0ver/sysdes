<svg class="diagram-svg" viewBox="0 0 720 316" role="img" aria-labelledby="timestamp-sources-title timestamp-sources-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="timestamp-sources-title">How three timestamp schemes order T1 and a later T2</title>
  <desc id="timestamp-sources-desc">In each panel, T1 finishes on node A, and later T2 starts on node B, with no message between them. Timestamp oracle: T1 gets 40 at its start and 41 at its commit from one counter, so T2 gets 42. TrueTime: T1 chooses the commit timestamp 10.007, the latest bound of its interval [10.000, 10.007], and waits until the earliest bound has passed 10.007; only then is T1 visible, so T2, which starts later, gets 10.015. Hybrid logical clock: T1 gets (10.000, 0) at real time 10.000 on node A; T2 starts at real time 10.003 on node B, whose clock is 5 ms behind, and gets (9.998, 0), a smaller timestamp.</desc>
  <defs>
    <marker id="timestamp-sources-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="timestamp-sources-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="360" y="20" text-anchor="middle">T1 FINISHES ON NODE A; LATER, T2 STARTS ON NODE B; NO MESSAGE BETWEEN THEM</text>
  <line class="dg-rule" x1="8" y1="34" x2="712" y2="34"/>
  <line class="dg-rule" x1="240" y1="42" x2="240" y2="308"/>
  <line class="dg-rule" x1="480" y1="42" x2="480" y2="308"/>
  <text class="dg-name" x="120" y="58" text-anchor="middle">Timestamp oracle</text>
  <rect class="dg-box" x="15" y="76" width="210" height="28" rx="4"/>
  <text class="dg-code" x="120.0" y="94.0" text-anchor="middle">T1: start 40, commit 41</text>
  <text class="dg-sub" x="120" y="122" text-anchor="middle">from one counter</text>
  <line class="dg-line dg-empty" x1="120" y1="134" x2="120" y2="184"/>
  <text class="dg-mono dg-muted-text" x="120" y="202" text-anchor="middle">ONE COUNTER</text>
  <rect class="dg-box" x="15" y="232" width="210" height="28" rx="4"/>
  <text class="dg-code" x="120.0" y="250.0" text-anchor="middle">T2: start 42</text>
  <text class="dg-result" x="120" y="296" text-anchor="middle">41 &lt; 42</text>
  <text class="dg-name" x="360" y="58" text-anchor="middle">TrueTime</text>
  <rect class="dg-box" x="255" y="76" width="210" height="28" rx="4"/>
  <text class="dg-code" x="360.0" y="94.0" text-anchor="middle">T1 timestamp: 10.007</text>
  <text class="dg-sub" x="360" y="122" text-anchor="middle">interval [10.000, 10.007]</text>
  <line class="dg-arrow dg-wait" x1="360" y1="134" x2="360" y2="184"/>
  <text class="dg-mono dg-accent-text" x="360" y="202" text-anchor="middle">COMMIT WAIT: EARLIEST &gt; 10.007</text>
  <text class="dg-sub" x="360" y="222" text-anchor="middle">T1 is visible only now</text>
  <rect class="dg-box" x="255" y="232" width="210" height="28" rx="4"/>
  <text class="dg-code" x="360.0" y="250.0" text-anchor="middle">T2: start 10.015</text>
  <text class="dg-result" x="360" y="296" text-anchor="middle">10.007 &lt; 10.015</text>
  <text class="dg-name" x="600" y="58" text-anchor="middle">Hybrid logical clock</text>
  <rect class="dg-box" x="495" y="76" width="210" height="28" rx="4"/>
  <text class="dg-code" x="600.0" y="94.0" text-anchor="middle">T1: (10.000, 0)</text>
  <text class="dg-sub" x="600" y="122" text-anchor="middle">node A, real 10.000</text>
  <line class="dg-line dg-empty" x1="600" y1="134" x2="600" y2="184"/>
  <text class="dg-mono dg-accent-text" x="600" y="202" text-anchor="middle">B'S CLOCK −5 MS</text>
  <text class="dg-sub" x="600" y="222" text-anchor="middle">node B, real 10.003</text>
  <rect class="dg-box-accent" x="495" y="232" width="210" height="28" rx="4"/>
  <text class="dg-code" x="600.0" y="250.0" text-anchor="middle">T2: (9.998, 0)</text>
  <text class="dg-result" x="600" y="296" text-anchor="middle">T2 sorts first</text>
</svg>
