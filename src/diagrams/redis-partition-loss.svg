<svg class="diagram-svg" viewBox="0 0 646 356" role="img" aria-labelledby="redis-partition-loss-title redis-partition-loss-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-partition-loss-title">Writes lost when a cut-off primary rejoins</title>
  <desc id="redis-partition-loss-desc">Time runs down. A network partition cuts the primary off together with app server 2. On the other side, the Sentinels promote the replica, and app server 1 writes to it. App server 2 keeps writing x = 5 to the old primary, which answers OK. When the partition heals, the old primary becomes a replica of the new one and drops x = 5. With min-replicas-to-write, the old primary would have refused writes 10 seconds after losing its replicas.</desc>
  <defs>
    <marker id="redis-partition-loss-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-partition-loss-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-37 0)">
  <text class="dg-mono dg-muted-text" x="70" y="24" text-anchor="middle">APP 2</text>
  <line class="dg-lifeline" x1="70" y1="36" x2="70" y2="292"/>
  <text class="dg-mono dg-muted-text" x="230" y="24" text-anchor="middle">OLD PRIMARY</text>
  <line class="dg-lifeline" x1="230" y1="36" x2="230" y2="292"/>
  <text class="dg-mono dg-muted-text" x="490" y="24" text-anchor="middle">NEW PRIMARY</text>
  <line class="dg-lifeline" x1="490" y1="36" x2="490" y2="292"/>
  <text class="dg-mono dg-muted-text" x="650" y="24" text-anchor="middle">APP 1</text>
  <line class="dg-lifeline" x1="650" y1="36" x2="650" y2="292"/>
  <rect class="dg-zone" x="330" y="40" width="60" height="200" rx="4"/>
  <text class="dg-mono dg-muted-text" x="360" y="256" text-anchor="middle">PARTITION</text>
  <rect class="dg-box" x="430.0" y="64" width="120" height="26" rx="4"/>
  <text class="dg-code" x="490.0" y="81.0" text-anchor="middle">promoted</text>
  <text class="dg-mono dg-muted-text" x="570.0" y="112" text-anchor="middle">SET y 1</text>
  <path class="dg-arrow" d="M650 120 H498" marker-end="url(#redis-partition-loss-head)"/>
  <text class="dg-mono dg-muted-text" x="570.0" y="136" text-anchor="middle">OK</text>
  <path class="dg-arrow" d="M490 144 H642" marker-end="url(#redis-partition-loss-head)"/>
  <text class="dg-mono dg-accent-text" x="150.0" y="112" text-anchor="middle">SET x 5</text>
  <path class="dg-arrow dg-message" d="M70 120 H222" marker-end="url(#redis-partition-loss-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="150.0" y="136" text-anchor="middle">OK</text>
  <path class="dg-arrow dg-message" d="M230 144 H78" marker-end="url(#redis-partition-loss-head-accent)"/>
  <rect class="dg-box" x="155.0" y="268" width="150" height="26" rx="4"/>
  <text class="dg-code" x="230.0" y="285.0" text-anchor="middle">rejoins as replica</text>
  <text class="dg-mono dg-accent-text" x="230" y="312" text-anchor="middle">DROPS x = 5</text>
  <path class="dg-arrow dg-empty" d="M490 281 H312" marker-end="url(#redis-partition-loss-head)"/>
  <text class="dg-mono dg-muted-text" x="400" y="274" text-anchor="middle">FULL COPY</text>
  <text class="dg-sub" x="360" y="344" text-anchor="middle">With min-replicas-to-write 1 and no replica on its side, the old primary refuses writes after 10 s.</text>
  </g>
</svg>
