  <rect class="dg-box-accent" x="24" y="114" width="280" height="28" rx="4"/>
  <rect class="dg-box-accent" x="24" y="146" width="280" height="28" rx="4"/>
  <rect class="dg-box-accent" x="24" y="178" width="280" height="28" rx="4"/>
  <rect class="dg-box-accent" x="24" y="210" width="280" height="28" rx="4"/>
  <text class="dg-code-muted" x="56.0" y="100" text-anchor="middle">abc</text>
  <text class="dg-code" x="128.0" y="100" text-anchor="middle">mon</text>
  <text class="dg-code" x="200.0" y="100" text-anchor="middle">US</text>
  <text class="dg-code-muted" x="272.0" y="100" text-anchor="middle">ios</text>
  <text class="dg-code-muted" x="56.0" y="132" text-anchor="middle">kq7</text>
  <text class="dg-code" x="128.0" y="132" text-anchor="middle">mon</text>
  <text class="dg-code" x="200.0" y="132" text-anchor="middle">US</text>
  <text class="dg-code-muted" x="272.0" y="132" text-anchor="middle">web</text>
  <text class="dg-code-muted" x="56.0" y="164" text-anchor="middle">abc</text>
  <text class="dg-code" x="128.0" y="164" text-anchor="middle">tue</text>
  <text class="dg-code" x="200.0" y="164" text-anchor="middle">US</text>
  <text class="dg-code-muted" x="272.0" y="164" text-anchor="middle">ios</text>
  <text class="dg-code-muted" x="56.0" y="196" text-anchor="middle">zzz</text>
  <text class="dg-code" x="128.0" y="196" text-anchor="middle">tue</text>
  <text class="dg-code" x="200.0" y="196" text-anchor="middle">DE</text>
