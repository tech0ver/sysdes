  <title id="vacuum-vs-full-title">VACUUM and VACUUM FULL on the same table</title>
  <desc id="vacuum-vs-full-desc">The same table of six pages with live and dead rows in both panels. Left, VACUUM: the dead rows become free space inside the same six pages, and the file keeps its size. Right, VACUUM FULL: the live rows are copied into a new file of three pages, under a lock that blocks all access.</desc>
