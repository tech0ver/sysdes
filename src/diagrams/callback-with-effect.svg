<svg class="diagram-svg" viewBox="0 0 710 296" role="img" aria-labelledby="callback-with-effect-title callback-with-effect-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="callback-with-effect-title">A callback recorded apart from its effect can be lost; together, it is applied once</title>
  <desc id="callback-with-effect-desc">Left: the site records callback evt_1 in one transaction and crashes before confirming the booking. The provider sends evt_1 again, the site sees it was recorded and skips it, and the booking stays held. Right: the site records evt_1 and confirms the booking in one transaction. When evt_1 comes again, it is already recorded and there is nothing to do; the booking was confirmed once.</desc>
  <defs>
    <marker id="callback-with-effect-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="callback-with-effect-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-5 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="288"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Two transactions</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="62" text-anchor="middle">PROVIDER</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="62" text-anchor="middle">SITE</text>
  <line class="dg-lifeline" x1="98.0" y1="70" x2="98.0" y2="266"/>
  <line class="dg-lifeline" x1="262.0" y1="70" x2="262.0" y2="266"/>
  <rect class="dg-box" x="22.0" y="80" width="152" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="97" text-anchor="middle">callback evt_1</text>
  <rect class="dg-box" x="186.0" y="116" width="152" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="133" text-anchor="middle">record evt_1</text>
  <rect class="dg-box-failed" x="186.0" y="152" width="152" height="26" rx="4"/>
  <text class="dg-code-muted" x="262.0" y="169" text-anchor="middle">crash</text>
  <rect class="dg-box" x="22.0" y="188" width="152" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="205" text-anchor="middle">evt_1 again</text>
  <rect class="dg-box-accent" x="186.0" y="224" width="152" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="241" text-anchor="middle">seen: skip</text>
  <text class="dg-result" x="180.0" y="292" text-anchor="middle">The booking stays held</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">One transaction</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="62" text-anchor="middle">PROVIDER</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="62" text-anchor="middle">SITE</text>
  <line class="dg-lifeline" x1="458.0" y1="70" x2="458.0" y2="266"/>
  <line class="dg-lifeline" x1="622.0" y1="70" x2="622.0" y2="266"/>
  <rect class="dg-box" x="382.0" y="80" width="152" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="97" text-anchor="middle">callback evt_1</text>
  <rect class="dg-box-accent" x="546.0" y="116" width="152" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="133" text-anchor="middle">record + confirm</text>
  <rect class="dg-box-failed" x="546.0" y="152" width="152" height="26" rx="4"/>
  <text class="dg-code-muted" x="622.0" y="169" text-anchor="middle">crash</text>
  <rect class="dg-box" x="382.0" y="188" width="152" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="205" text-anchor="middle">evt_1 again</text>
  <rect class="dg-box" x="546.0" y="224" width="152" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="241" text-anchor="middle">seen: nothing to do</text>
  <text class="dg-result" x="540.0" y="292" text-anchor="middle">Confirmed once</text>
  </g>
</svg>
