<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="redis-consumer-group-title redis-consumer-group-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-consumer-group-title">A stream with a consumer group</title>
  <desc id="redis-consumer-group-desc">The stream notify holds entries 101-0 to 105-0. The group notifier has delivered up to 104-0: 101-0 is acknowledged; 102-0 is pending at worker 1, which died; 103-0 and 104-0 are pending at worker 2. XAUTOCLAIM gives 102-0, idle too long, to worker 3. 105-0 waits for the next read. The group analytics reads the same stream with its own position, at 103-0.</desc>
  <defs>
    <marker id="redis-consumer-group-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-consumer-group-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-code" x="16" y="40">notify</text>
  <rect class="dg-chip" x="110" y="24" width="66" height="24" rx="4"/>
  <text class="dg-code" x="143.0" y="40.0" text-anchor="middle">101-0</text>
  <rect class="dg-chip" x="182" y="24" width="66" height="24" rx="4"/>
  <text class="dg-code" x="215.0" y="40.0" text-anchor="middle">102-0</text>
  <rect class="dg-chip" x="254" y="24" width="66" height="24" rx="4"/>
  <text class="dg-code" x="287.0" y="40.0" text-anchor="middle">103-0</text>
  <rect class="dg-chip" x="326" y="24" width="66" height="24" rx="4"/>
  <text class="dg-code" x="359.0" y="40.0" text-anchor="middle">104-0</text>
  <rect class="dg-chip" x="398" y="24" width="66" height="24" rx="4"/>
  <text class="dg-code" x="431.0" y="40.0" text-anchor="middle">105-0</text>
  <path class="dg-arrow dg-empty" d="M518 36 H470" marker-end="url(#redis-consumer-group-head)"/>
  <text class="dg-mono dg-muted-text" x="526" y="40">XADD</text>
  <line class="dg-line" x1="395" y1="16" x2="395" y2="58"/>
  <text class="dg-mono dg-muted-text" x="395" y="72" text-anchor="middle">NOTIFIER</text>
  <line class="dg-line" x1="323" y1="16" x2="323" y2="58"/>
  <text class="dg-mono dg-muted-text" x="323" y="72" text-anchor="middle">ANALYTICS</text>
  <text class="dg-sub" x="16" y="92">Each group keeps its own position: the last entry it delivered.</text>
  <rect class="dg-zone" x="16" y="106" width="688" height="176" rx="8"/>
  <text class="dg-mono dg-muted-text" x="31" y="126">GROUP NOTIFIER: PENDING ENTRIES</text>
  <rect class="dg-box-failed" x="40" y="140" width="120" height="34" rx="6"/>
  <text class="dg-name-muted" x="100.0" y="162.0" text-anchor="middle">Worker 1</text>
  <line class="dg-cross" x1="154" y1="134" x2="166" y2="146"/>
  <line class="dg-cross" x1="154" y1="146" x2="166" y2="134"/>
  <rect class="dg-box-failed" x="190" y="145" width="66" height="24" rx="4"/>
  <text class="dg-code-muted" x="223.0" y="161.0" text-anchor="middle">102-0</text>
  <rect class="dg-box" x="40" y="184" width="120" height="34" rx="6"/>
  <text class="dg-name" x="100.0" y="206.0" text-anchor="middle">Worker 3</text>
  <rect class="dg-box" x="40" y="228" width="120" height="34" rx="6"/>
  <text class="dg-name" x="100.0" y="250.0" text-anchor="middle">Worker 2</text>
  <rect class="dg-box" x="190" y="233" width="66" height="24" rx="4"/>
  <text class="dg-code" x="223.0" y="249.0" text-anchor="middle">103-0</text>
  <rect class="dg-box" x="262" y="233" width="66" height="24" rx="4"/>
  <text class="dg-code" x="295.0" y="249.0" text-anchor="middle">104-0</text>
  <rect class="dg-box-accent" x="190" y="189" width="66" height="24" rx="4"/>
  <text class="dg-code" x="223.0" y="205.0" text-anchor="middle">102-0</text>
  <path class="dg-arrow dg-message" d="M223 169 V181" marker-end="url(#redis-consumer-group-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="266" y="206">XAUTOCLAIM: IDLE TOO LONG</text>
  <text class="dg-code-muted" x="480" y="162">101-0: XACK, done</text>
  <text class="dg-code-muted" x="480" y="206">acknowledged entries</text>
  <text class="dg-code-muted" x="480" y="222">leave the pending list</text>
</svg>
