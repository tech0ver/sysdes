<svg class="diagram-svg" viewBox="0 0 617 330" role="img" aria-labelledby="lsn-fence-title lsn-fence-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lsn-fence-title">Reading your own write from a standby</title>
  <desc id="lsn-fence-desc">The app commits a write on the primary and notes its WAL position, 0/3A1F. It asks the standby how far it has replayed: 0/39F0, still behind, so the app waits. The WAL up to 0/3A1F reaches the standby. The next check returns 0/3A1F, and the app reads from the standby and sees its write.</desc>
  <defs>
    <marker id="lsn-fence-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="lsn-fence-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-43 0)">
  <text class="dg-mono dg-muted-text" x="100" y="24" text-anchor="middle">APP</text>
  <line class="dg-lifeline" x1="100" y1="34" x2="100" y2="318"/>
  <text class="dg-mono dg-muted-text" x="360" y="24" text-anchor="middle">PRIMARY</text>
  <line class="dg-lifeline" x1="360" y1="34" x2="360" y2="318"/>
  <text class="dg-mono dg-muted-text" x="620" y="24" text-anchor="middle">STANDBY</text>
  <line class="dg-lifeline" x1="620" y1="34" x2="620" y2="318"/>
  <text class="dg-mono dg-muted-text" x="230.0" y="54" text-anchor="middle">COMMIT</text>
  <path class="dg-arrow" d="M100 62 H352" marker-end="url(#lsn-fence-head)"/>
  <text class="dg-mono dg-muted-text" x="230.0" y="84" text-anchor="middle">LSN 0/3A1F</text>
  <path class="dg-arrow" d="M360 92 H108" marker-end="url(#lsn-fence-head)"/>
  <text class="dg-mono dg-muted-text" x="230" y="122" text-anchor="middle">REPLAYED LSN?</text>
  <path class="dg-arrow" d="M100 130 H612" marker-end="url(#lsn-fence-head)"/>
  <text class="dg-mono dg-muted-text" x="230" y="150" text-anchor="middle">0/39F0: BEHIND</text>
  <path class="dg-arrow" d="M620 158 H108" marker-end="url(#lsn-fence-head)"/>
  <rect class="dg-box-accent dg-empty" x="60.0" y="170" width="80" height="50" rx="4"/>
  <text class="dg-code" x="100" y="187" text-anchor="middle">wait</text>
  <text class="dg-mono dg-muted-text" x="490.0" y="192" text-anchor="middle">WAL TO 0/3A1F</text>
  <path class="dg-arrow dg-empty" d="M360 200 H612" marker-end="url(#lsn-fence-head)"/>
  <text class="dg-mono dg-muted-text" x="230" y="236" text-anchor="middle">REPLAYED LSN?</text>
  <path class="dg-arrow" d="M100 244 H612" marker-end="url(#lsn-fence-head)"/>
  <text class="dg-mono dg-muted-text" x="230" y="264" text-anchor="middle">0/3A1F</text>
  <path class="dg-arrow" d="M620 272 H108" marker-end="url(#lsn-fence-head)"/>
  <text class="dg-mono dg-accent-text" x="230" y="296" text-anchor="middle">SELECT</text>
  <path class="dg-arrow dg-message" d="M100 304 H612" marker-end="url(#lsn-fence-head-accent)"/>
  </g>
</svg>
