<svg class="diagram-svg" viewBox="0 0 660 330" role="img" aria-labelledby="ticket-vs-blocks-title ticket-vs-blocks-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ticket-vs-blocks-title">A ticket server costs a round trip per ID; blocks cost one per 1,000</title>
  <desc id="ticket-vs-blocks-desc">Left: an app server asks the ticket server for every new ID and gets 52001, 52002, and 52003, one round trip each. Right: the app server asks the counter once and gets the block 52001 to 53000, then hands out 52001, 52002, and 52003 from memory.</desc>
  <defs>
    <marker id="ticket-vs-blocks-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ticket-vs-blocks-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-30 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="322"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Ticket server</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">one number per call</text>
  <text class="dg-mono dg-muted-text" x="80" y="66" text-anchor="middle">APP SERVER</text>
  <line class="dg-lifeline" x1="80" y1="76" x2="80" y2="284"/>
  <text class="dg-mono dg-muted-text" x="280" y="66" text-anchor="middle">TICKET SERVER</text>
  <line class="dg-lifeline" x1="280" y1="76" x2="280" y2="284"/>
  <text class="dg-mono dg-muted-text" x="180.0" y="92" text-anchor="middle">NEXT?</text>
  <path class="dg-arrow" d="M80 100 H272" marker-end="url(#ticket-vs-blocks-head)"/>
  <text class="dg-mono dg-accent-text" x="180.0" y="120" text-anchor="middle">52001</text>
  <path class="dg-arrow dg-message" d="M280 128 H88" marker-end="url(#ticket-vs-blocks-head-accent)"/>
  <text class="dg-mono dg-muted-text" x="180.0" y="156" text-anchor="middle">NEXT?</text>
  <path class="dg-arrow" d="M80 164 H272" marker-end="url(#ticket-vs-blocks-head)"/>
  <text class="dg-mono dg-accent-text" x="180.0" y="184" text-anchor="middle">52002</text>
  <path class="dg-arrow dg-message" d="M280 192 H88" marker-end="url(#ticket-vs-blocks-head-accent)"/>
  <text class="dg-mono dg-muted-text" x="180.0" y="220" text-anchor="middle">NEXT?</text>
  <path class="dg-arrow" d="M80 228 H272" marker-end="url(#ticket-vs-blocks-head)"/>
  <text class="dg-mono dg-accent-text" x="180.0" y="248" text-anchor="middle">52003</text>
  <path class="dg-arrow dg-message" d="M280 256 H88" marker-end="url(#ticket-vs-blocks-head-accent)"/>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Blocks of IDs</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">1,000 numbers per call</text>
  <text class="dg-mono dg-muted-text" x="440" y="66" text-anchor="middle">APP SERVER</text>
  <line class="dg-lifeline" x1="440" y1="76" x2="440" y2="284"/>
  <text class="dg-mono dg-muted-text" x="640" y="66" text-anchor="middle">COUNTER</text>
  <line class="dg-lifeline" x1="640" y1="76" x2="640" y2="284"/>
  <text class="dg-mono dg-muted-text" x="540.0" y="92" text-anchor="middle">BLOCK?</text>
  <path class="dg-arrow" d="M440 100 H632" marker-end="url(#ticket-vs-blocks-head)"/>
  <text class="dg-mono dg-accent-text" x="540.0" y="120" text-anchor="middle">52001–53000</text>
  <path class="dg-arrow dg-message" d="M640 128 H448" marker-end="url(#ticket-vs-blocks-head-accent)"/>
  <rect class="dg-box" x="386" y="164" width="108" height="26" rx="4"/>
  <text class="dg-code" x="440.0" y="181.0" text-anchor="middle">52001</text>
  <rect class="dg-box" x="386" y="200" width="108" height="26" rx="4"/>
  <text class="dg-code" x="440.0" y="217.0" text-anchor="middle">52002</text>
  <rect class="dg-box" x="386" y="236" width="108" height="26" rx="4"/>
  <text class="dg-code" x="440.0" y="253.0" text-anchor="middle">52003</text>
  <text class="dg-result" x="180" y="314" text-anchor="middle">3 IDs, 3 round trips</text>
  <text class="dg-result" x="540" y="314" text-anchor="middle">3 IDs, 1 round trip; 997 left</text>
  </g>
</svg>
