  <rect class="dg-chip" x="390" y="280" width="300" height="24" rx="4"/>
  <text class="dg-code" x="540.0" y="296.0" text-anchor="middle">2210 · Porto</text>
  <rect class="dg-chip" x="390" y="308" width="300" height="24" rx="4"/>
