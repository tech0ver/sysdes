<svg class="diagram-svg" viewBox="0 0 720 406" role="img" aria-labelledby="encoding-shared-record-versions-title encoding-shared-record-versions-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="encoding-shared-record-versions-title">Both reading directions in one shared store</title>
  <desc id="encoding-shared-record-versions-desc">During a rolling update, old and new instances both write and read order 501. A new instance reads the old record, then writes a note that the old instance must be able to read. Time runs down.</desc>
  <defs>
    <marker id="encoding-shared-record-versions-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="encoding-shared-record-versions-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="110" y="24" text-anchor="middle">OLD INSTANCE</text>
  <line class="dg-lifeline" x1="110" y1="48" x2="110" y2="372"/>
  <text class="dg-mono dg-muted-text" x="360" y="24" text-anchor="middle">ORDER 501</text>
  <line class="dg-lifeline" x1="360" y1="48" x2="360" y2="372"/>
  <text class="dg-mono dg-muted-text" x="610" y="24" text-anchor="middle">NEW INSTANCE</text>
  <line class="dg-lifeline" x1="610" y1="48" x2="610" y2="372"/>
  <text class="dg-mono dg-muted-text" x="235.0" y="84" text-anchor="middle">WRITE: NO NOTE</text>
  <path class="dg-arrow" d="M110 92 H352" marker-end="url(#encoding-shared-record-versions-head)"/>
  <text class="dg-mono dg-accent-text" x="485.0" y="160" text-anchor="middle">READ: OLD → NEW</text>
  <path class="dg-arrow dg-message" d="M360 168 H602" marker-end="url(#encoding-shared-record-versions-head-accent)"/>
  <text class="dg-mono dg-muted-text" x="485.0" y="236" text-anchor="middle">WRITE: WITH NOTE</text>
  <path class="dg-arrow" d="M610 244 H368" marker-end="url(#encoding-shared-record-versions-head)"/>
  <text class="dg-mono dg-accent-text" x="235.0" y="312" text-anchor="middle">READ: NEW → OLD</text>
  <path class="dg-arrow dg-message" d="M360 320 H118" marker-end="url(#encoding-shared-record-versions-head-accent)"/>
</svg>
