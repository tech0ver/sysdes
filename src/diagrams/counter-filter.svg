<svg class="diagram-svg" viewBox="0 0 713 132" role="img" aria-labelledby="counter-filter-title counter-filter-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="counter-filter-title">A counter in Redis turns most guests away before the database</title>
  <desc id="counter-filter-desc">5,000 guests press Book for 100 rooms. A counter in Redis decrements only while it is above zero: 100 takes go on to the database, and 4,900 guests are told the rooms are sold out. The database still checks its own count; a take that fails there adds its unit back to the counter.</desc>
  <defs>
    <marker id="counter-filter-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="counter-filter-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(0 0)">
  <rect class="dg-box" x="16" y="30" width="140" height="56" rx="6"/>
  <text class="dg-name" x="86.0" y="56.0" text-anchor="middle">Guests</text>
  <text class="dg-sub" x="86.0" y="72.0" text-anchor="middle">5,000 press Book</text>
  <rect class="dg-box" x="288" y="30" width="144" height="56" rx="6"/>
  <text class="dg-name" x="360.0" y="56.0" text-anchor="middle">Redis counter</text>
  <text class="dg-sub" x="360.0" y="72.0" text-anchor="middle">decrement if &gt; 0</text>
  <rect class="dg-box" x="556" y="30" width="140" height="56" rx="6"/>
  <text class="dg-name" x="626.0" y="56.0" text-anchor="middle">Database</text>
  <text class="dg-sub" x="626.0" y="72.0" text-anchor="middle">checks its count</text>
  <path class="dg-arrow" d="M156 48 H280" marker-end="url(#counter-filter-head)"/>
  <text class="dg-mono dg-muted-text" x="218" y="40" text-anchor="middle">5,000 TAKES</text>
  <path class="dg-arrow dg-message" d="M288 70 H164" marker-end="url(#counter-filter-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="222" y="104" text-anchor="middle">4,900 SOLD OUT</text>
  <path class="dg-arrow" d="M432 48 H548" marker-end="url(#counter-filter-head)"/>
  <text class="dg-mono dg-muted-text" x="490" y="40" text-anchor="middle">100 TAKES</text>
  <path class="dg-arrow dg-empty" d="M556 70 H440" marker-end="url(#counter-filter-head)"/>
  <text class="dg-mono dg-muted-text" x="494" y="104" text-anchor="middle">FAILED: +1</text>
  </g>
</svg>
