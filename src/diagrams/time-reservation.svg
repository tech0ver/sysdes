<svg class="diagram-svg" viewBox="0 0 534 424" role="img" aria-labelledby="time-reservation-title time-reservation-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="time-reservation-title">Save a time ahead before using it, and wait past it after a restart</title>
  <desc id="time-reservation-desc">The generator saves 10:00:05 before it makes IDs, makes IDs up to 10:00:04, saves 10:00:10, and makes IDs up to 10:00:08. It crashes and restarts with its clock at 10:00:03, behind times it has already used. It reads the saved 10:00:10 and waits until its clock passes it. At 10:00:10.001 it saves 10:00:15 and only then makes its first new ID.</desc>
  <defs>
    <marker id="time-reservation-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="time-reservation-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-93 0)">
  <text class="dg-mono dg-muted-text" x="220.0" y="24" text-anchor="middle">GENERATOR</text>
  <text class="dg-mono dg-muted-text" x="500.0" y="24" text-anchor="middle">SAVED TIME</text>
  <line class="dg-lifeline" x1="220.0" y1="32" x2="220.0" y2="372"/>
  <line class="dg-lifeline" x1="500.0" y1="32" x2="500.0" y2="372"/>
  <rect class="dg-box" x="390.0" y="42" width="220" height="26" rx="4"/>
  <text class="dg-code" x="500.0" y="59" text-anchor="middle">saved: 10:00:05</text>
  <rect class="dg-box" x="110.0" y="78" width="220" height="26" rx="4"/>
  <text class="dg-code" x="220.0" y="95" text-anchor="middle">IDs up to 10:00:04</text>
  <rect class="dg-box-accent" x="390.0" y="114" width="220" height="26" rx="4"/>
  <text class="dg-code" x="500.0" y="131" text-anchor="middle">saved: 10:00:10</text>
  <rect class="dg-box" x="110.0" y="150" width="220" height="26" rx="4"/>
  <text class="dg-code" x="220.0" y="167" text-anchor="middle">IDs up to 10:00:08</text>
  <rect class="dg-box-failed" x="110.0" y="186" width="220" height="26" rx="4"/>
  <text class="dg-code-muted" x="220.0" y="203" text-anchor="middle">crash</text>
  <rect class="dg-box" x="110.0" y="222" width="220" height="26" rx="4"/>
  <text class="dg-code" x="220.0" y="239" text-anchor="middle">restart: clock 10:00:03</text>
  <rect class="dg-box-accent dg-empty" x="110.0" y="258" width="220" height="26" rx="4"/>
  <text class="dg-code" x="220.0" y="275" text-anchor="middle">reads 10:00:10, waits</text>
  <rect class="dg-box" x="390.0" y="294" width="220" height="26" rx="4"/>
  <text class="dg-code" x="500.0" y="311" text-anchor="middle">saved: 10:00:15</text>
  <rect class="dg-box-accent" x="110.0" y="330" width="220" height="26" rx="4"/>
  <text class="dg-code" x="220.0" y="347" text-anchor="middle">first ID at 10:00:10.001</text>
  <text class="dg-result" x="360.0" y="398" text-anchor="middle">No ID repeats a time used before the crash</text>
  </g>
</svg>
