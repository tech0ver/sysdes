<svg class="diagram-svg" viewBox="0 0 708 296" role="img" aria-labelledby="offer-chain-title offer-chain-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="offer-chain-title">Create the next offer in the transaction that expires the last one</title>
  <desc id="offer-chain-desc">Left: the timer for offer 1 fires, the handler marks it expired, and crashes before it creates offer 2. The timer's message comes again, the expiry changes no rows, the handler stops, and nobody gets offer 2. Right: the expiry and offer 2 are written in one transaction, so after the same crash and redelivery, offer 2 already exists.</desc>
  <defs>
    <marker id="offer-chain-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="offer-chain-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-6 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="288"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Next offer later</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="62" text-anchor="middle">TIMER</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="62" text-anchor="middle">DATABASE</text>
  <line class="dg-lifeline" x1="98.0" y1="70" x2="98.0" y2="266"/>
  <line class="dg-lifeline" x1="262.0" y1="70" x2="262.0" y2="266"/>
  <rect class="dg-box" x="23.0" y="80" width="150" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="97" text-anchor="middle">deadline fires</text>
  <rect class="dg-box" x="187.0" y="116" width="150" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="133" text-anchor="middle">offer 1: expired</text>
  <rect class="dg-box-failed" x="23.0" y="152" width="150" height="26" rx="4"/>
  <text class="dg-code-muted" x="98.0" y="169" text-anchor="middle">crash</text>
  <rect class="dg-box" x="23.0" y="188" width="150" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="205" text-anchor="middle">fires again</text>
  <rect class="dg-box-accent" x="187.0" y="224" width="150" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="241" text-anchor="middle">0 rows: stop</text>
  <text class="dg-result" x="180.0" y="292" text-anchor="middle">Nobody gets offer 2</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Next offer in the same step</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="62" text-anchor="middle">TIMER</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="62" text-anchor="middle">DATABASE</text>
  <line class="dg-lifeline" x1="458.0" y1="70" x2="458.0" y2="266"/>
  <line class="dg-lifeline" x1="622.0" y1="70" x2="622.0" y2="266"/>
  <rect class="dg-box" x="383.0" y="80" width="150" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="97" text-anchor="middle">deadline fires</text>
  <rect class="dg-box-accent" x="547.0" y="116" width="150" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="133" text-anchor="middle">expired + offer 2</text>
  <rect class="dg-box-failed" x="383.0" y="152" width="150" height="26" rx="4"/>
  <text class="dg-code-muted" x="458.0" y="169" text-anchor="middle">crash</text>
  <rect class="dg-box" x="383.0" y="188" width="150" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="205" text-anchor="middle">fires again</text>
  <rect class="dg-box" x="547.0" y="224" width="150" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="241" text-anchor="middle">0 rows: stop</text>
  <text class="dg-result" x="540.0" y="292" text-anchor="middle">Offer 2 already exists</text>
  </g>
</svg>
