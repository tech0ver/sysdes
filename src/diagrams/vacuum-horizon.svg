<svg class="diagram-svg" viewBox="0 0 709 286" role="img" aria-labelledby="vacuum-horizon-title vacuum-horizon-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="vacuum-horizon-title">A long transaction holds back vacuuming</title>
  <desc id="vacuum-horizon-desc">A report starts at 10:00 and runs past 11:00 with one snapshot. Old versions of home 7 ended at 09:55, 10:10, and 10:40. Vacuuming at 10:50 removes the version that ended before 10:00 and keeps the two that ended after it, because the report's snapshot may still need them.</desc>
  <defs>
    <marker id="vacuum-horizon-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="vacuum-horizon-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-11 0)">
  <text class="dg-mono dg-muted-text" x="60" y="36.0" text-anchor="end">09:50</text>
  <text class="dg-mono dg-muted-text" x="60" y="68.0" text-anchor="end">10:00</text>
  <text class="dg-mono dg-muted-text" x="60" y="100.0" text-anchor="end">10:10</text>
  <text class="dg-mono dg-muted-text" x="60" y="132.0" text-anchor="end">10:20</text>
  <text class="dg-mono dg-muted-text" x="60" y="164.0" text-anchor="end">10:30</text>
  <text class="dg-mono dg-muted-text" x="60" y="196.0" text-anchor="end">10:40</text>
  <text class="dg-mono dg-muted-text" x="60" y="228.0" text-anchor="end">10:50</text>
  <text class="dg-mono dg-muted-text" x="60" y="260.0" text-anchor="end">11:00</text>
  <rect class="dg-box" x="110" y="64.0" width="150" height="202.0" rx="6"/>
  <text class="dg-name" x="185" y="88.0" text-anchor="middle">Report</text>
  <text class="dg-sub" x="185" y="104.0" text-anchor="middle">one snapshot</text>
  <rect class="dg-box-failed" x="330" y="36.0" width="170" height="24" rx="4"/>
  <text class="dg-code-muted" x="415.0" y="52.0" text-anchor="middle">v1 ended 09:55</text>
  <text class="dg-mono dg-muted-text" x="530" y="52.0">REMOVED</text>
  <rect class="dg-box" x="330" y="84.0" width="170" height="24" rx="4"/>
  <text class="dg-code" x="415.0" y="100.0" text-anchor="middle">v2 ended 10:10</text>
  <text class="dg-mono dg-muted-text" x="530" y="100.0">KEPT</text>
  <rect class="dg-box" x="330" y="180.0" width="170" height="24" rx="4"/>
  <text class="dg-code" x="415.0" y="196.0" text-anchor="middle">v3 ended 10:40</text>
  <text class="dg-mono dg-muted-text" x="530" y="196.0">KEPT</text>
  <path class="dg-guide" d="M96 64.0 H704" fill="none"/>
  <text class="dg-mono dg-accent-text" x="704" y="56.0" text-anchor="end">HORIZON</text>
  <line class="dg-rule" x1="96" y1="224.0" x2="704" y2="224.0"/>
  <text class="dg-mono dg-muted-text" x="704" y="216.0" text-anchor="end">VACUUM</text>
  </g>
</svg>
