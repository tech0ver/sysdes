<svg class="diagram-svg" viewBox="0 0 720 250" role="img" aria-labelledby="availability-paths-title availability-paths-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="availability-paths-title">Searches read copies; takes go to the owner of the count</title>
  <desc id="availability-paths-desc">Searches read copies that are seconds behind: a cache, a search index, and a follower. A booking takes units on the leader, which owns the inventory rows, and gets 409 when a room the copy showed is gone. Changes flow from the leader to the copies.</desc>
  <defs>
    <marker id="availability-paths-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="availability-paths-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-box" x="16" y="46" width="140" height="52" rx="6"/>
  <text class="dg-name" x="86.0" y="70.0" text-anchor="middle">Search</text>
  <text class="dg-sub" x="86.0" y="86.0" text-anchor="middle">many per booking</text>
  <rect class="dg-box" x="16" y="172" width="140" height="52" rx="6"/>
  <text class="dg-name" x="86.0" y="196.0" text-anchor="middle">Booking</text>
  <text class="dg-sub" x="86.0" y="212.0" text-anchor="middle">takes units</text>
  <rect class="dg-zone" x="232" y="20" width="472" height="100" rx="8"/>
  <text class="dg-mono dg-muted-text" x="247" y="40">COPIES, SECONDS BEHIND</text>
  <rect class="dg-box" x="256" y="50" width="128" height="44" rx="6"/>
  <text class="dg-name" x="320.0" y="77.0" text-anchor="middle">Cache</text>
  <rect class="dg-box" x="404" y="50" width="128" height="44" rx="6"/>
  <text class="dg-name" x="468.0" y="77.0" text-anchor="middle">Search index</text>
  <rect class="dg-box" x="552" y="50" width="128" height="44" rx="6"/>
  <text class="dg-name" x="616.0" y="77.0" text-anchor="middle">Follower</text>
  <path class="dg-arrow" d="M156 72 H224" marker-end="url(#availability-paths-head)"/>
  <text class="dg-mono dg-muted-text" x="190" y="64" text-anchor="middle">READ</text>
  <rect class="dg-box-accent" x="404" y="172" width="160" height="52" rx="6"/>
  <text class="dg-name" x="484.0" y="196.0" text-anchor="middle">Leader</text>
  <text class="dg-sub" x="484.0" y="212.0" text-anchor="middle">inventory rows</text>
  <path class="dg-arrow dg-message" d="M156 188 H396" marker-end="url(#availability-paths-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="276" y="180" text-anchor="middle">TAKE</text>
  <path class="dg-arrow" d="M404 210 H164" marker-end="url(#availability-paths-head)"/>
  <text class="dg-mono dg-muted-text" x="276" y="230" text-anchor="middle">409: GONE</text>
  <path class="dg-arrow dg-empty" d="M484 172 V128" marker-end="url(#availability-paths-head)"/>
  <text class="dg-mono dg-muted-text" x="494" y="152">CHANGES</text>
</svg>
