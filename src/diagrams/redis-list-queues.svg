<svg class="diagram-svg" viewBox="0 0 708 256" role="img" aria-labelledby="redis-list-queues-title redis-list-queues-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-list-queues-title">A worker crash with BRPOP and with BLMOVE</title>
  <desc id="redis-list-queues-desc">Left: a worker takes job 1 from the list jobs with BRPOP and crashes; the job is no longer in Redis and is lost. Right: the worker moves job 1 with BLMOVE into its own list processing:w1 and crashes; the job is still there, and a check moves it back to jobs after a timeout.</desc>
  <defs>
    <marker id="redis-list-queues-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-list-queues-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-6 0)">
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">BRPOP</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">the pop removes the job</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">BLMOVE</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">the job moves to a processing list</text>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="248"/>
  <text class="dg-code" x="24" y="72">jobs</text>
  <rect class="dg-box" x="24" y="82" width="64" height="24" rx="4"/>
  <text class="dg-code" x="56.0" y="98.0" text-anchor="middle">job 3</text>
  <rect class="dg-box" x="94" y="82" width="64" height="24" rx="4"/>
  <text class="dg-code" x="126.0" y="98.0" text-anchor="middle">job 2</text>
  <rect class="dg-box-failed" x="230" y="76" width="100" height="40" rx="6"/>
  <text class="dg-name-muted" x="280.0" y="101.0" text-anchor="middle">Worker</text>
  <line class="dg-cross" x1="323" y1="69" x2="337" y2="83"/>
  <line class="dg-cross" x1="323" y1="83" x2="337" y2="69"/>
  <text class="dg-code" x="384" y="72">jobs</text>
  <rect class="dg-box" x="384" y="82" width="64" height="24" rx="4"/>
  <text class="dg-code" x="416.0" y="98.0" text-anchor="middle">job 3</text>
  <rect class="dg-box" x="454" y="82" width="64" height="24" rx="4"/>
  <text class="dg-code" x="486.0" y="98.0" text-anchor="middle">job 2</text>
  <rect class="dg-box-failed" x="590" y="76" width="100" height="40" rx="6"/>
  <text class="dg-name-muted" x="640.0" y="101.0" text-anchor="middle">Worker</text>
  <line class="dg-cross" x1="683" y1="69" x2="697" y2="83"/>
  <line class="dg-cross" x1="683" y1="83" x2="697" y2="69"/>
  <path class="dg-arrow" d="M158 96 H222" marker-end="url(#redis-list-queues-head)"/>
  <rect class="dg-box-failed" x="248" y="140" width="64" height="24" rx="4"/>
  <text class="dg-code-muted" x="280.0" y="156.0" text-anchor="middle">job 1</text>
  <text class="dg-mono dg-accent-text" x="280" y="182" text-anchor="middle">LOST</text>
  <text class="dg-result" x="180" y="242" text-anchor="middle">A crash loses the job</text>
  <path class="dg-arrow" d="M518 96 H582" marker-end="url(#redis-list-queues-head)"/>
  <rect class="dg-box-accent" x="420" y="150" width="64" height="24" rx="4"/>
  <text class="dg-code" x="452.0" y="166.0" text-anchor="middle">job 1</text>
  <text class="dg-code" x="494" y="167">processing:w1</text>
  <path class="dg-arrow dg-message dg-empty" d="M420 162 H398 V114" marker-end="url(#redis-list-queues-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="420" y="200">BACK AFTER TIMEOUT</text>
  <text class="dg-result" x="540" y="242" text-anchor="middle">A crash keeps the job</text>
  </g>
</svg>
