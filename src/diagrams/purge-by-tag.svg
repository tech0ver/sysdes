<svg class="diagram-svg" viewBox="0 0 720 254" role="img" aria-labelledby="purge-by-tag-title purge-by-tag-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="purge-by-tag-title">Purging every page that shows one article</title>
  <desc id="purge-by-tag-desc">Five cached pages carry tags with the IDs of the articles they show. Four of them carry a42: the article page, the home page, the World page, and the author page. One purge of the tag a42 removes those four, and the page of article 17 stays.</desc>
