<svg class="diagram-svg" viewBox="0 0 720 244" role="img" aria-labelledby="big-tenant-options-title big-tenant-options-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="big-tenant-options-title">A big workspace on a shared shard, on its own shard, and split by project</title>
  <desc id="big-tenant-options-desc">Bars show the load of each shard against the capacity of a node. Shared: workspace 42 and other workspaces on shard 2 exceed the capacity, while shards 1 and 3 have room. Own shard: workspace 42 moves to a new shard 4 and fits there. Split by project: the projects of workspace 42 spread over shards 1, 2, and 3, and every shard stays under the capacity.</desc>
  <defs>
    <marker id="big-tenant-options-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="big-tenant-options-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="240" y1="8" x2="240" y2="236"/>
  <line class="dg-rule" x1="480" y1="8" x2="480" y2="236"/>
  <text class="dg-name" x="120" y="22" text-anchor="middle">Shared shard</text>
  <line class="dg-line dg-empty" x1="10" y1="94" x2="230" y2="94"/>
  <line class="dg-line" x1="10" y1="214" x2="230" y2="214"/>
  <rect class="dg-chip" x="39.0" y="150" width="50" height="64" rx="2"/>
  <text class="dg-code-muted" x="64.0" y="186.0" text-anchor="middle">others</text>
  <text class="dg-sub" x="64.0" y="232" text-anchor="middle">shard 1</text>
  <rect class="dg-chip" x="95.0" y="178" width="50" height="36" rx="2"/>
  <text class="dg-code-muted" x="120.0" y="200.0" text-anchor="middle">others</text>
  <rect class="dg-box-accent" x="95.0" y="82" width="50" height="96" rx="2"/>
  <text class="dg-code" x="120.0" y="134.0" text-anchor="middle">42</text>
  <text class="dg-sub" x="120.0" y="232" text-anchor="middle">shard 2</text>
  <rect class="dg-chip" x="151.0" y="144" width="50" height="70" rx="2"/>
  <text class="dg-code-muted" x="176.0" y="183.0" text-anchor="middle">others</text>
  <text class="dg-sub" x="176.0" y="232" text-anchor="middle">shard 3</text>
  <text class="dg-name" x="360" y="22" text-anchor="middle">Own shard</text>
  <line class="dg-line dg-empty" x1="250" y1="94" x2="470" y2="94"/>
  <line class="dg-line" x1="250" y1="214" x2="470" y2="214"/>
  <rect class="dg-chip" x="251.0" y="150" width="50" height="64" rx="2"/>
  <text class="dg-code-muted" x="276.0" y="186.0" text-anchor="middle">others</text>
  <text class="dg-sub" x="276.0" y="232" text-anchor="middle">shard 1</text>
  <rect class="dg-chip" x="307.0" y="178" width="50" height="36" rx="2"/>
  <text class="dg-code-muted" x="332.0" y="200.0" text-anchor="middle">others</text>
  <text class="dg-sub" x="332.0" y="232" text-anchor="middle">shard 2</text>
  <rect class="dg-chip" x="363.0" y="144" width="50" height="70" rx="2"/>
  <text class="dg-code-muted" x="388.0" y="183.0" text-anchor="middle">others</text>
  <text class="dg-sub" x="388.0" y="232" text-anchor="middle">shard 3</text>
  <rect class="dg-box-accent" x="419.0" y="118" width="50" height="96" rx="2"/>
  <text class="dg-code" x="444.0" y="170.0" text-anchor="middle">42</text>
  <text class="dg-sub" x="444.0" y="232" text-anchor="middle">shard 4</text>
  <text class="dg-name" x="600" y="22" text-anchor="middle">Split by project</text>
  <line class="dg-line dg-empty" x1="490" y1="94" x2="710" y2="94"/>
  <line class="dg-line" x1="490" y1="214" x2="710" y2="214"/>
  <rect class="dg-chip" x="519.0" y="150" width="50" height="64" rx="2"/>
  <text class="dg-code-muted" x="544.0" y="186.0" text-anchor="middle">others</text>
  <rect class="dg-box-accent" x="519.0" y="118" width="50" height="32" rx="2"/>
  <text class="dg-code" x="544.0" y="138.0" text-anchor="middle">42 p1</text>
  <text class="dg-sub" x="544.0" y="232" text-anchor="middle">shard 1</text>
  <rect class="dg-chip" x="575.0" y="178" width="50" height="36" rx="2"/>
  <text class="dg-code-muted" x="600.0" y="200.0" text-anchor="middle">others</text>
  <rect class="dg-box-accent" x="575.0" y="146" width="50" height="32" rx="2"/>
  <text class="dg-code" x="600.0" y="166.0" text-anchor="middle">42 p2</text>
  <text class="dg-sub" x="600.0" y="232" text-anchor="middle">shard 2</text>
  <rect class="dg-chip" x="631.0" y="144" width="50" height="70" rx="2"/>
  <text class="dg-code-muted" x="656.0" y="183.0" text-anchor="middle">others</text>
  <rect class="dg-box-accent" x="631.0" y="112" width="50" height="32" rx="2"/>
  <text class="dg-code" x="656.0" y="132.0" text-anchor="middle">42 p3</text>
  <text class="dg-sub" x="656.0" y="232" text-anchor="middle">shard 3</text>
  <text class="dg-mono dg-muted-text" x="710" y="88" text-anchor="end">NODE CAPACITY</text>
</svg>
