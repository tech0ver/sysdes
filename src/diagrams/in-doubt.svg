<svg class="diagram-svg" viewBox="0 0 720 380" role="img" aria-labelledby="in-doubt-title in-doubt-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="in-doubt-title">Participants in doubt after the coordinator fails</title>
  <desc id="in-doubt-desc">Both shards have prepared transfer t-501 and voted yes. The coordinator writes commit to its log and fails before the decision reaches the shards. Both shards stay in doubt, holding their locks, until the coordinator recovers, reads commit from its log, and tells them to commit; only then do they commit and release the locks.</desc>
  <defs>
    <marker id="in-doubt-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="in-doubt-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="130" y="20" text-anchor="middle">SHARD 1</text>
  <line class="dg-lifeline" x1="130" y1="34" x2="130" y2="370"/>
  <text class="dg-mono dg-muted-text" x="360" y="20" text-anchor="middle">COORDINATOR</text>
  <line class="dg-lifeline" x1="360" y1="34" x2="360" y2="370"/>
  <text class="dg-mono dg-muted-text" x="590" y="20" text-anchor="middle">SHARD 7</text>
  <line class="dg-lifeline" x1="590" y1="34" x2="590" y2="370"/>
  <text class="dg-mono dg-muted-text" x="245.0" y="58" text-anchor="middle">PREPARE t-501</text>
  <path class="dg-arrow" d="M360 66 H138" marker-end="url(#in-doubt-head)"/>
  <text class="dg-mono dg-muted-text" x="475.0" y="58" text-anchor="middle">PREPARE t-501</text>
  <path class="dg-arrow" d="M360 66 H582" marker-end="url(#in-doubt-head)"/>
  <rect class="dg-box" x="17.0" y="76" width="226" height="24" rx="4"/>
  <text class="dg-code" x="130.0" y="92.0" text-anchor="middle">Anna −$50: prepared, locked</text>
  <rect class="dg-box" x="477.0" y="76" width="226" height="24" rx="4"/>
  <text class="dg-code" x="590.0" y="92.0" text-anchor="middle">Ben +$50: prepared, locked</text>
  <text class="dg-mono dg-muted-text" x="245.0" y="120" text-anchor="middle">YES</text>
  <path class="dg-arrow" d="M130 128 H352" marker-end="url(#in-doubt-head)"/>
  <text class="dg-mono dg-muted-text" x="475.0" y="144" text-anchor="middle">YES</text>
  <path class="dg-arrow" d="M590 152 H368" marker-end="url(#in-doubt-head)"/>
  <rect class="dg-box" x="285.0" y="164" width="150" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="180.0" text-anchor="middle">log: commit</text>
  <line class="dg-cross" x1="354" y1="204" x2="366" y2="216"/>
  <line class="dg-cross" x1="354" y1="216" x2="366" y2="204"/>
  <text class="dg-sub" x="374" y="214" text-anchor="start">fails</text>
  <line class="dg-arrow dg-wait" x1="130" y1="104" x2="130" y2="310"/>
  <line class="dg-arrow dg-wait" x1="590" y1="104" x2="590" y2="310"/>
  <text class="dg-mono dg-accent-text" x="142" y="230" text-anchor="start">IN DOUBT, LOCKED</text>
  <text class="dg-mono dg-accent-text" x="578" y="230" text-anchor="end">IN DOUBT, LOCKED</text>
  <rect class="dg-box" x="285.0" y="254" width="150" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="270.0" text-anchor="middle">recovers: commit</text>
  <text class="dg-mono dg-muted-text" x="245.0" y="302" text-anchor="middle">COMMIT</text>
  <path class="dg-arrow" d="M360 310 H138" marker-end="url(#in-doubt-head)"/>
  <text class="dg-mono dg-muted-text" x="475.0" y="302" text-anchor="middle">COMMIT</text>
  <path class="dg-arrow" d="M360 310 H582" marker-end="url(#in-doubt-head)"/>
  <rect class="dg-box" x="35.0" y="322" width="190" height="24" rx="4"/>
  <text class="dg-code" x="130.0" y="338.0" text-anchor="middle">committed, unlocked</text>
  <rect class="dg-box" x="495.0" y="322" width="190" height="24" rx="4"/>
  <text class="dg-code" x="590.0" y="338.0" text-anchor="middle">committed, unlocked</text>
</svg>
