<svg class="diagram-svg" viewBox="0 0 600 268" role="img" aria-labelledby="vector-clock-title vector-clock-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="vector-clock-title">Vector clocks show which events are concurrent</title>
  <desc id="vector-clock-desc">Two processes. P1's first event is [1, 0], and it sends a message to P2. P1's next event is [2, 0]. P2 receives the message and gets [1, 1]. Neither of [2, 0] and [1, 1] is before the other, so they are concurrent. P2 then sends a message back, which is an event too: [1, 2]. P1 takes the larger value of each counter and adds one to its own: [3, 2], which comes after both.</desc>
  <defs>
    <marker id="vector-clock-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="vector-clock-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="170" y="20" text-anchor="middle">P1</text>
  <line class="dg-lifeline" x1="170" y1="34" x2="170" y2="228"/>
  <text class="dg-mono dg-muted-text" x="430" y="20" text-anchor="middle">P2</text>
  <line class="dg-lifeline" x1="430" y1="34" x2="430" y2="228"/>
  <circle class="dg-dot-muted" cx="170" cy="70" r="4"/>
  <rect class="dg-chip" x="106.2" y="58" width="51.8" height="24" rx="4"/>
  <text class="dg-code" x="132.1" y="74.0" text-anchor="middle">[1, 0]</text>
  <path class="dg-arrow" d="M170 70 L422.1 118.5" marker-end="url(#vector-clock-head)"/>
  <circle class="dg-dot" cx="170" cy="130" r="4"/>
  <rect class="dg-box-accent" x="106.2" y="118" width="51.8" height="24" rx="4"/>
  <text class="dg-code" x="132.1" y="134.0" text-anchor="middle">[2, 0]</text>
  <circle class="dg-dot" cx="430" cy="120" r="4"/>
  <rect class="dg-box-accent" x="442" y="108" width="51.8" height="24" rx="4"/>
  <text class="dg-code" x="467.9" y="124.0" text-anchor="middle">[1, 1]</text>
  <text class="dg-sub" x="501.8" y="124" text-anchor="start">received</text>
  <circle class="dg-dot-muted" cx="430" cy="156" r="4"/>
  <rect class="dg-chip" x="442" y="144" width="51.8" height="24" rx="4"/>
  <text class="dg-code" x="467.9" y="160.0" text-anchor="middle">[1, 2]</text>
  <text class="dg-sub" x="501.8" y="160" text-anchor="start">sent</text>
  <path class="dg-arrow" d="M430 156 L177.9 204.5" marker-end="url(#vector-clock-head)"/>
  <circle class="dg-dot-muted" cx="170" cy="206" r="4"/>
  <rect class="dg-chip" x="106.2" y="194" width="51.8" height="24" rx="4"/>
  <text class="dg-code" x="132.1" y="210.0" text-anchor="middle">[3, 2]</text>
  <text class="dg-sub" x="98.2" y="210" text-anchor="end">received</text>
  <text class="dg-mono dg-accent-text" x="300" y="254" text-anchor="middle">[2, 0] AND [1, 1]: CONCURRENT · [3, 2]: AFTER BOTH</text>
</svg>
