<svg class="diagram-svg" viewBox="0 0 720 236" role="img" aria-labelledby="deadlock-title deadlock-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="deadlock-title">Who waits for whom: a cycle with opposite lock orders, none with the same order</title>
  <desc id="deadlock-desc">Opposite order: purchase A holds seat 5 and waits for seat 6, purchase B holds seat 6 and waits for seat 5. The waits form a cycle, so the database aborts one of them. Same order: A holds seats 5 and 6; B waits for seat 5 while holding nothing, so there is no cycle and B goes on after A commits.</desc>
  <defs>
    <marker id="deadlock-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="deadlock-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="228"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Opposite order</text>
  <rect class="dg-box" x="16" y="92" width="128" height="52" rx="6"/>
  <text class="dg-name" x="80" y="114" text-anchor="middle">Purchase A</text>
  <text class="dg-code" x="80" y="134" text-anchor="middle">holds 5</text>
  <rect class="dg-box" x="216" y="92" width="128" height="52" rx="6"/>
  <text class="dg-name" x="280" y="114" text-anchor="middle">Purchase B</text>
  <text class="dg-code" x="280" y="134" text-anchor="middle">holds 6</text>
  <path class="dg-arrow dg-message" d="M144 104 C166 76 194 76 212 100" marker-end="url(#deadlock-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="180" y="64" text-anchor="middle">WAITS FOR 6</text>
  <path class="dg-arrow dg-message" d="M216 132 C194 160 166 160 148 136" marker-end="url(#deadlock-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="180" y="180" text-anchor="middle">WAITS FOR 5</text>
  <text class="dg-result" x="180" y="218" text-anchor="middle">A cycle</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Same order</text>
  <rect class="dg-box" x="376" y="92" width="128" height="52" rx="6"/>
  <text class="dg-name" x="440" y="114" text-anchor="middle">Purchase A</text>
  <text class="dg-code" x="440" y="134" text-anchor="middle">holds 5, 6</text>
  <rect class="dg-box" x="576" y="92" width="128" height="52" rx="6"/>
  <text class="dg-name" x="640" y="114" text-anchor="middle">Purchase B</text>
  <text class="dg-code-muted" x="640" y="134" text-anchor="middle">holds nothing</text>
  <path class="dg-arrow" d="M576 132 C554 160 526 160 508 136" marker-end="url(#deadlock-head)"/>
  <text class="dg-mono dg-muted-text" x="540" y="180" text-anchor="middle">WAITS FOR 5</text>
  <text class="dg-result" x="540" y="218" text-anchor="middle">No cycle</text>
</svg>
