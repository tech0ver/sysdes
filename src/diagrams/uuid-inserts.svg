<svg class="diagram-svg" viewBox="0 0 706 272" role="img" aria-labelledby="uuid-inserts-title uuid-inserts-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="uuid-inserts-title">Where new keys land in a B-tree index</title>
  <desc id="uuid-inserts-desc">The same six leaf pages of a primary key index in both panels. Left, bigint or uuidv7 keys: five new keys all go to the last page. Right, random UUIDv4 keys: the five new keys land on five different pages. Adding 50 million rows to a table that already held 50 million took 1 min 40 s with uuidv7 and 46 min with UUIDv4.</desc>
  <defs>
    <marker id="uuid-inserts-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="uuid-inserts-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-7 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="264"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">bigint or uuidv7</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">new keys at the end</text>
  <rect class="dg-box" x="286.0" y="58" width="54" height="20" rx="4"/>
  <text class="dg-code" x="313.0" y="72.0" text-anchor="middle">1001</text>
  <rect class="dg-box" x="286.0" y="80" width="54" height="20" rx="4"/>
  <text class="dg-code" x="313.0" y="94.0" text-anchor="middle">1002</text>
  <rect class="dg-box" x="286.0" y="102" width="54" height="20" rx="4"/>
  <text class="dg-code" x="313.0" y="116.0" text-anchor="middle">1003</text>
  <rect class="dg-box" x="286.0" y="124" width="54" height="20" rx="4"/>
  <text class="dg-code" x="313.0" y="138.0" text-anchor="middle">1004</text>
  <rect class="dg-box" x="286.0" y="146" width="54" height="20" rx="4"/>
  <text class="dg-code" x="313.0" y="160.0" text-anchor="middle">1005</text>
  <path class="dg-arrow dg-message" d="M313 166 V204" marker-end="url(#uuid-inserts-head-accent)"/>
  <rect class="dg-box" x="30" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="53.0" y="223.0" text-anchor="middle">p1</text>
  <rect class="dg-box" x="82" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="105.0" y="223.0" text-anchor="middle">p2</text>
  <rect class="dg-box" x="134" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="157.0" y="223.0" text-anchor="middle">p3</text>
  <rect class="dg-box" x="186" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="209.0" y="223.0" text-anchor="middle">p4</text>
  <rect class="dg-box" x="238" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="261.0" y="223.0" text-anchor="middle">p5</text>
  <rect class="dg-box-accent" x="290" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="313.0" y="223.0" text-anchor="middle">p6</text>
  <text class="dg-result" x="180" y="258" text-anchor="middle">uuidv7: 1 min 40 s</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">UUIDv4</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">new keys at random</text>
  <rect class="dg-box" x="390.0" y="146" width="46" height="20" rx="4"/>
  <text class="dg-code" x="413.0" y="160.0" text-anchor="middle">07de…</text>
  <path class="dg-arrow dg-message" d="M413 166 V204" marker-end="url(#uuid-inserts-head-accent)"/>
  <rect class="dg-box" x="442.0" y="146" width="46" height="20" rx="4"/>
  <text class="dg-code" x="465.0" y="160.0" text-anchor="middle">3f2a…</text>
  <path class="dg-arrow dg-message" d="M465 166 V204" marker-end="url(#uuid-inserts-head-accent)"/>
  <rect class="dg-box" x="494.0" y="146" width="46" height="20" rx="4"/>
  <text class="dg-code" x="517.0" y="160.0" text-anchor="middle">5c10…</text>
  <path class="dg-arrow dg-message" d="M517 166 V204" marker-end="url(#uuid-inserts-head-accent)"/>
