<svg class="diagram-svg" viewBox="0 0 711 344" role="img" aria-labelledby="flush-batch-title flush-batch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="flush-batch-title">A flush that is safe to retry</title>
  <desc id="flush-batch-desc">The cache counts 340 views of article 42. The flush job moves them into batch b17 in one atomic step, so new views go to a fresh counter. It adds 340 to the database and records b17 in one transaction. The answer is lost, so the job retries b17. The database has already recorded b17 and skips it.</desc>
  <defs>
    <marker id="flush-batch-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="flush-batch-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(0 0)">
  <text class="dg-mono dg-muted-text" x="110" y="20" text-anchor="middle">CACHE</text>
  <line class="dg-lifeline" x1="110" y1="34" x2="110" y2="332"/>
  <text class="dg-mono dg-muted-text" x="360" y="20" text-anchor="middle">FLUSH JOB</text>
  <line class="dg-lifeline" x1="360" y1="34" x2="360" y2="332"/>
  <text class="dg-mono dg-muted-text" x="610" y="20" text-anchor="middle">DATABASE</text>
  <line class="dg-lifeline" x1="610" y1="34" x2="610" y2="332"/>
  <rect class="dg-box" x="35.0" y="44" width="150" height="24" rx="4"/>
  <text class="dg-code" x="110.0" y="60.0" text-anchor="middle">views:42 = 340</text>
  <text class="dg-mono dg-muted-text" x="235.0" y="96" text-anchor="middle">MOVE TO BATCH b17, ATOMIC</text>
  <path class="dg-arrow" d="M360 104 H118" marker-end="url(#flush-batch-head)"/>
  <rect class="dg-box" x="12.0" y="116" width="196" height="24" rx="4"/>
  <text class="dg-code" x="110.0" y="132.0" text-anchor="middle">b17 = 340, views:42 = 0</text>
  <text class="dg-mono dg-muted-text" x="485.0" y="162" text-anchor="middle">ADD 340 + RECORD b17, ONE TX</text>
  <path class="dg-arrow" d="M360 170 H602" marker-end="url(#flush-batch-head)"/>
  <rect class="dg-box" x="570.0" y="182" width="80" height="24" rx="4"/>
  <text class="dg-code" x="610.0" y="198.0" text-anchor="middle">commit</text>
  <text class="dg-mono dg-muted-text" x="485.0" y="228" text-anchor="middle">ANSWER LOST</text>
  <path class="dg-arrow dg-empty" d="M610 236 H515.0"/>
  <line class="dg-cross" x1="502.0" y1="231" x2="512.0" y2="241"/>
  <line class="dg-cross" x1="502.0" y1="241" x2="512.0" y2="231"/>
  <text class="dg-mono dg-accent-text" x="485.0" y="270" text-anchor="middle">RETRY b17</text>
  <path class="dg-arrow dg-message" d="M360 278 H602" marker-end="url(#flush-batch-head-accent)"/>
  <rect class="dg-box-accent" x="525.0" y="290" width="170" height="24" rx="4"/>
  <text class="dg-code" x="610.0" y="306.0" text-anchor="middle">b17 recorded: skip</text>
  </g>
</svg>
