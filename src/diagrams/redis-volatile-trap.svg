<svg class="diagram-svg" viewBox="0 0 720 286" role="img" aria-labelledby="redis-volatile-trap-title redis-volatile-trap-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-volatile-trap-title">allkeys-lru and volatile-lru on a server with cache and sessions</title>
  <desc id="redis-volatile-trap-desc">One server holds cached pages and sessions; page:3 was written without a TTL by mistake. At the memory limit, allkeys-lru drops the key used longest ago, session:a, and logs a viewer out. volatile-lru drops only keys with a TTL, page:1 and then page:2; page:3 and the sessions are never dropped, and once no key with a TTL is left, writes fail.</desc>
  <defs>
    <marker id="redis-volatile-trap-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-volatile-trap-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">allkeys-lru</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">any key can go</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">volatile-lru</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">only keys with a TTL can go</text>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="278"/>
  <text class="dg-mono dg-muted-text" x="24" y="66">KEY</text>
  <text class="dg-mono dg-muted-text" x="140" y="66">EXPIRY</text>
  <text class="dg-mono dg-muted-text" x="216" y="66">LAST USE</text>
  <rect class="dg-box" x="24" y="74" width="104" height="24" rx="4"/>
  <text class="dg-code" x="76.0" y="90.0" text-anchor="middle">page:1</text>
  <text class="dg-code" x="140" y="91">TTL</text>
  <text class="dg-code" x="216" y="91">9 min ago</text>
  <rect class="dg-box" x="24" y="106" width="104" height="24" rx="4"/>
  <text class="dg-code" x="76.0" y="122.0" text-anchor="middle">page:2</text>
  <text class="dg-code" x="140" y="123">TTL</text>
  <text class="dg-code" x="216" y="123">1 min ago</text>
  <rect class="dg-box" x="24" y="138" width="104" height="24" rx="4"/>
  <text class="dg-code" x="76.0" y="154.0" text-anchor="middle">page:3</text>
  <text class="dg-code" x="140" y="155">no TTL</text>
  <text class="dg-code" x="216" y="155">20 min ago</text>
  <rect class="dg-box-failed" x="24" y="170" width="104" height="24" rx="4"/>
  <text class="dg-code-muted" x="76.0" y="186.0" text-anchor="middle">session:a</text>
  <text class="dg-code-muted" x="140" y="187">no TTL</text>
  <text class="dg-code-muted" x="216" y="187">30 min ago</text>
  <line class="dg-cross" x1="15" y1="177" x2="25" y2="187"/>
  <line class="dg-cross" x1="15" y1="187" x2="25" y2="177"/>
  <rect class="dg-box" x="24" y="202" width="104" height="24" rx="4"/>
  <text class="dg-code" x="76.0" y="218.0" text-anchor="middle">session:b</text>
  <text class="dg-code" x="140" y="219">no TTL</text>
  <text class="dg-code" x="216" y="219">now</text>
  <text class="dg-mono dg-muted-text" x="384" y="66">KEY</text>
  <text class="dg-mono dg-muted-text" x="500" y="66">EXPIRY</text>
  <text class="dg-mono dg-muted-text" x="576" y="66">LAST USE</text>
  <rect class="dg-box-failed" x="384" y="74" width="104" height="24" rx="4"/>
  <text class="dg-code-muted" x="436.0" y="90.0" text-anchor="middle">page:1</text>
  <text class="dg-code-muted" x="500" y="91">TTL</text>
  <text class="dg-code-muted" x="576" y="91">9 min ago</text>
  <line class="dg-cross" x1="375" y1="81" x2="385" y2="91"/>
  <line class="dg-cross" x1="375" y1="91" x2="385" y2="81"/>
  <rect class="dg-box-failed" x="384" y="106" width="104" height="24" rx="4"/>
  <text class="dg-code-muted" x="436.0" y="122.0" text-anchor="middle">page:2</text>
  <text class="dg-code-muted" x="500" y="123">TTL</text>
  <text class="dg-code-muted" x="576" y="123">1 min ago</text>
  <line class="dg-cross" x1="375" y1="113" x2="385" y2="123"/>
  <line class="dg-cross" x1="375" y1="123" x2="385" y2="113"/>
  <rect class="dg-box-accent" x="384" y="138" width="104" height="24" rx="4"/>
  <text class="dg-code" x="436.0" y="154.0" text-anchor="middle">page:3</text>
  <text class="dg-code" x="500" y="155">no TTL</text>
  <text class="dg-code" x="576" y="155">20 min ago</text>
  <rect class="dg-box" x="384" y="170" width="104" height="24" rx="4"/>
  <text class="dg-code" x="436.0" y="186.0" text-anchor="middle">session:a</text>
  <text class="dg-code" x="500" y="187">no TTL</text>
  <text class="dg-code" x="576" y="187">30 min ago</text>
  <rect class="dg-box" x="384" y="202" width="104" height="24" rx="4"/>
  <text class="dg-code" x="436.0" y="218.0" text-anchor="middle">session:b</text>
  <text class="dg-code" x="500" y="219">no TTL</text>
  <text class="dg-code" x="576" y="219">now</text>
  <text class="dg-result" x="180" y="256" text-anchor="middle">Drops session:a: a logout</text>
  <text class="dg-result" x="540" y="256" text-anchor="middle">Then writes fail: page:3 stays</text>
</svg>
