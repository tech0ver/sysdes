<svg class="diagram-svg" viewBox="0 0 720 290" role="img" aria-labelledby="outage-paths-title outage-paths-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="outage-paths-title">What keeps working while the coordination service is down</title>
  <desc id="outage-paths-desc">The coordination service has no majority. Requests still go from the client through a router, which uses its cached map, to a storage node; writes go on only where the shard's replication makes takeovers safe on its own. Map refreshes and lease renewals fail. The controller stops acting, so shard moves, replacements of dead nodes, and elections wait until the service is back.</desc>
  <defs>
    <marker id="outage-paths-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="outage-paths-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-box" x="16" y="20" width="120" height="44" rx="6"/>
  <text class="dg-name" x="76.0" y="47.0" text-anchor="middle">Client</text>
  <rect class="dg-box" x="232" y="20" width="140" height="44" rx="6"/>
  <text class="dg-name" x="302.0" y="40.0" text-anchor="middle">Router</text>
  <text class="dg-sub" x="302.0" y="56.0" text-anchor="middle">cached map</text>
  <rect class="dg-box" x="468" y="20" width="236" height="44" rx="6"/>
  <text class="dg-name" x="586.0" y="47.0" text-anchor="middle">Storage node</text>
  <path class="dg-arrow dg-message" d="M136 42 H224" marker-end="url(#outage-paths-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="180" y="34" text-anchor="middle">REQUEST</text>
  <path class="dg-arrow dg-message" d="M372 42 H460" marker-end="url(#outage-paths-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="416" y="34" text-anchor="middle">REQUEST</text>
  <text class="dg-sub" x="560" y="86" text-anchor="middle">writes only where</text>
  <text class="dg-sub" x="560" y="102" text-anchor="middle">takeovers are safe</text>
  <rect class="dg-box-failed" x="216" y="160" width="488" height="110" rx="8"/>
  <text class="dg-name-muted" x="460" y="206" text-anchor="middle">Coordination service</text>
  <text class="dg-sub" x="460" y="226" text-anchor="middle">no majority: no writes, renewals, or elections</text>
  <path class="dg-arrow dg-empty" d="M302 64 V152" marker-end="url(#outage-paths-head)"/>
  <line class="dg-cross" x1="297" y1="123" x2="307" y2="133"/>
  <line class="dg-cross" x1="297" y1="133" x2="307" y2="123"/>
  <text class="dg-mono dg-muted-text" x="312" y="114" text-anchor="start">MAP REFRESH</text>
  <path class="dg-arrow dg-empty" d="M670 64 V152" marker-end="url(#outage-paths-head)"/>
  <line class="dg-cross" x1="665" y1="123" x2="675" y2="133"/>
  <line class="dg-cross" x1="665" y1="133" x2="675" y2="123"/>
  <text class="dg-mono dg-muted-text" x="662" y="140" text-anchor="end">RENEWAL</text>
  <rect class="dg-box" x="16" y="165" width="160" height="100" rx="6"/>
  <text class="dg-name" x="96" y="189" text-anchor="middle">Controller</text>
  <text class="dg-sub" x="96" y="213" text-anchor="middle">stopped: shard moves,</text>
  <text class="dg-sub" x="96" y="230" text-anchor="middle">replacements,</text>
  <text class="dg-sub" x="96" y="247" text-anchor="middle">elections wait</text>
  <path class="dg-arrow dg-empty" d="M176 215 H208" marker-end="url(#outage-paths-head)"/>
</svg>
