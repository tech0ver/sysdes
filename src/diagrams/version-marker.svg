<svg class="diagram-svg" viewBox="0 0 696 300" role="img" aria-labelledby="version-marker-title version-marker-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="version-marker-title">A version check with and without the marker</title>
  <desc id="version-marker-desc">The editor writes version 2 and leaves a marker with version 2 in the cache instead of a plain delete. Left: the late fill of version 1 meets the marker, and the cache rejects it. Right: the marker was evicted before the late fill arrived, so the cache no longer knows version 2 and stores version 1.</desc>
  <defs>
    <marker id="version-marker-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="version-marker-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-12 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="292"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Marker kept</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">the write left "42: v2 marker"</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Marker evicted</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">the write left "42: v2 marker"</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="58" text-anchor="middle">CACHE</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="58" text-anchor="middle">READER</text>
  <text class="dg-mono dg-muted-text" x="180.0" y="58" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="98.0" y1="66" x2="98.0" y2="226"/>
  <line class="dg-lifeline" x1="262.0" y1="66" x2="262.0" y2="226"/>
  <path class="dg-arrow" d="M180.0 66 V226" marker-end="url(#version-marker-head)"/>
  <rect class="dg-box" x="28.0" y="76" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="93" text-anchor="middle">v2 marker</text>
  <rect class="dg-box" x="192.0" y="148" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="165" text-anchor="middle">set v1</text>
  <rect class="dg-box-accent" x="28.0" y="184" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="201" text-anchor="middle">v1 &lt; v2: reject</text>
  <text class="dg-result" x="180.0" y="252" text-anchor="middle">The cache keeps no old value</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="58" text-anchor="middle">CACHE</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="58" text-anchor="middle">READER</text>
  <text class="dg-mono dg-muted-text" x="540.0" y="58" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="458.0" y1="66" x2="458.0" y2="226"/>
  <line class="dg-lifeline" x1="622.0" y1="66" x2="622.0" y2="226"/>
  <path class="dg-arrow" d="M540.0 66 V226" marker-end="url(#version-marker-head)"/>
  <rect class="dg-box" x="388.0" y="76" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="93" text-anchor="middle">v2 marker</text>
  <rect class="dg-box-failed" x="388.0" y="112" width="140" height="26" rx="4"/>
  <text class="dg-code-muted" x="458.0" y="129" text-anchor="middle">marker evicted</text>
  <rect class="dg-box" x="552.0" y="148" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="165" text-anchor="middle">set v1</text>
  <rect class="dg-box-accent" x="388.0" y="184" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="201" text-anchor="middle">stores v1</text>
  <text class="dg-result" x="540.0" y="252" text-anchor="middle">The old value is back</text>
  </g>
</svg>
