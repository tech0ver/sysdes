<svg class="diagram-svg" viewBox="0 0 706 268" role="img" aria-labelledby="client-id-conflict-title client-id-conflict-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="client-id-conflict-title">A client-made ID that already exists is a retry only for the same request</title>
  <desc id="client-id-conflict-desc">Both panels send a create with checkout ID 7c9e… that already exists, owned by buyer 1001 with one cart. Left: buyer 1001 repeats the same cart, so the server returns the existing checkout. Right: buyer 2002 sends the same ID with another cart, so the server rejects it with 409.</desc>
  <defs>
    <marker id="client-id-conflict-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="client-id-conflict-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-7 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="260"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">The same request again</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">buyer 1001, same cart</text>
  <text class="dg-mono dg-muted-text" x="76" y="76" text-anchor="middle">CLIENT</text>
  <line class="dg-lifeline" x1="76" y1="86" x2="76" y2="232"/>
  <text class="dg-mono dg-muted-text" x="284" y="76" text-anchor="middle">SERVER</text>
  <line class="dg-lifeline" x1="284" y1="86" x2="284" y2="232"/>
  <text class="dg-mono dg-muted-text" x="180.0" y="104" text-anchor="middle">CREATE 7C9E…</text>
  <path class="dg-arrow" d="M76 112 H276" marker-end="url(#client-id-conflict-head)"/>
  <rect class="dg-box" x="160" y="128" width="176" height="26" rx="4"/>
  <text class="dg-code" x="248.0" y="145.0" text-anchor="middle">same buyer and cart</text>
  <text class="dg-mono dg-muted-text" x="180.0" y="188" text-anchor="middle">200: EXISTING</text>
  <path class="dg-arrow" d="M284 196 H84" marker-end="url(#client-id-conflict-head)"/>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Another request, same ID</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">buyer 2002, other cart</text>
  <text class="dg-mono dg-muted-text" x="436" y="76" text-anchor="middle">CLIENT</text>
  <line class="dg-lifeline" x1="436" y1="86" x2="436" y2="232"/>
  <text class="dg-mono dg-muted-text" x="644" y="76" text-anchor="middle">SERVER</text>
  <line class="dg-lifeline" x1="644" y1="86" x2="644" y2="232"/>
  <text class="dg-mono dg-muted-text" x="540.0" y="104" text-anchor="middle">CREATE 7C9E…</text>
  <path class="dg-arrow" d="M436 112 H636" marker-end="url(#client-id-conflict-head)"/>
  <rect class="dg-box-accent" x="520" y="128" width="176" height="26" rx="4"/>
  <text class="dg-code" x="608.0" y="145.0" text-anchor="middle">owner is 1001</text>
  <text class="dg-mono dg-accent-text" x="540.0" y="188" text-anchor="middle">409: ID TAKEN</text>
  <path class="dg-arrow dg-message" d="M644 196 H444" marker-end="url(#client-id-conflict-head-accent)"/>
  </g>
</svg>
