<svg class="diagram-svg" viewBox="0 0 572 248" role="img" aria-labelledby="hold-states-title hold-states-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hold-states-title">The three ways a held booking ends</title>
  <desc id="hold-states-desc">A booking in held has its units taken. A payment moves it to confirmed, and its units stay taken. A cancel by the guest moves it to released, and a passed deadline to expired; both give the units back, one per night. Each move is a conditional update that passes only while the booking is held.</desc>
  <defs>
    <marker id="hold-states-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="hold-states-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-box-accent" x="16" y="96.0" width="160" height="56" rx="6"/>
  <text class="dg-name" x="96.0" y="122.0" text-anchor="middle">held</text>
  <text class="dg-sub" x="96.0" y="138.0" text-anchor="middle">units taken</text>
  <rect class="dg-box" x="376" y="20" width="180" height="56" rx="6"/>
  <text class="dg-name" x="466.0" y="46.0" text-anchor="middle">confirmed</text>
  <text class="dg-sub" x="466.0" y="62.0" text-anchor="middle">units stay taken</text>
  <path class="dg-arrow" d="M176 112.0 H260 V48.0 H368" marker-end="url(#hold-states-head)"/>
  <text class="dg-mono dg-muted-text" x="318.0" y="40.0" text-anchor="middle">PAYMENT</text>
  <rect class="dg-box" x="376" y="96" width="180" height="56" rx="6"/>
  <text class="dg-name" x="466.0" y="122.0" text-anchor="middle">released</text>
  <text class="dg-sub" x="466.0" y="138.0" text-anchor="middle">taken − 1 on each night</text>
  <path class="dg-arrow" d="M176 124.0 H368" marker-end="url(#hold-states-head)"/>
  <text class="dg-mono dg-muted-text" x="318.0" y="116.0" text-anchor="middle">GUEST CANCELS</text>
  <rect class="dg-box" x="376" y="172" width="180" height="56" rx="6"/>
  <text class="dg-name" x="466.0" y="198.0" text-anchor="middle">expired</text>
  <text class="dg-sub" x="466.0" y="214.0" text-anchor="middle">taken − 1 on each night</text>
  <path class="dg-arrow" d="M176 136.0 H260 V200.0 H368" marker-end="url(#hold-states-head)"/>
  <text class="dg-mono dg-muted-text" x="318.0" y="192.0" text-anchor="middle">DEADLINE PASSED</text>
  <text class="dg-code" x="96" y="178" text-anchor="middle">WHERE status = 'held'</text>
</svg>
