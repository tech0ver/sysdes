<svg class="diagram-svg" viewBox="0 0 720 214" role="img" aria-labelledby="node-record-and-alive-key-title node-record-and-alive-key-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="node-record-and-alive-key-title">A persistent node record next to an ephemeral liveness key</title>
  <desc id="node-record-and-alive-key-desc">Left, while node 9 runs: /kv/alive/node-09 and /kv/alive/node-14 exist, and /kv/nodes/node-09 and /kv/nodes/node-14 hold the nodes' addresses. Right, after node 9 died: /kv/alive/node-09 is gone after the timeout, and every other key stays as it was, including the record of node 9.</desc>
  <defs>
    <marker id="node-record-and-alive-key-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="node-record-and-alive-key-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="206"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Node 9 runs</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">both liveness keys are renewed</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Node 9 died</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">after the timeout</text>
  <rect class="dg-box" x="30" y="60" width="300" height="26" rx="4"/>
  <text class="dg-code" x="44" y="77" text-anchor="start">/kv/alive/node-09</text>
  <text class="dg-code" x="316" y="77" text-anchor="end"></text>
  <rect class="dg-box" x="30" y="94" width="300" height="26" rx="4"/>
  <text class="dg-code" x="44" y="111" text-anchor="start">/kv/alive/node-14</text>
  <text class="dg-code" x="316" y="111" text-anchor="end"></text>
  <rect class="dg-box" x="30" y="140" width="300" height="26" rx="4"/>
  <text class="dg-code" x="44" y="157" text-anchor="start">/kv/nodes/node-09</text>
  <text class="dg-code" x="316" y="157" text-anchor="end">10.0.3.9</text>
  <rect class="dg-box" x="30" y="174" width="300" height="26" rx="4"/>
  <text class="dg-code" x="44" y="191" text-anchor="start">/kv/nodes/node-14</text>
  <text class="dg-code" x="316" y="191" text-anchor="end">10.0.3.14</text>
  <text class="dg-mono dg-muted-text" x="30" y="54" text-anchor="start">EPHEMERAL KEYS</text>
  <text class="dg-mono dg-muted-text" x="30" y="134" text-anchor="start">NODE RECORDS</text>
  <rect class="dg-box-failed" x="390" y="60" width="300" height="26" rx="4"/>
  <text class="dg-code-muted" x="404" y="77" text-anchor="start">/kv/alive/node-09</text>
  <text class="dg-code-muted" x="676" y="77" text-anchor="end">deleted</text>
  <rect class="dg-box" x="390" y="94" width="300" height="26" rx="4"/>
  <text class="dg-code" x="404" y="111" text-anchor="start">/kv/alive/node-14</text>
  <text class="dg-code" x="676" y="111" text-anchor="end"></text>
  <rect class="dg-box" x="390" y="140" width="300" height="26" rx="4"/>
  <text class="dg-code" x="404" y="157" text-anchor="start">/kv/nodes/node-09</text>
  <text class="dg-code" x="676" y="157" text-anchor="end">10.0.3.9</text>
  <rect class="dg-box" x="390" y="174" width="300" height="26" rx="4"/>
  <text class="dg-code" x="404" y="191" text-anchor="start">/kv/nodes/node-14</text>
  <text class="dg-code" x="676" y="191" text-anchor="end">10.0.3.14</text>
  <text class="dg-mono dg-muted-text" x="390" y="54" text-anchor="start">EPHEMERAL KEYS</text>
  <text class="dg-mono dg-muted-text" x="390" y="134" text-anchor="start">NODE RECORDS</text>
</svg>
