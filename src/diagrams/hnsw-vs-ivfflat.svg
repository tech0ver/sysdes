<svg class="diagram-svg" viewBox="0 0 654 290" role="img" aria-labelledby="hnsw-vs-ivfflat-title hnsw-vs-ivfflat-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hnsw-vs-ivfflat-title">How HNSW and IVFFlat find the nearest vectors</title>
  <desc id="hnsw-vs-ivfflat-desc">The same sixteen vectors and the same query in both panels. Left, HNSW: a graph of neighbors; the search walks from an entry point along the edges toward the query and finds the nearest vector. Right, IVFFlat: the vectors are split into four clusters; with probes = 1 the search reads only the cluster whose center is closest to the query and misses the nearest vector, which lies in the next cluster.</desc>
