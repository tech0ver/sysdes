<svg class="diagram-svg" viewBox="0 0 717 204" role="img" aria-labelledby="redis-stream-groups-title redis-stream-groups-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-stream-groups-title">Two groups read one stream</title>
  <desc id="redis-stream-groups-desc">The stream notify holds entries 101-0 to 105-0, and XADD appends new ones. The group notifier has received 101-0 to 104-0 and reads 105-0 next. The group analytics has received 101-0 and 102-0 and reads 103-0 next. Both groups get every entry, each at its own position.</desc>
  <defs>
    <marker id="redis-stream-groups-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-stream-groups-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(0 0)">
  <text class="dg-code" x="16" y="46">notify</text>
  <rect class="dg-chip" x="150" y="28" width="84" height="28" rx="4"/>
  <text class="dg-code" x="192.0" y="46.0" text-anchor="middle">101-0</text>
  <rect class="dg-chip" x="246" y="28" width="84" height="28" rx="4"/>
  <text class="dg-code" x="288.0" y="46.0" text-anchor="middle">102-0</text>
  <rect class="dg-chip" x="342" y="28" width="84" height="28" rx="4"/>
  <text class="dg-code" x="384.0" y="46.0" text-anchor="middle">103-0</text>
  <rect class="dg-chip" x="438" y="28" width="84" height="28" rx="4"/>
  <text class="dg-code" x="480.0" y="46.0" text-anchor="middle">104-0</text>
  <rect class="dg-chip" x="534" y="28" width="84" height="28" rx="4"/>
  <text class="dg-code" x="576.0" y="46.0" text-anchor="middle">105-0</text>
  <path class="dg-arrow dg-empty" d="M700 42 H642" marker-end="url(#redis-stream-groups-head)"/>
  <text class="dg-mono dg-muted-text" x="671" y="32" text-anchor="middle">XADD</text>
  <text class="dg-mono dg-muted-text" x="16" y="88">GROUP</text>
  <text class="dg-mono dg-muted-text" x="150" y="88">RECEIVED</text>
  <text class="dg-code" x="16" y="112">notifier</text>
  <rect class="dg-bar" x="150" y="99" width="372" height="18" rx="3"/>
  <line class="dg-message" x1="528" y1="94" x2="528" y2="122"/>
  <text class="dg-mono dg-accent-text" x="536" y="112">NEXT: 105-0</text>
  <text class="dg-code" x="16" y="154">analytics</text>
  <rect class="dg-bar" x="150" y="141" width="180" height="18" rx="3"/>
  <line class="dg-message" x1="336" y1="136" x2="336" y2="164"/>
  <text class="dg-mono dg-accent-text" x="344" y="154">NEXT: 103-0</text>
  <text class="dg-result" x="360" y="192" text-anchor="middle">Each group gets every entry and keeps its own position</text>
  </g>
</svg>
