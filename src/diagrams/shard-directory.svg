  <path class="dg-arrow" d="M456 160 H486" marker-end="url(#shard-directory-head)"/>
  <rect class="dg-box" x="494" y="148" width="90" height="24" rx="4"/>
  <text class="dg-code" x="539.0" y="164.0" text-anchor="middle">shard 1</text>
  <rect class="dg-chip" x="384" y="178" width="66" height="24" rx="4"/>
  <text class="dg-code" x="417.0" y="194.0" text-anchor="middle">ws 71</text>
  <path class="dg-arrow" d="M456 190 H486" marker-end="url(#shard-directory-head)"/>
  <rect class="dg-box-accent" x="494" y="178" width="90" height="24" rx="4"/>
  <text class="dg-code" x="539.0" y="194.0" text-anchor="middle">shard 1</text>
  <text class="dg-sub" x="596" y="194">new, emptiest</text>
  <rect class="dg-box" x="384" y="222" width="96" height="122" rx="6"/>
  <text class="dg-sub" x="432" y="242" text-anchor="middle">shard 1</text>
  <rect class="dg-chip" x="394" y="252" width="76" height="24" rx="4"/>
  <text class="dg-code" x="432.0" y="268.0" text-anchor="middle">ws 58</text>
  <rect class="dg-chip" x="394" y="280" width="76" height="24" rx="4"/>
  <text class="dg-code" x="432.0" y="296.0" text-anchor="middle">ws 71</text>
  <rect class="dg-box" x="492" y="222" width="96" height="122" rx="6"/>
  <text class="dg-sub" x="540" y="242" text-anchor="middle">shard 2</text>
  <rect class="dg-chip" x="502" y="252" width="76" height="24" rx="4"/>
  <text class="dg-code" x="540.0" y="268.0" text-anchor="middle">ws 17</text>
  <rect class="dg-chip" x="502" y="280" width="76" height="24" rx="4"/>
  <text class="dg-code" x="540.0" y="296.0" text-anchor="middle">ws 33</text>
  <rect class="dg-box" x="600" y="222" width="96" height="122" rx="6"/>
  <text class="dg-sub" x="648" y="242" text-anchor="middle">shard 3</text>
  <rect class="dg-chip" x="610" y="252" width="76" height="50" rx="4"/>
