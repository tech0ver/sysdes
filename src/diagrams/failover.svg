  <text class="dg-code" x="268.0" y="68.0" text-anchor="middle">98</text>
  <rect class="dg-box-accent" x="284" y="52" width="24" height="24" rx="4"/>
  <text class="dg-code" x="296.0" y="68.0" text-anchor="middle">99</text>
  <rect class="dg-box-accent" x="312" y="52" width="24" height="24" rx="4"/>
  <text class="dg-code" x="324.0" y="68.0" text-anchor="middle">100</text>
  <text class="dg-name" x="20" y="131" text-anchor="start">Follower 1</text>
