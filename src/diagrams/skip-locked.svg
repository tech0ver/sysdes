  <rect class="dg-box" x="300" y="120" width="160" height="24" rx="4"/>
  <text class="dg-code" x="380.0" y="136.0" text-anchor="middle">88124 · email</text>
  <rect class="dg-box" x="300" y="148" width="160" height="24" rx="4"/>
  <text class="dg-code" x="380.0" y="164.0" text-anchor="middle">88125 · resize</text>
  <rect class="dg-box" x="300" y="176" width="160" height="24" rx="4"/>
  <text class="dg-code" x="380.0" y="192.0" text-anchor="middle">88126 · email</text>
  <rect class="dg-box" x="300" y="204" width="160" height="24" rx="4"/>
  <text class="dg-code" x="380.0" y="220.0" text-anchor="middle">88127 · resize</text>
  <rect class="dg-box" x="300" y="232" width="160" height="24" rx="4"/>
