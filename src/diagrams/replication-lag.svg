<svg class="diagram-svg" viewBox="0 0 720 262" role="img" aria-labelledby="replication-lag-title replication-lag-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="replication-lag-title">Replication lag and a stale read</title>
  <desc id="replication-lag-desc">Three rows show the price of a mug on each replica over time. All replicas start at 12.50. At 0 seconds the leader changes it to 9.99. Follower 1 applies the change at 0.2 seconds, follower 2 only at 3 seconds, so for 3 seconds follower 2 still shows the old price. A read from follower 2 at 1 second returns 12.50, a stale read.</desc>
  <defs>
    <marker id="replication-lag-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="replication-lag-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-line" x1="170" y1="40" x2="690" y2="40"/>
  <line class="dg-line" x1="170.0" y1="36" x2="170.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="170.0" y="28" text-anchor="middle">-1 s</text>
  <line class="dg-line" x1="274.0" y1="36" x2="274.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="274.0" y="28" text-anchor="middle">0 s</text>
  <line class="dg-line" x1="378.0" y1="36" x2="378.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="378.0" y="28" text-anchor="middle">1 s</text>
  <line class="dg-line" x1="482.0" y1="36" x2="482.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="482.0" y="28" text-anchor="middle">2 s</text>
  <line class="dg-line" x1="586.0" y1="36" x2="586.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="586.0" y="28" text-anchor="middle">3 s</text>
  <line class="dg-line" x1="690.0" y1="36" x2="690.0" y2="44"/>
  <text class="dg-mono dg-muted-text" x="690.0" y="28" text-anchor="middle">4 s</text>
  <line class="dg-rule" x1="274.0" y1="48" x2="274.0" y2="196"/>
  <text class="dg-name" x="20" y="78" text-anchor="start">Leader</text>
  <rect class="dg-chip" x="170" y="60" width="104.0" height="26" rx="4"/>
  <text class="dg-code-muted" x="222.0" y="77" text-anchor="middle">12.50</text>
  <rect class="dg-box" x="274.0" y="60" width="416.0" height="26" rx="4"/>
  <text class="dg-code" x="482.0" y="77.0" text-anchor="middle">9.99</text>
  <text class="dg-name" x="20" y="126" text-anchor="start">Follower 1</text>
  <rect class="dg-chip" x="170" y="108" width="124.80000000000001" height="26" rx="4"/>
  <text class="dg-code-muted" x="222.0" y="125" text-anchor="middle">12.50</text>
  <rect class="dg-box" x="294.8" y="108" width="395.2" height="26" rx="4"/>
  <text class="dg-code" x="492.4" y="125.0" text-anchor="middle">9.99</text>
  <text class="dg-name" x="20" y="174" text-anchor="start">Follower 2</text>
  <rect class="dg-chip" x="170" y="156" width="416.0" height="26" rx="4"/>
  <text class="dg-code-muted" x="222.0" y="173" text-anchor="middle">12.50</text>
  <rect class="dg-box" x="586.0" y="156" width="104.0" height="26" rx="4"/>
  <text class="dg-code" x="638.0" y="173.0" text-anchor="middle">9.99</text>
  <path class="dg-arrow" d="M274.0 190 V196 H586.0 V190"/>
  <text class="dg-mono dg-muted-text" x="430.0" y="212" text-anchor="middle">LAG: 3 s</text>
  <line class="dg-guide" x1="378.0" y1="44" x2="378.0" y2="240"/>
  <circle class="dg-dot" cx="378.0" cy="169" r="5"/>
  <text class="dg-mono dg-accent-text" x="378.0" y="252" text-anchor="middle">READ AT 1 s RETURNS 12.50</text>
</svg>
