<svg class="sk-svg" viewBox="0 0 636 480" role="img" aria-labelledby="framework-deep-dive-title framework-deep-dive-desc" data-steps="[&quot;The problem: a crash between 2 and 3 repeats 2&quot;,&quot;The choice: a key per message at the provider&quot;]" data-final="The deep dive" xmlns="http://www.w3.org/2000/svg">
<title id="framework-deep-dive-title">Deep dive: duplicates after a sender crash</title>
<desc id="framework-deep-dive-desc">The sender, larger: 1. it reads a message from the queue, 2. delivers it through the provider, 3. writes the status to the message store. A sender that crashes between 2 and 3 leaves the message unmarked, and the next sender repeats 2. Options: write the status before 2 (may lose the message), after 2 (may repeat it), or send a key per message to the provider. Choice: deliver with key = message_id, so the provider drops a repeat; no duplicates where the provider takes keys, rare duplicates elsewhere, allowed by requirement 3.</desc>
