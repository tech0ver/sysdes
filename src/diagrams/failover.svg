  <text class="dg-code" x="628.0" y="196.0" text-anchor="middle">98</text>
  <rect class="dg-box-failed" x="644" y="180" width="24" height="24" rx="4"/>
  <rect class="dg-box-failed" x="672" y="180" width="24" height="24" rx="4"/>
  <text class="dg-mono dg-accent-text" x="670.0" y="108" text-anchor="middle">LOST</text>
  <text class="dg-result" x="180" y="246" text-anchor="middle">99 and 100 confirmed, only on the leader</text>
  <text class="dg-result" x="540" y="246" text-anchor="middle">99 and 100 are gone</text>
</svg>
