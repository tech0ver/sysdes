<svg class="diagram-svg" viewBox="0 0 720 270" role="img" aria-labelledby="read-committed-title read-committed-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="read-committed-title">Read committed: writers wait for the lock, plain readers see the last committed value</title>
  <desc id="read-committed-desc">Left: purchase A writes seat 14 and holds its lock; purchase B wants to write the same row and waits until A commits, then writes. Right: A has given seat 14 to its order but not committed; a plain read in a database with row versions returns the last committed value, free, without waiting; after A commits, the same read returns A.</desc>
  <defs>
    <marker id="read-committed-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="read-committed-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="262"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Two writers</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="56" text-anchor="middle">PURCHASE A</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="56" text-anchor="middle">PURCHASE B</text>
  <text class="dg-mono dg-muted-text" x="180.0" y="56" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="98.0" y1="64" x2="98.0" y2="224"/>
  <line class="dg-lifeline" x1="262.0" y1="64" x2="262.0" y2="224"/>
  <path class="dg-arrow" d="M180.0 64 V224" marker-end="url(#read-committed-head)"/>
  <rect class="dg-box" x="28.0" y="74" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="91" text-anchor="middle">seat 14 → A</text>
  <rect class="dg-box-failed" x="192.0" y="110" width="140" height="26" rx="4"/>
  <text class="dg-code-muted" x="262.0" y="127" text-anchor="middle">waits for A</text>
  <rect class="dg-box" x="28.0" y="146" width="140" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="163" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="192.0" y="182" width="140" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="199" text-anchor="middle">seat 14 → B</text>
  <text class="dg-result" x="180.0" y="250" text-anchor="middle">B writes after A’s commit</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">A writer and a reader</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="56" text-anchor="middle">PURCHASE A</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="56" text-anchor="middle">READER</text>
  <text class="dg-mono dg-muted-text" x="540.0" y="56" text-anchor="middle">TIME</text>
  <line class="dg-lifeline" x1="458.0" y1="64" x2="458.0" y2="224"/>
  <line class="dg-lifeline" x1="622.0" y1="64" x2="622.0" y2="224"/>
  <path class="dg-arrow" d="M540.0 64 V224" marker-end="url(#read-committed-head)"/>
  <rect class="dg-box" x="388.0" y="74" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="91" text-anchor="middle">seat 14 → A</text>
  <rect class="dg-box-accent" x="552.0" y="110" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="127" text-anchor="middle">read 14: free</text>
  <rect class="dg-box" x="388.0" y="146" width="140" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="163" text-anchor="middle">COMMIT</text>
  <rect class="dg-box" x="552.0" y="182" width="140" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="199" text-anchor="middle">read 14: A</text>
  <text class="dg-result" x="540.0" y="250" text-anchor="middle">Free until A commits</text>
</svg>
