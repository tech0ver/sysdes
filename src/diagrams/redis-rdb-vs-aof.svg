  <title id="redis-rdb-vs-aof-title">What a crash loses with snapshots and with the AOF</title>
  <desc id="redis-rdb-vs-aof-desc">Two timelines over ten minutes, with a crash at 8:20. Top: snapshots at 0:00 and 5:00, so the crash loses everything written after 5:00, more than three minutes. Bottom: the AOF is flushed once a second, so a crash of the machine usually loses about the last second.</desc>
