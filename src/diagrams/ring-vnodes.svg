<svg class="diagram-svg" viewBox="0 0 720 340" role="img" aria-labelledby="ring-vnodes-title ring-vnodes-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ring-vnodes-title">A new node on the ring, with one position per node and with virtual nodes</title>
  <desc id="ring-vnodes-desc">Two rings; each key belongs to the first node clockwise from it. The thick arcs are the keys that new node D takes over. Left: nodes A, B, and C have one position each, and the arcs between them are uneven. Node D lands between A and B and takes only keys that node B owned. Right: nodes A, B, and C have three positions each. Node D takes three positions and takes a short arc from each of nodes B, A, and C.</desc>
  <defs>
    <marker id="ring-vnodes-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ring-vnodes-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="332"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">One position per node</text>
  <line class="dg-wait" x1="118" y1="44" x2="142" y2="44"/>
  <text class="dg-sub" x="150" y="48">keys D takes over</text>
  <circle class="dg-arrow" cx="180" cy="178" r="100"/>
  <path class="dg-arrow dg-wait" d="M230.0 91.4 A100 100 0 0 1 278.5 195.4"/>
  <circle class="dg-dot-muted" cx="230.0" cy="91.4" r="5"/>
  <text class="dg-code" x="239.0" y="80.8" text-anchor="middle">A</text>
  <circle class="dg-dot" cx="278.5" cy="195.4" r="5"/>
  <text class="dg-accent-text dg-code" x="296.2" y="203.5" text-anchor="middle">D</text>
  <circle class="dg-dot-muted" cx="230.0" cy="264.6" r="5"/>
  <text class="dg-code" x="239.0" y="285.2" text-anchor="middle">B</text>
  <circle class="dg-dot-muted" cx="86.0" cy="212.2" r="5"/>
  <text class="dg-code" x="69.1" y="223.4" text-anchor="middle">C</text>
  <text class="dg-result" x="180" y="324" text-anchor="middle">D takes keys from B only</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Virtual nodes</text>
  <line class="dg-wait" x1="478" y1="44" x2="502" y2="44"/>
  <text class="dg-sub" x="510" y="48">keys D takes over</text>
  <circle class="dg-arrow" cx="540" cy="178" r="100"/>
  <path class="dg-arrow dg-wait" d="M557.4 79.5 A100 100 0 0 1 590.0 91.4"/>
  <path class="dg-arrow dg-wait" d="M640.0 178.0 A100 100 0 0 1 634.0 212.2"/>
  <path class="dg-arrow dg-wait" d="M557.4 276.5 A100 100 0 0 1 522.6 276.5"/>
  <circle class="dg-dot-muted" cx="557.4" cy="79.5" r="5"/>
  <text class="dg-code" x="560.5" y="66.8" text-anchor="middle">A</text>
  <circle class="dg-dot" cx="590.0" cy="91.4" r="5"/>
  <text class="dg-accent-text dg-code" x="599.0" y="80.8" text-anchor="middle">D</text>
  <circle class="dg-dot-muted" cx="616.6" cy="113.7" r="5"/>
  <text class="dg-code" x="630.4" y="107.2" text-anchor="middle">B</text>
