<svg class="diagram-svg" viewBox="0 0 686 292" role="img" aria-labelledby="redis-check-race-title redis-check-race-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-check-race-title">Checking a limit with two commands and with one script</title>
  <desc id="redis-check-race-desc">Time runs down. Left: app servers 1 and 2 both GET the counter of a viewer and see 4, below the limit of 5; both INCR it, and the viewer sends 6 messages. Right: each app server runs one script that checks and adds in one step; the first gets 5 and is allowed, the second is refused.</desc>
  <defs>
    <marker id="redis-check-race-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-check-race-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-17 0)">
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">GET, then INCR</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">two commands</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">One script</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">check and add in one step</text>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="284"/>
  <text class="dg-mono dg-muted-text" x="50" y="76" text-anchor="middle">APP 1</text>
  <line class="dg-lifeline" x1="50" y1="86" x2="50" y2="248"/>
  <text class="dg-mono dg-muted-text" x="180" y="76" text-anchor="middle">REDIS</text>
  <line class="dg-lifeline" x1="180" y1="86" x2="180" y2="248"/>
  <text class="dg-mono dg-muted-text" x="310" y="76" text-anchor="middle">APP 2</text>
  <line class="dg-lifeline" x1="310" y1="86" x2="310" y2="248"/>
  <text class="dg-mono dg-muted-text" x="410" y="76" text-anchor="middle">APP 1</text>
  <line class="dg-lifeline" x1="410" y1="86" x2="410" y2="248"/>
  <text class="dg-mono dg-muted-text" x="540" y="76" text-anchor="middle">REDIS</text>
  <line class="dg-lifeline" x1="540" y1="86" x2="540" y2="248"/>
  <text class="dg-mono dg-muted-text" x="670" y="76" text-anchor="middle">APP 2</text>
  <line class="dg-lifeline" x1="670" y1="86" x2="670" y2="248"/>
  <text class="dg-mono dg-muted-text" x="115.0" y="98" text-anchor="middle">GET</text>
  <path class="dg-arrow" d="M50 106 H172" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="115.0" y="120" text-anchor="middle">4</text>
  <path class="dg-arrow" d="M180 128 H58" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="245.0" y="142" text-anchor="middle">GET</text>
  <path class="dg-arrow" d="M310 150 H188" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="245.0" y="164" text-anchor="middle">4</text>
  <path class="dg-arrow" d="M180 172 H302" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="115.0" y="186" text-anchor="middle">INCR</text>
  <path class="dg-arrow" d="M50 194 H172" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="115.0" y="208" text-anchor="middle">5</text>
  <path class="dg-arrow" d="M180 216 H58" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-accent-text" x="245.0" y="208" text-anchor="middle">INCR</text>
  <path class="dg-arrow dg-message" d="M310 216 H188" marker-end="url(#redis-check-race-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="245.0" y="230" text-anchor="middle">6</text>
  <path class="dg-arrow dg-message" d="M180 238 H302" marker-end="url(#redis-check-race-head-accent)"/>
  <text class="dg-result" x="180" y="274" text-anchor="middle">6 messages pass the limit of 5</text>
  <text class="dg-mono dg-muted-text" x="475.0" y="98" text-anchor="middle">EVAL LIMIT</text>
  <path class="dg-arrow" d="M410 106 H532" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="475.0" y="120" text-anchor="middle">5, OK</text>
  <path class="dg-arrow" d="M540 128 H418" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-muted-text" x="605.0" y="142" text-anchor="middle">EVAL LIMIT</text>
  <path class="dg-arrow" d="M670 150 H548" marker-end="url(#redis-check-race-head)"/>
  <text class="dg-mono dg-accent-text" x="605.0" y="164" text-anchor="middle">REFUSED</text>
  <path class="dg-arrow dg-message" d="M540 172 H662" marker-end="url(#redis-check-race-head-accent)"/>
  <text class="dg-result" x="540" y="274" text-anchor="middle">The second message is refused</text>
  </g>
</svg>
