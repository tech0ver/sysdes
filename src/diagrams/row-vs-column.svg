<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="row-vs-column-title row-vs-column-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="row-vs-column-title">Row storage and column storage</title>
  <desc id="row-vs-column-desc">The same five clicks with four columns: code, time, country, device. Row storage keeps each row together, so a query that needs only time and country still reads all 20 values and drops code and device. Column storage keeps each column together, so the query reads only the time and country columns: 10 values. A column holds values of one type that often repeat, so it compresses well.</desc>
  <defs>
    <marker id="row-vs-column-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="row-vs-column-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="164" y="24" text-anchor="middle">Row storage</text>
  <text class="dg-sub" x="164" y="42" text-anchor="middle">each row stored together</text>
  <text class="dg-mono dg-muted-text" x="56.0" y="70" text-anchor="middle">CODE</text>
  <text class="dg-mono dg-muted-text" x="128.0" y="70" text-anchor="middle">TIME</text>
  <text class="dg-mono dg-muted-text" x="200.0" y="70" text-anchor="middle">COUNTRY</text>
  <text class="dg-mono dg-muted-text" x="272.0" y="70" text-anchor="middle">DEVICE</text>
