<svg class="diagram-svg" viewBox="0 0 720 274" role="img" aria-labelledby="sequential-vs-linearizable-title sequential-vs-linearizable-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="sequential-vs-linearizable-title">A read of an old value after a finished write</title>
  <desc id="sequential-vs-linearizable-desc">The balance was 100. Left, in real time: Anna writes 150, and the write finishes. Then Ben reads 100, the old value, and later reads 150. Right: sequential consistency accepts this, because one order exists that keeps each client's own order: Ben reads 100, Anna writes 150, Ben reads 150. Linearizability does not accept it, because its order must match real time.</desc>
  <defs>
    <marker id="sequential-vs-linearizable-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="sequential-vs-linearizable-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="266"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">In real time</text>
  <text class="dg-sub" x="180" y="40" text-anchor="middle">the balance was 100</text>
  <text class="dg-mono dg-muted-text" x="95" y="64" text-anchor="middle">ANNA</text>
  <text class="dg-mono dg-muted-text" x="265" y="64" text-anchor="middle">BEN</text>
  <text class="dg-mono dg-muted-text" x="180" y="64" text-anchor="middle">TIME</text>
  <path class="dg-arrow" d="M180 72 V226" marker-end="url(#sequential-vs-linearizable-head)"/>
  <rect class="dg-box" x="30" y="82" width="130" height="28" rx="4"/>
  <text class="dg-code" x="95.0" y="100.0" text-anchor="middle">write 150</text>
  <rect class="dg-box-accent" x="200" y="130" width="130" height="28" rx="4"/>
  <text class="dg-code" x="265.0" y="148.0" text-anchor="middle">read: 100</text>
  <rect class="dg-box" x="200" y="190" width="130" height="28" rx="4"/>
  <text class="dg-code" x="265.0" y="208.0" text-anchor="middle">read: 150</text>
  <text class="dg-result" x="180" y="258" text-anchor="middle">Linearizable: not allowed</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">One order that fits</text>
  <text class="dg-mono dg-muted-text" x="540" y="64" text-anchor="middle">KEEPS EACH CLIENT'S ORDER</text>
  <text class="dg-sub" x="430" y="100">1. Ben</text>
  <rect class="dg-box-accent" x="495" y="82" width="130" height="28" rx="4"/>
  <text class="dg-code" x="560.0" y="100.0" text-anchor="middle">read: 100</text>
  <text class="dg-sub" x="430" y="156">2. Anna</text>
  <rect class="dg-box" x="495" y="138" width="130" height="28" rx="4"/>
  <text class="dg-code" x="560.0" y="156.0" text-anchor="middle">write 150</text>
  <path class="dg-arrow" d="M560 110 V136" marker-end="url(#sequential-vs-linearizable-head)"/>
  <text class="dg-sub" x="430" y="212">3. Ben</text>
  <rect class="dg-box" x="495" y="194" width="130" height="28" rx="4"/>
  <text class="dg-code" x="560.0" y="212.0" text-anchor="middle">read: 150</text>
  <path class="dg-arrow" d="M560 166 V192" marker-end="url(#sequential-vs-linearizable-head)"/>
  <text class="dg-result" x="540" y="258" text-anchor="middle">Sequential: allowed</text>
</svg>
