<svg class="diagram-svg" viewBox="0 0 720 250" role="img" aria-labelledby="leader-followers-title leader-followers-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="leader-followers-title">One leader and two followers</title>
  <desc id="leader-followers-desc">A new order is written to the leader, whose replication log holds changes 1 to 9. The leader sends the log to two followers. Follower 1 has applied all nine changes; follower 2 has applied changes 1 to 7 and is behind. Product page reads go to the followers.</desc>
