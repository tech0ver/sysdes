  <text class="dg-name" x="600" y="99" text-anchor="middle">L</text>
  <rect class="dg-box" x="580.0" y="187.0" width="40" height="26" rx="6"/>
  <text class="dg-name" x="600" y="205" text-anchor="middle">V</text>
  <rect class="dg-box" x="580.0" y="293.0" width="40" height="26" rx="6"/>
  <text class="dg-name" x="600" y="311" text-anchor="middle">V</text>
  <path class="dg-arrow dg-message" d="M600 107 V187"/>
  <path class="dg-arrow dg-message" d="M620 94 H680 V306 H620"/>
  <text class="dg-result" x="120" y="362" text-anchor="middle">Writes stay in Europe</text>
  <text class="dg-result" x="360" y="362" text-anchor="middle">Each region on its own</text>
  <text class="dg-result" x="600" y="362" text-anchor="middle">Leader + one more region</text>
  <text class="dg-sub" x="360" y="384" text-anchor="middle">L: leader · V: voter · O: observer, no vote</text>
</svg>
