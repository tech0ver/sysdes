  <path class="dg-arrow dg-message" d="M621 166 V204" marker-end="url(#uuid-inserts-head-accent)"/>
  <rect class="dg-box" x="650.0" y="146" width="46" height="20" rx="4"/>
  <text class="dg-code" x="673.0" y="160.0" text-anchor="middle">e4a9…</text>
  <path class="dg-arrow dg-message" d="M673 166 V204" marker-end="url(#uuid-inserts-head-accent)"/>
  <rect class="dg-box-accent" x="390" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="413.0" y="223.0" text-anchor="middle">p1</text>
  <rect class="dg-box-accent" x="442" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="465.0" y="223.0" text-anchor="middle">p2</text>
  <rect class="dg-box-accent" x="494" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="517.0" y="223.0" text-anchor="middle">p3</text>
  <rect class="dg-box" x="546" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="569.0" y="223.0" text-anchor="middle">p4</text>
  <rect class="dg-box-accent" x="598" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="621.0" y="223.0" text-anchor="middle">p5</text>
  <rect class="dg-box-accent" x="650" y="204" width="46" height="30" rx="4"/>
  <text class="dg-code" x="673.0" y="223.0" text-anchor="middle">p6</text>
  <text class="dg-result" x="540" y="258" text-anchor="middle">UUIDv4: 46 min</text>
  </g>
</svg>
