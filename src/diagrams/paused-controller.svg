<svg class="diagram-svg" viewBox="0 0 720 350" role="img" aria-labelledby="paused-controller-title paused-controller-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="paused-controller-title">A paused controller wakes up and acts on an old plan</title>
  <desc id="paused-controller-desc">Controller A stops for 40 seconds in a garbage collection pause. Its lease runs out, controller B wins the election and moves shard 17 from node 9 to node 14. Then A wakes up and writes its old plan: shard 17 to node 20. For a moment, two controllers change the map.</desc>
  <defs>
    <marker id="paused-controller-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="paused-controller-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="110" y="20" text-anchor="middle">CONTROLLER A</text>
  <line class="dg-lifeline" x1="110" y1="34" x2="110" y2="340"/>
  <text class="dg-mono dg-muted-text" x="360" y="20" text-anchor="middle">SERVICE</text>
  <line class="dg-lifeline" x1="360" y1="34" x2="360" y2="340"/>
  <text class="dg-mono dg-muted-text" x="610" y="20" text-anchor="middle">CONTROLLER B</text>
  <line class="dg-lifeline" x1="610" y1="34" x2="610" y2="340"/>
  <rect class="dg-box" x="290.0" y="44" width="140" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="60.0" text-anchor="middle">controller = A</text>
  <rect class="dg-box-failed" x="60" y="76" width="100" height="170" rx="4"/>
  <text class="dg-code-muted" x="110.0" y="165.0" text-anchor="middle">paused 40 s</text>
  <rect class="dg-box-failed" x="290.0" y="96" width="140" height="24" rx="4"/>
  <text class="dg-code-muted" x="360.0" y="112.0" text-anchor="middle">A's lease ends</text>
  <text class="dg-mono dg-muted-text" x="485.0" y="142" text-anchor="middle">CREATE IF ABSENT</text>
  <path class="dg-arrow" d="M610 150 H368" marker-end="url(#paused-controller-head)"/>
  <rect class="dg-box" x="290.0" y="160" width="140" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="176.0" text-anchor="middle">controller = B</text>
  <text class="dg-mono dg-muted-text" x="485.0" y="214" text-anchor="middle">SHARD 17 → NODE 14</text>
  <path class="dg-arrow" d="M610 222 H368" marker-end="url(#paused-controller-head)"/>
  <rect class="dg-box" x="290.0" y="232" width="140" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="248.0" text-anchor="middle">17 on node 14</text>
  <text class="dg-mono dg-accent-text" x="235.0" y="278" text-anchor="middle">SHARD 17 → NODE 20</text>
  <path class="dg-arrow dg-message" d="M110 286 H352" marker-end="url(#paused-controller-head-accent)"/>
  <rect class="dg-box-accent" x="290.0" y="296" width="140" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="312.0" text-anchor="middle">17 on node 20</text>
</svg>
