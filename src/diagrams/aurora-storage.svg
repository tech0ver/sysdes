<svg class="diagram-svg" viewBox="0 0 720 290" role="img" aria-labelledby="aurora-storage-title aurora-storage-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="aurora-storage-title">Amazon Aurora storage</title>
  <desc id="aurora-storage-desc">Three availability zones. The writer runs in zone 1, and read servers in zones 2 and 3. They share one storage volume with six copies, two in each zone. A write counts as done when four of the six copies have it.</desc>
  <defs>
    <marker id="aurora-storage-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="aurora-storage-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-zone" x="16" y="16" width="220" height="236" rx="8"/>
  <text class="dg-mono dg-muted-text" x="31" y="36">ZONE 1</text>
  <rect class="dg-box-accent" x="46" y="46" width="160" height="44" rx="6"/>
  <text class="dg-name" x="126.0" y="73.0" text-anchor="middle">Writer</text>
  <line class="dg-message" x1="126" y1="90" x2="126" y2="118"/>
  <line class="dg-line" x1="76" y1="144" x2="76" y2="170"/>
  <rect class="dg-box-accent" x="36" y="170" width="80" height="40" rx="4"/>
  <text class="dg-code" x="76.0" y="194.0" text-anchor="middle">copy 1</text>
  <line class="dg-line" x1="176" y1="144" x2="176" y2="170"/>
  <rect class="dg-box-accent" x="136" y="170" width="80" height="40" rx="4"/>
  <text class="dg-code" x="176.0" y="194.0" text-anchor="middle">copy 2</text>
  <rect class="dg-zone" x="250" y="16" width="220" height="236" rx="8"/>
  <text class="dg-mono dg-muted-text" x="265" y="36">ZONE 2</text>
  <rect class="dg-box" x="280" y="46" width="160" height="44" rx="6"/>
  <text class="dg-name" x="360.0" y="73.0" text-anchor="middle">Reader</text>
  <line class="dg-line" x1="360" y1="90" x2="360" y2="118"/>
  <line class="dg-line" x1="310" y1="144" x2="310" y2="170"/>
  <rect class="dg-box-accent" x="270" y="170" width="80" height="40" rx="4"/>
  <text class="dg-code" x="310.0" y="194.0" text-anchor="middle">copy 3</text>
  <line class="dg-line" x1="410" y1="144" x2="410" y2="170"/>
  <rect class="dg-box-failed" x="370" y="170" width="80" height="40" rx="4"/>
  <text class="dg-code-muted" x="410.0" y="194.0" text-anchor="middle">copy 4</text>
  <rect class="dg-zone" x="484" y="16" width="220" height="236" rx="8"/>
  <text class="dg-mono dg-muted-text" x="499" y="36">ZONE 3</text>
  <rect class="dg-box" x="514" y="46" width="160" height="44" rx="6"/>
  <text class="dg-name" x="594.0" y="73.0" text-anchor="middle">Reader</text>
  <line class="dg-line" x1="594" y1="90" x2="594" y2="118"/>
  <line class="dg-line" x1="544" y1="144" x2="544" y2="170"/>
  <rect class="dg-box-accent" x="504" y="170" width="80" height="40" rx="4"/>
  <text class="dg-code" x="544.0" y="194.0" text-anchor="middle">copy 5</text>
  <line class="dg-line" x1="644" y1="144" x2="644" y2="170"/>
  <rect class="dg-box-failed" x="604" y="170" width="80" height="40" rx="4"/>
  <text class="dg-code-muted" x="644.0" y="194.0" text-anchor="middle">copy 6</text>
  <rect class="dg-box" x="36" y="118" width="648" height="26" rx="4"/>
  <text class="dg-mono dg-muted-text" x="360" y="135" text-anchor="middle">SHARED STORAGE VOLUME</text>
  <text class="dg-mono dg-accent-text" x="360" y="276" text-anchor="middle">WRITE DONE: 4 OF 6 COPIES</text>
</svg>
