  <circle class="dg-dot-muted" cx="557.4" cy="276.5" r="5"/>
  <text class="dg-code" x="560.5" y="299.2" text-anchor="middle">B</text>
  <circle class="dg-dot" cx="522.6" cy="276.5" r="5"/>
