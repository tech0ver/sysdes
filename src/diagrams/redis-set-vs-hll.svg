<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="redis-set-vs-hll-title redis-set-vs-hll-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-set-vs-hll-title">Distinct viewers with a set and with a HyperLogLog</title>
  <desc id="redis-set-vs-hll-desc">Left: a set stores every viewer ID, so it is exact but grows with the number of viewers. Right: a HyperLogLog stores no IDs, takes at most 12 KB, and gives an estimate with a standard error of about 0.81%. Below: the HyperLogLogs of seven days are merged with PFMERGE into a weekly estimate, in which a viewer who came every day is not counted seven times.</desc>
  <defs>
    <marker id="redis-set-vs-hll-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-set-vs-hll-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Set</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">SADD, SCARD</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">HyperLogLog</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">PFADD, PFCOUNT</text>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="188"/>
  <rect class="dg-box" x="30" y="58" width="92" height="24" rx="4"/>
  <text class="dg-code" x="76.0" y="74.0" text-anchor="middle">user:17</text>
  <rect class="dg-box" x="130" y="58" width="92" height="24" rx="4"/>
  <text class="dg-code" x="176.0" y="74.0" text-anchor="middle">user:203</text>
  <rect class="dg-box" x="230" y="58" width="92" height="24" rx="4"/>
  <text class="dg-code" x="276.0" y="74.0" text-anchor="middle">user:88</text>
  <rect class="dg-box" x="30" y="88" width="92" height="24" rx="4"/>
  <text class="dg-code" x="76.0" y="104.0" text-anchor="middle">user:51</text>
  <text class="dg-code-muted" x="170" y="105">… 1 million IDs</text>
  <text class="dg-result" x="180" y="150" text-anchor="middle">Exact, grows with every viewer</text>
  <rect class="dg-box-accent" x="450" y="58" width="180" height="54" rx="6"/>
  <text class="dg-code" x="540" y="82" text-anchor="middle">12 KB at most</text>
  <text class="dg-sub" x="540" y="100" text-anchor="middle">no IDs inside</text>
  <text class="dg-result" x="540" y="150" text-anchor="middle">≈ 1,000,000, standard error 0.81%</text>
  <line class="dg-rule" x1="8" y1="196" x2="712" y2="196"/>
  <rect class="dg-chip" x="30" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="58.0" y="236.0" text-anchor="middle">mon</text>
  <rect class="dg-chip" x="92" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="120.0" y="236.0" text-anchor="middle">tue</text>
  <rect class="dg-chip" x="154" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="182.0" y="236.0" text-anchor="middle">wed</text>
  <rect class="dg-chip" x="216" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="244.0" y="236.0" text-anchor="middle">thu</text>
  <rect class="dg-chip" x="278" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="306.0" y="236.0" text-anchor="middle">fri</text>
  <rect class="dg-chip" x="340" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="368.0" y="236.0" text-anchor="middle">sat</text>
  <rect class="dg-chip" x="402" y="220" width="56" height="24" rx="4"/>
  <text class="dg-code" x="430.0" y="236.0" text-anchor="middle">sun</text>
  <path class="dg-arrow dg-message" d="M466 232 H516" marker-end="url(#redis-set-vs-hll-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="491" y="222" text-anchor="middle">PFMERGE</text>
  <rect class="dg-box-accent" x="524" y="220" width="180" height="24" rx="4"/>
  <text class="dg-code" x="614.0" y="236.0" text-anchor="middle">week: one estimate</text>
  <text class="dg-sub" x="30" y="270">Adding seven daily counts would count a daily viewer seven times.</text>
</svg>
