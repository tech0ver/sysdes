<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="read-barrier-vs-lease-title read-barrier-vs-lease-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="read-barrier-vs-lease-title">A linearizable read with a read barrier and with a lease</title>
  <desc id="read-barrier-vs-lease-desc">Left, read barrier: the leader notes that the log is committed up to 812, confirms with a heartbeat to a majority that it still leads, waits until it has applied 812, and answers $150. Right, lease: the followers answer a heartbeat, and each will not start an election for the next 10 seconds, so the leader holds a lease for that time. A read inside the lease gets $150 at once, with no round trip. When the lease ends, the next heartbeat that a majority answers renews it; without one, the leader stops answering reads locally.</desc>
  <defs>
    <marker id="read-barrier-vs-lease-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="read-barrier-vs-lease-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="292"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">Read barrier</text>
  <text class="dg-mono dg-muted-text" x="50" y="50" text-anchor="middle">CLIENT</text>
  <line class="dg-lifeline" x1="50" y1="64" x2="50" y2="290"/>
  <text class="dg-mono dg-muted-text" x="170" y="50" text-anchor="middle">LEADER</text>
  <line class="dg-lifeline" x1="170" y1="64" x2="170" y2="290"/>
  <text class="dg-mono dg-muted-text" x="290" y="50" text-anchor="middle">FOLLOWERS</text>
  <line class="dg-lifeline" x1="290" y1="64" x2="290" y2="290"/>
  <text class="dg-mono dg-muted-text" x="110.0" y="84" text-anchor="middle">READ</text>
  <path class="dg-arrow" d="M50 92 H162" marker-end="url(#read-barrier-vs-lease-head)"/>
  <rect class="dg-box" x="95.0" y="100" width="150" height="24" rx="4"/>
  <text class="dg-code" x="170.0" y="116.0" text-anchor="middle">committed to 812</text>
  <text class="dg-mono dg-accent-text" x="230.0" y="142" text-anchor="middle">HEARTBEAT</text>
  <path class="dg-arrow dg-message" d="M170 150 H282" marker-end="url(#read-barrier-vs-lease-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="230.0" y="178" text-anchor="middle">STILL LEADER</text>
  <path class="dg-arrow dg-message" d="M290 186 H178" marker-end="url(#read-barrier-vs-lease-head-accent)"/>
  <line class="dg-arrow dg-wait" x1="170" y1="192" x2="170" y2="230"/>
  <text class="dg-mono dg-accent-text" x="160" y="216" text-anchor="end">APPLY 812</text>
  <text class="dg-mono dg-muted-text" x="110.0" y="254" text-anchor="middle">$150</text>
  <path class="dg-arrow" d="M170 262 H58" marker-end="url(#read-barrier-vs-lease-head)"/>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Lease</text>
  <text class="dg-mono dg-muted-text" x="410" y="50" text-anchor="middle">CLIENT</text>
  <line class="dg-lifeline" x1="410" y1="64" x2="410" y2="230"/>
  <text class="dg-mono dg-muted-text" x="530" y="50" text-anchor="middle">LEADER</text>
  <line class="dg-lifeline" x1="530" y1="64" x2="530" y2="230"/>
  <text class="dg-mono dg-muted-text" x="650" y="50" text-anchor="middle">FOLLOWERS</text>
  <line class="dg-lifeline" x1="650" y1="64" x2="650" y2="230"/>
  <text class="dg-mono dg-muted-text" x="590.0" y="80" text-anchor="middle">HEARTBEAT</text>
  <path class="dg-arrow" d="M530 88 H642" marker-end="url(#read-barrier-vs-lease-head)"/>
  <text class="dg-mono dg-muted-text" x="590.0" y="126" text-anchor="middle"></text>
  <path class="dg-arrow" d="M650 134 H538" marker-end="url(#read-barrier-vs-lease-head)"/>
  <text class="dg-mono dg-muted-text" x="590.0" y="112" text-anchor="middle">OK: NO ELECTION</text>
  <text class="dg-mono dg-muted-text" x="590.0" y="124" text-anchor="middle">FOR 10 S</text>
  <path class="dg-bracket-accent" d="M536 140 H542 V226 H536"/>
  <text class="dg-mono dg-accent-text" x="548" y="186" text-anchor="start">LEASE</text>
  <text class="dg-mono dg-accent-text" x="548" y="198" text-anchor="start">10 S</text>
  <text class="dg-mono dg-muted-text" x="470.0" y="152" text-anchor="middle">READ</text>
  <path class="dg-arrow" d="M410 160 H522" marker-end="url(#read-barrier-vs-lease-head)"/>
  <text class="dg-mono dg-accent-text" x="470.0" y="182" text-anchor="middle">$150, AT ONCE</text>
  <path class="dg-arrow dg-message" d="M530 190 H418" marker-end="url(#read-barrier-vs-lease-head-accent)"/>
  <line class="dg-line dg-empty" x1="380" y1="236" x2="700" y2="236"/>
  <text class="dg-mono dg-muted-text" x="540" y="252" text-anchor="middle">LEASE ENDS</text>
  <text class="dg-sub" x="540" y="270" text-anchor="middle">the next answered heartbeat renews it;</text>
  <text class="dg-sub" x="540" y="286" text-anchor="middle">without it, no more local reads</text>
</svg>
