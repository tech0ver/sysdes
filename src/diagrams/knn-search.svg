<svg class="diagram-svg" viewBox="0 0 521 290" role="img" aria-labelledby="knn-search-title knn-search-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="knn-search-title">Homes within 5 km of a point, nearest first</title>
  <desc id="knn-search-desc">A point on the map with a circle of 5 km around it. Four homes lie inside the circle and are returned nearest first: 1042, 5120, 3317, 2210. Homes outside the circle are not returned. Dashed boxes are the bounding boxes in the GiST index that the search reads first.</desc>
  <defs>
    <marker id="knn-search-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="knn-search-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-149 0)">
  <rect class="dg-box-failed" x="380" y="66" width="136" height="160" rx="4"/>
  <rect class="dg-box-failed" x="206" y="176" width="130" height="78" rx="4"/>
  <rect class="dg-box-failed" x="166" y="80" width="130" height="56" rx="4"/>
  <rect class="dg-box-failed" x="546" y="186" width="28" height="28" rx="4"/>
  <circle class="dg-open-line" cx="360" cy="150" r="110" fill="none"/>
  <line class="dg-line" x1="360" y1="150" x2="360" y2="260"/>
  <text class="dg-mono dg-muted-text" x="368" y="245">5 KM</text>
  <circle class="dg-dot" cx="360" cy="150" r="6"/>
  <circle class="dg-dot" cx="395" cy="135" r="5"/>
  <text class="dg-mono dg-accent-text" x="405" y="129" text-anchor="start">1</text>
  <circle class="dg-dot" cx="320" cy="190" r="5"/>
  <text class="dg-mono dg-accent-text" x="310" y="206" text-anchor="end">2</text>
  <circle class="dg-dot" cx="430" cy="212" r="5"/>
  <text class="dg-mono dg-accent-text" x="440" y="206" text-anchor="start">3</text>
  <circle class="dg-dot" cx="280" cy="95" r="5"/>
  <text class="dg-mono dg-accent-text" x="270" y="111" text-anchor="end">4</text>
  <circle class="dg-dot-muted" cx="500" cy="80" r="5"/>
