<svg class="diagram-svg" viewBox="0 0 706 214" role="img" aria-labelledby="shards-repeat-ids-title shards-repeat-ids-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="shards-repeat-ids-title">Four databases, four orders with ID 1043</title>
  <desc id="shards-repeat-ids-desc">Orders are split by seller across four databases, each with its own sequence, and each hands out order 1043. A payment that stores order_id 1043 cannot tell which of the four orders it means.</desc>
  <defs>
    <marker id="shards-repeat-ids-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="shards-repeat-ids-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-7 0)">
  <rect class="dg-box" x="24" y="20" width="156" height="48" rx="6"/>
  <text class="dg-name" x="102.0" y="42.0" text-anchor="middle">Database 1</text>
  <text class="dg-sub" x="102.0" y="58.0" text-anchor="middle">own sequence</text>
  <rect class="dg-box-accent" x="52" y="80" width="100" height="26" rx="4"/>
  <text class="dg-code" x="102.0" y="97.0" text-anchor="middle">order 1043</text>
  <path class="dg-arrow dg-empty" d="M360 160 V136 H102 V114" marker-end="url(#shards-repeat-ids-head)"/>
  <rect class="dg-box" x="196" y="20" width="156" height="48" rx="6"/>
  <text class="dg-name" x="274.0" y="42.0" text-anchor="middle">Database 2</text>
  <text class="dg-sub" x="274.0" y="58.0" text-anchor="middle">own sequence</text>
  <rect class="dg-box-accent" x="224" y="80" width="100" height="26" rx="4"/>
  <text class="dg-code" x="274.0" y="97.0" text-anchor="middle">order 1043</text>
  <path class="dg-arrow dg-empty" d="M360 160 V136 H274 V114" marker-end="url(#shards-repeat-ids-head)"/>
  <rect class="dg-box" x="368" y="20" width="156" height="48" rx="6"/>
  <text class="dg-name" x="446.0" y="42.0" text-anchor="middle">Database 3</text>
  <text class="dg-sub" x="446.0" y="58.0" text-anchor="middle">own sequence</text>
  <rect class="dg-box-accent" x="396" y="80" width="100" height="26" rx="4"/>
  <text class="dg-code" x="446.0" y="97.0" text-anchor="middle">order 1043</text>
  <path class="dg-arrow dg-empty" d="M360 160 V136 H446 V114" marker-end="url(#shards-repeat-ids-head)"/>
  <rect class="dg-box" x="540" y="20" width="156" height="48" rx="6"/>
  <text class="dg-name" x="618.0" y="42.0" text-anchor="middle">Database 4</text>
  <text class="dg-sub" x="618.0" y="58.0" text-anchor="middle">own sequence</text>
  <rect class="dg-box-accent" x="568" y="80" width="100" height="26" rx="4"/>
  <text class="dg-code" x="618.0" y="97.0" text-anchor="middle">order 1043</text>
  <path class="dg-arrow dg-empty" d="M360 160 V136 H618 V114" marker-end="url(#shards-repeat-ids-head)"/>
  <rect class="dg-box" x="260" y="160" width="200" height="40" rx="6"/>
  <text class="dg-name" x="360.0" y="185.0" text-anchor="middle">payment: order_id 1043</text>
  <text class="dg-mono dg-accent-text" x="476" y="150">WHICH ONE?</text>
  </g>
</svg>
