  <text class="dg-mono dg-muted-text" x="398" y="146.0" text-anchor="end">50%</text>
  <line class="dg-rule" x1="404" y1="64.0" x2="690" y2="64.0"/>
  <text class="dg-mono dg-muted-text" x="398" y="68.0" text-anchor="end">100%</text>
