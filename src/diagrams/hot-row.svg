<svg class="diagram-svg" viewBox="0 0 720 268" role="img" aria-labelledby="hot-row-title hot-row-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hot-row-title">One counter row queues every purchase; one row per place lets them run side by side</title>
  <desc id="hot-row-desc">The same eight places and three purchases of two places each. One counter row: purchase 1 holds the lock on the row, and purchases 2 and 3 wait in line. One row per place: purchase 1 has locked places 1 and 2, so purchase 2 skips them with SKIP LOCKED and takes places 3 and 4; purchase 3 takes 5 and 6; nobody waits.</desc>
  <defs>
    <marker id="hot-row-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="hot-row-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="260"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">One counter row</text>
  <rect class="dg-box-accent" x="16" y="72" width="180" height="30" rx="4"/>
  <text class="dg-code" x="106.0" y="91.0" text-anchor="middle">standing_left: 8</text>
  <text class="dg-mono dg-muted-text" x="212" y="92">PURCHASE 1 HOLDS IT</text>
  <rect class="dg-box-failed" x="56" y="124" width="140" height="26" rx="4"/>
  <text class="dg-code-muted" x="126.0" y="141.0" text-anchor="middle">purchase 2: waits</text>
  <rect class="dg-box-failed" x="56" y="160" width="140" height="26" rx="4"/>
  <text class="dg-code-muted" x="126.0" y="177.0" text-anchor="middle">purchase 3: waits</text>
  <path class="dg-arrow" d="M36 186 V108" marker-end="url(#hot-row-head)"/>
  <text class="dg-result" x="180" y="252" text-anchor="middle">2 of 3 purchases wait</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">One row per place</text>
  <rect class="dg-box" x="376" y="72" width="160" height="28" rx="4"/>
  <text class="dg-code" x="456.0" y="90.0" text-anchor="middle">place 1: purchase 1</text>
  <rect class="dg-box" x="544" y="72" width="160" height="28" rx="4"/>
  <text class="dg-code" x="624.0" y="90.0" text-anchor="middle">place 2: purchase 1</text>
  <rect class="dg-box-accent" x="376" y="112" width="160" height="28" rx="4"/>
  <text class="dg-code" x="456.0" y="130.0" text-anchor="middle">place 3: purchase 2</text>
  <rect class="dg-box-accent" x="544" y="112" width="160" height="28" rx="4"/>
  <text class="dg-code" x="624.0" y="130.0" text-anchor="middle">place 4: purchase 2</text>
  <rect class="dg-box" x="376" y="152" width="160" height="28" rx="4"/>
  <text class="dg-code" x="456.0" y="170.0" text-anchor="middle">place 5: purchase 3</text>
  <rect class="dg-box" x="544" y="152" width="160" height="28" rx="4"/>
  <text class="dg-code" x="624.0" y="170.0" text-anchor="middle">place 6: purchase 3</text>
  <rect class="dg-box" x="376" y="192" width="160" height="28" rx="4"/>
  <text class="dg-code" x="456.0" y="210.0" text-anchor="middle">place 7: free</text>
  <rect class="dg-box" x="544" y="192" width="160" height="28" rx="4"/>
  <text class="dg-code" x="624.0" y="210.0" text-anchor="middle">place 8: free</text>
  <text class="dg-result" x="540" y="252" text-anchor="middle">No purchase waits</text>
</svg>
