  <text class="dg-mono dg-muted-text" x="203.41463414634146" y="204" text-anchor="middle">2024</text>
  <line class="dg-line" x1="370.2439024390244" y1="186" x2="370.2439024390244" y2="192"/>
  <text class="dg-mono dg-muted-text" x="370.2439024390244" y="204" text-anchor="middle">2025</text>
  <line class="dg-line" x1="537.0731707317073" y1="186" x2="537.0731707317073" y2="192"/>
