  <text class="dg-name" x="560" y="22" text-anchor="middle">After</text>
  <text class="dg-mono dg-muted-text" x="460" y="50">CHANNEL</text>
  <text class="dg-mono dg-muted-text" x="560" y="50">SCORE</text>
