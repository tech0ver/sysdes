<svg class="diagram-svg" viewBox="0 0 720 284" role="img" aria-labelledby="service-beside-store-title service-beside-store-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="service-beside-store-title">A coordination service next to the key-value store</title>
  <desc id="service-beside-store-desc">Requests go from a client through one of 300 routers to one of 24 storage nodes, without passing the coordination service. The service is three nodes, a leader and two followers, and each keeps a full copy of the shard map, the node records, and the controller key. A write goes through the leader and is synced to disk on a majority. The controller writes the map, routers read it and get its changes, and storage nodes keep their keys alive.</desc>
  <defs>
    <marker id="service-beside-store-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="service-beside-store-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-box" x="16" y="20" width="120" height="44" rx="6"/>
  <text class="dg-name" x="76.0" y="47.0" text-anchor="middle">Client</text>
  <rect class="dg-box" x="232" y="20" width="140" height="44" rx="6"/>
  <text class="dg-name" x="302.0" y="40.0" text-anchor="middle">Routers</text>
  <text class="dg-sub" x="302.0" y="56.0" text-anchor="middle">300</text>
  <rect class="dg-box" x="468" y="20" width="140" height="44" rx="6"/>
  <text class="dg-name" x="538.0" y="40.0" text-anchor="middle">Storage nodes</text>
  <text class="dg-sub" x="538.0" y="56.0" text-anchor="middle">24</text>
  <path class="dg-arrow dg-message" d="M136 42 H224" marker-end="url(#service-beside-store-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="180" y="34" text-anchor="middle">REQUEST</text>
  <path class="dg-arrow dg-message" d="M372 42 H460" marker-end="url(#service-beside-store-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="416" y="34" text-anchor="middle">REQUEST</text>
  <rect class="dg-zone" x="216" y="112" width="488" height="156" rx="8"/>
  <text class="dg-mono dg-muted-text" x="231" y="132">COORDINATION SERVICE</text>
  <rect class="dg-box" x="232" y="144" width="140" height="100" rx="6"/>
  <text class="dg-name" x="302" y="166" text-anchor="middle">Leader</text>
  <text class="dg-code-muted" x="302" y="190" text-anchor="middle">shard map</text>
  <text class="dg-code-muted" x="302" y="208" text-anchor="middle">node records</text>
  <text class="dg-code-muted" x="302" y="226" text-anchor="middle">controller</text>
  <rect class="dg-box" x="390" y="144" width="140" height="100" rx="6"/>
  <text class="dg-name" x="460" y="166" text-anchor="middle">Follower</text>
  <text class="dg-code-muted" x="460" y="190" text-anchor="middle">shard map</text>
  <text class="dg-code-muted" x="460" y="208" text-anchor="middle">node records</text>
  <text class="dg-code-muted" x="460" y="226" text-anchor="middle">controller</text>
  <rect class="dg-box" x="548" y="144" width="140" height="100" rx="6"/>
  <text class="dg-name" x="618" y="166" text-anchor="middle">Follower</text>
  <text class="dg-code-muted" x="618" y="190" text-anchor="middle">shard map</text>
  <text class="dg-code-muted" x="618" y="208" text-anchor="middle">node records</text>
  <text class="dg-code-muted" x="618" y="226" text-anchor="middle">controller</text>
  <path class="dg-arrow" d="M302 64 V104" marker-end="url(#service-beside-store-head)"/>
  <text class="dg-mono dg-muted-text" x="310" y="90" text-anchor="start">READ MAP, GET CHANGES</text>
  <path class="dg-arrow" d="M538 64 V104" marker-end="url(#service-beside-store-head)"/>
  <text class="dg-mono dg-muted-text" x="546" y="90" text-anchor="start">KEEP KEYS ALIVE</text>
  <rect class="dg-box" x="16" y="172" width="120" height="44" rx="6"/>
  <text class="dg-name" x="76.0" y="199.0" text-anchor="middle">Controller</text>
  <path class="dg-arrow" d="M136 194 H208" marker-end="url(#service-beside-store-head)"/>
  <text class="dg-mono dg-muted-text" x="172" y="186" text-anchor="middle">WRITE MAP</text>
</svg>
