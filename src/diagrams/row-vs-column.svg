  <text class="dg-code" x="504.0" y="164" text-anchor="middle">tue</text>
  <text class="dg-code" x="576.0" y="164" text-anchor="middle">US</text>
  <text class="dg-code-muted" x="648.0" y="164" text-anchor="middle">ios</text>
  <text class="dg-code-muted" x="432.0" y="196" text-anchor="middle">zzz</text>
  <text class="dg-code" x="504.0" y="196" text-anchor="middle">tue</text>
  <text class="dg-code" x="576.0" y="196" text-anchor="middle">DE</text>
  <text class="dg-code-muted" x="648.0" y="196" text-anchor="middle">web</text>
  <text class="dg-code-muted" x="432.0" y="228" text-anchor="middle">abc</text>
  <text class="dg-code" x="504.0" y="228" text-anchor="middle">wed</text>
  <text class="dg-code" x="576.0" y="228" text-anchor="middle">DE</text>
  <text class="dg-code-muted" x="648.0" y="228" text-anchor="middle">ios</text>
  <text class="dg-mono dg-muted-text" x="164" y="266" text-anchor="middle">READS ALL 20 VALUES</text>
  <text class="dg-sub" x="164" y="286" text-anchor="middle">code and device are read, then dropped</text>
  <text class="dg-mono dg-muted-text" x="540" y="266" text-anchor="middle">READS 10 VALUES</text>
  <text class="dg-sub" x="540" y="286" text-anchor="middle">one type per column: compresses well</text>
</svg>
