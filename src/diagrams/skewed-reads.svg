  <rect class="dg-bar" x="313.2" y="214.6" width="8" height="5.4" rx="1"/>
  <rect class="dg-bar" x="323.6" y="214.8" width="8" height="5.2" rx="1"/>
  <line class="dg-line" x1="18" y1="220" x2="334.0" y2="220"/>
  <path class="dg-bracket-accent" d="M22 228 V234 H82.0 V228"/>
  <text class="dg-mono dg-accent-text" x="22" y="250" text-anchor="start">TOP 6 OF 30: 61% OF READS</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Hit ratio by cache size</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">the cache holds the most read articles</text>
  <line class="dg-rule" x1="404" y1="220.0" x2="690" y2="220.0"/>
  <text class="dg-mono dg-muted-text" x="398" y="224.0" text-anchor="end">0%</text>
