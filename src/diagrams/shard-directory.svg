  <text class="dg-sub" x="180" y="242" text-anchor="middle">shard 2</text>
  <rect class="dg-chip" x="142" y="252" width="76" height="50" rx="4"/>
  <text class="dg-code" x="180.0" y="281.0" text-anchor="middle">ws 42</text>
