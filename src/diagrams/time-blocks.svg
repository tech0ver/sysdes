<svg class="diagram-svg" viewBox="0 0 720 228" role="img" aria-labelledby="time-blocks-title time-blocks-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="time-blocks-title">Time blocks: full detail for recent data, rollups for older data, expired blocks dropped</title>
  <desc id="time-blocks-desc">Time runs left to right. The three newest blocks keep a point every 10 seconds, and new points are appended to the last one. Two older blocks keep rollups, one point per hour. The oldest block is past retention, and the store drops it as one block instead of deleting points one by one.</desc>
  <defs>
    <marker id="time-blocks-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="time-blocks-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-sub" x="68" y="40" text-anchor="middle">past retention</text>
  <text class="dg-sub" x="242" y="40" text-anchor="middle">rollups: 1 point per hour</text>
  <text class="dg-sub" x="532" y="40" text-anchor="middle">full detail: a point every 10 s</text>
