<svg class="diagram-svg" viewBox="0 0 640 236" role="img" aria-labelledby="redis-fork-cow-title redis-fork-cow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-fork-cow-title">Copy-on-write after a fork</title>
  <desc id="redis-fork-cow-desc">After a fork, the parent process and the child that writes the snapshot share the same memory pages. The child only reads them. When the parent changes a key on page 3, the kernel copies page 3 for the parent, so each changed page takes memory twice until the save ends.</desc>
  <defs>
    <marker id="redis-fork-cow-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-fork-cow-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-43 0)">
  <rect class="dg-box" x="60" y="16" width="200" height="48" rx="6"/>
  <text class="dg-name" x="160.0" y="38.0" text-anchor="middle">Parent</text>
  <text class="dg-sub" x="160.0" y="54.0" text-anchor="middle">serves clients</text>
  <rect class="dg-box" x="460" y="16" width="200" height="48" rx="6"/>
  <text class="dg-name" x="560.0" y="38.0" text-anchor="middle">Child</text>
  <text class="dg-sub" x="560.0" y="54.0" text-anchor="middle">writes the snapshot</text>
  <text class="dg-mono dg-muted-text" x="360" y="106" text-anchor="middle">SHARED PAGES</text>
  <rect class="dg-box" x="60" y="116" width="96" height="24" rx="4"/>
  <text class="dg-code" x="108.0" y="132.0" text-anchor="middle">page 1</text>
  <rect class="dg-box" x="162" y="116" width="96" height="24" rx="4"/>
  <text class="dg-code" x="210.0" y="132.0" text-anchor="middle">page 2</text>
  <rect class="dg-box-accent" x="264" y="116" width="96" height="24" rx="4"/>
  <text class="dg-code" x="312.0" y="132.0" text-anchor="middle">page 3</text>
  <rect class="dg-box" x="366" y="116" width="96" height="24" rx="4"/>
  <text class="dg-code" x="414.0" y="132.0" text-anchor="middle">page 4</text>
  <rect class="dg-box" x="468" y="116" width="96" height="24" rx="4"/>
  <text class="dg-code" x="516.0" y="132.0" text-anchor="middle">page 5</text>
  <rect class="dg-box" x="570" y="116" width="96" height="24" rx="4"/>
  <text class="dg-code" x="618.0" y="132.0" text-anchor="middle">page 6</text>
  <path class="dg-arrow" d="M160 64 V108"/>
  <path class="dg-arrow" d="M560 64 V108"/>
  <path class="dg-arrow dg-message" d="M312 140 V182" marker-end="url(#redis-fork-cow-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="320" y="166">PARENT WRITES</text>
  <rect class="dg-box-accent" x="264" y="190" width="96" height="24" rx="4"/>
  <text class="dg-code" x="312.0" y="206.0" text-anchor="middle">page 3'</text>
  <text class="dg-sub" x="374" y="207">a copy for the parent: memory used twice</text>
  </g>
</svg>
