  <text class="dg-code" x="504.0" y="132" text-anchor="middle">mon</text>
  <text class="dg-code" x="576.0" y="132" text-anchor="middle">US</text>
  <text class="dg-code-muted" x="648.0" y="132" text-anchor="middle">web</text>
