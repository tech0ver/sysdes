  <title id="mod-n-vs-logical-title">Adding a fifth node with hash mod N and with logical shards</title>
  <desc id="mod-n-vs-logical-desc">Left: each box is one key, shown by its hash value from 1 to 20. Keys are placed by hash mod 4 on four nodes, then by hash mod 5 on five nodes; only keys 1, 2, 3, and 20 stay where they were, and 16 of 20 keys move. Right: each box is a logical shard that holds all keys with the same hash mod 20, s0 to s19. 20 shards sit five per node on four nodes; the fifth node takes shards s4, s9, s14, and s19, one from each old node, and 4 of 20 shards move.</desc>
