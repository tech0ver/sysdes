<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="split-brain-fencing-title split-brain-fencing-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="split-brain-fencing-title">An old leader that wakes up, without and with fencing</title>
  <desc id="split-brain-fencing-desc">Two panels with the same events. The old leader pauses; meanwhile a new leader is elected and writes to the storage. Then the old leader wakes up and writes too. Without fencing, the storage accepts both writes, so two leaders write at once. With fencing, each leader has a number, 1 for the old one and 2 for the new one; the storage accepts the write with 2, then rejects the write with 1 because 1 is lower than 2.</desc>
  <defs>
    <marker id="split-brain-fencing-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="split-brain-fencing-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="292"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">Without fencing</text>
  <text class="dg-mono dg-muted-text" x="55" y="50" text-anchor="middle">OLD LEADER</text>
  <line class="dg-lifeline" x1="55" y1="76" x2="55" y2="252"/>
  <text class="dg-mono dg-muted-text" x="180" y="50" text-anchor="middle">STORAGE</text>
  <line class="dg-lifeline" x1="180" y1="76" x2="180" y2="252"/>
  <text class="dg-mono dg-muted-text" x="305" y="50" text-anchor="middle">NEW LEADER</text>
  <line class="dg-lifeline" x1="305" y1="76" x2="305" y2="252"/>
  <rect class="dg-box-failed" x="23" y="86" width="64" height="80" rx="4"/>
  <text class="dg-code-muted" x="55.0" y="130.0" text-anchor="middle">paused</text>
  <rect class="dg-box" x="260" y="86" width="90" height="24" rx="4"/>
  <text class="dg-code" x="305.0" y="102.0" text-anchor="middle">elected</text>
  <text class="dg-mono dg-muted-text" x="242.5" y="128" text-anchor="middle">WRITE</text>
  <path class="dg-arrow" d="M305 136 H188" marker-end="url(#split-brain-fencing-head)"/>
  <rect class="dg-box" x="120" y="148" width="120" height="24" rx="4"/>
  <text class="dg-code" x="180.0" y="164.0" text-anchor="middle">accepted</text>
  <text class="dg-mono dg-muted-text" x="55" y="184" text-anchor="middle">WAKES UP</text>
  <text class="dg-mono dg-accent-text" x="125.5" y="196" text-anchor="middle">WRITE</text>
  <path class="dg-arrow dg-message" d="M55 204 H172" marker-end="url(#split-brain-fencing-head-accent)"/>
  <rect class="dg-box-accent" x="120" y="216" width="120" height="24" rx="4"/>
  <text class="dg-code" x="180.0" y="232.0" text-anchor="middle">accepted too</text>
  <text class="dg-result" x="180" y="284" text-anchor="middle">Two leaders write at once</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">With fencing</text>
  <text class="dg-mono dg-muted-text" x="415" y="50" text-anchor="middle">OLD LEADER</text>
  <line class="dg-lifeline" x1="415" y1="76" x2="415" y2="252"/>
  <text class="dg-mono dg-muted-text" x="540" y="50" text-anchor="middle">STORAGE</text>
  <line class="dg-lifeline" x1="540" y1="76" x2="540" y2="252"/>
  <text class="dg-mono dg-muted-text" x="665" y="50" text-anchor="middle">NEW LEADER</text>
  <line class="dg-lifeline" x1="665" y1="76" x2="665" y2="252"/>
  <text class="dg-sub" x="415" y="66" text-anchor="middle">number 1</text>
  <text class="dg-sub" x="665" y="66" text-anchor="middle">number 2</text>
  <rect class="dg-box-failed" x="383" y="86" width="64" height="80" rx="4"/>
  <text class="dg-code-muted" x="415.0" y="130.0" text-anchor="middle">paused</text>
  <rect class="dg-box" x="620" y="86" width="90" height="24" rx="4"/>
  <text class="dg-code" x="665.0" y="102.0" text-anchor="middle">elected</text>
  <text class="dg-mono dg-muted-text" x="602.5" y="128" text-anchor="middle">WRITE, 2</text>
  <path class="dg-arrow" d="M665 136 H548" marker-end="url(#split-brain-fencing-head)"/>
  <rect class="dg-box" x="480" y="148" width="120" height="24" rx="4"/>
  <text class="dg-code" x="540.0" y="164.0" text-anchor="middle">accepted, now 2</text>
  <text class="dg-mono dg-muted-text" x="415" y="184" text-anchor="middle">WAKES UP</text>
  <text class="dg-mono dg-accent-text" x="485.5" y="196" text-anchor="middle">WRITE, 1</text>
  <path class="dg-arrow dg-message" d="M415 204 H532" marker-end="url(#split-brain-fencing-head-accent)"/>
  <rect class="dg-box-accent" x="480" y="216" width="120" height="24" rx="4"/>
  <text class="dg-code" x="540.0" y="232.0" text-anchor="middle">rejected: 1 &lt; 2</text>
  <text class="dg-result" x="540" y="284" text-anchor="middle">The old leader is fenced off</text>
</svg>
