<svg class="diagram-svg" viewBox="0 0 720 268" role="img" aria-labelledby="compaction-title compaction-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="compaction-title">Compaction merges closed segments</title>
  <desc id="compaction-desc">Segment 1 holds abc with URL 1 and xyz. Segment 2 holds abc with URL 2 and a tombstone for xyz. The active segment takes new writes. Compaction merges segments 1 and 2 into a new segment that keeps only abc with URL 2: the latest record for each key. The deleted key xyz is gone, together with its tombstone.</desc>
  <defs>
    <marker id="compaction-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="compaction-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-zone" x="1" y="8" width="718" height="252" rx="8"/>
  <text class="dg-mono dg-muted-text" x="16" y="28">DISK</text>
  <text class="dg-name" x="20" y="52" text-anchor="start">Segment 1</text>
  <text class="dg-sub" x="216" y="52" text-anchor="end">closed</text>
  <rect class="dg-box" x="16" y="60" width="200" height="64" rx="6"/>
  <text class="dg-code" x="28" y="84">abc,https://a.example/1</text>
  <text class="dg-code" x="28" y="108">xyz,https://b.example</text>
  <text class="dg-name" x="264" y="52" text-anchor="start">Segment 2</text>
  <text class="dg-sub" x="460" y="52" text-anchor="end">closed</text>
  <rect class="dg-box" x="260" y="60" width="200" height="64" rx="6"/>
  <text class="dg-code" x="272" y="84">abc,https://a.example/2</text>
  <text class="dg-code" x="272" y="108">xyz,tombstone</text>
  <text class="dg-name" x="508" y="52" text-anchor="start">Active segment</text>
  <text class="dg-sub" x="704" y="52" text-anchor="end">new writes</text>
  <rect class="dg-box" x="504" y="60" width="200" height="64" rx="6"/>
  <text class="dg-code" x="516" y="84">qrs,https://c.example</text>
  <path class="dg-arrow" d="M116 124 V148 Q116 156 124 156 H230 Q238 156 238 164 V184" marker-end="url(#compaction-head)"/>
  <path class="dg-arrow" d="M360 124 V148 Q360 156 352 156 H246 Q238 156 238 164"/>
  <text class="dg-mono dg-muted-text" x="250" y="176">COMPACT</text>
  <rect class="dg-box-accent" x="138" y="192" width="200" height="40" rx="6"/>
  <text class="dg-code" x="150" y="216">abc,https://a.example/2</text>
  <text class="dg-name" x="128" y="217" text-anchor="end">New segment</text>
  <text class="dg-sub" x="352" y="208">the latest record for each key;</text>
  <text class="dg-sub" x="352" y="226">xyz is gone with its tombstone</text>
  <text class="dg-sub" x="604" y="144" text-anchor="middle">compaction leaves it alone</text>
</svg>
