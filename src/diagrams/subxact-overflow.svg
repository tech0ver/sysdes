  <title id="subxact-overflow-title">More than 64 subtransactions</title>
  <desc id="subxact-overflow-desc">A backend's cache holds the IDs of up to 64 subtransactions that wrote something. The 65th does not fit. Other sessions that check rows written by this transaction can no longer trust the cache and look the IDs up on pg_subtrans pages instead.</desc>
