  <text class="dg-code" x="484" y="151.4" text-anchor="middle">38%</text>
  <text class="dg-mono dg-muted-text" x="484" y="238" text-anchor="middle">2</text>
  <text class="dg-code" x="548" y="128.6" text-anchor="middle">52%</text>
  <text class="dg-mono dg-muted-text" x="548" y="238" text-anchor="middle">4</text>
  <text class="dg-code" x="612" y="103.9" text-anchor="middle">68%</text>
  <text class="dg-mono dg-muted-text" x="612" y="238" text-anchor="middle">8</text>
  <text class="dg-code" x="676" y="78.0" text-anchor="middle">85%</text>
  <text class="dg-mono dg-muted-text" x="676" y="238" text-anchor="middle">16</text>
  <path class="dg-arrow dg-message" d="M420 181.0 L484 161.4 L548 138.6 L612 113.9 L676 88.0"/>
  <circle class="dg-dot" cx="420" cy="181.0" r="4"/>
  <circle class="dg-dot" cx="484" cy="161.4" r="4"/>
  <circle class="dg-dot" cx="548" cy="138.6" r="4"/>
  <circle class="dg-dot" cx="612" cy="113.9" r="4"/>
  <circle class="dg-dot" cx="676" cy="88.0" r="4"/>
  <text class="dg-mono dg-muted-text" x="548" y="256" text-anchor="middle">ARTICLES IN THE CACHE (EACH STEP DOUBLES)</text>
