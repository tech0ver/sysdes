  <rect class="dg-chip" x="250" y="280" width="76" height="24" rx="4"/>
  <text class="dg-code" x="288.0" y="296.0" text-anchor="middle">ws 71</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Shard directory</text>
  <text class="dg-mono dg-muted-text" x="384" y="48">WORKSPACE → SHARD</text>
  <rect class="dg-chip" x="384" y="58" width="66" height="24" rx="4"/>
  <text class="dg-code" x="417.0" y="74.0" text-anchor="middle">ws 17</text>
  <path class="dg-arrow" d="M456 70 H486" marker-end="url(#shard-directory-head)"/>
