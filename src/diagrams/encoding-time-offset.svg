<svg class="diagram-svg" viewBox="0 0 720 330" role="img" aria-labelledby="encoding-time-offset-title encoding-time-offset-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="encoding-time-offset-title">Time strings and instants</title>
  <desc id="encoding-time-offset-desc">12:30 UTC and 15:30 with offset plus 03:00 on 29 October 2026 identify the same instant. Without offsets, the local clock strings do not identify a unique instant.</desc>
  <defs>
    <marker id="encoding-time-offset-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="encoding-time-offset-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="314"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Explicit offsets</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">two representations, one instant</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">No offsets</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">local clock values only</text>
  <rect class="dg-box" x="24" y="72" width="312" height="76" rx="6"/>
  <text class="dg-code" x="38" y="100">2026-10-29T12:30:00Z</text>
  <text class="dg-code" x="38" y="126">2026-10-29T15:30:00+03:00</text>
  <path class="dg-arrow" d="M180 148 V216" marker-end="url(#encoding-time-offset-head)"/>
  <text class="dg-mono dg-muted-text" x="194" y="186.0">INTERPRET</text>
  <rect class="dg-box-accent" x="24" y="216" width="312" height="68" rx="6"/>
  <text class="dg-name" x="180.0" y="248.0" text-anchor="middle">2026-10-29T12:30:00Z</text>
  <text class="dg-sub" x="180.0" y="264.0" text-anchor="middle">same instant</text>
  <rect class="dg-box" x="384" y="72" width="312" height="76" rx="6"/>
  <text class="dg-code" x="398" y="100">2026-10-29T12:30:00</text>
  <text class="dg-code" x="398" y="126">2026-10-29T15:30:00</text>
  <path class="dg-arrow" d="M540 148 V216" marker-end="url(#encoding-time-offset-head)"/>
  <text class="dg-mono dg-muted-text" x="554" y="186.0">INTERPRET</text>
  <rect class="dg-box-failed" x="384" y="216" width="312" height="68" rx="6"/>
  <text class="dg-name" x="540.0" y="248.0" text-anchor="middle">Which instant?</text>
  <text class="dg-sub" x="540.0" y="264.0" text-anchor="middle">an offset is needed</text>
</svg>
