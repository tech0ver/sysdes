  <rect class="dg-chip" x="456" y="140" width="48" height="28" rx="4"/>
  <text class="dg-code" x="480.0" y="158.0" text-anchor="middle">9</text>
  <rect class="dg-chip" x="508" y="140" width="48" height="28" rx="4"/>
  <text class="dg-code" x="532.0" y="158.0" text-anchor="middle">10</text>
  <rect class="dg-chip" x="560" y="140" width="48" height="28" rx="4"/>
  <text class="dg-code" x="584.0" y="158.0" text-anchor="middle">11</text>
  <rect class="dg-chip" x="612" y="140" width="48" height="28" rx="4"/>
  <text class="dg-code" x="636.0" y="158.0" text-anchor="middle">12</text>
  <path class="dg-bracket-accent" d="M144 74 V80 H660 V74" fill="none"/>
  <text class="dg-mono dg-accent-text" x="402.0" y="96" text-anchor="middle">KEPT FOR SLOT S2</text>
  <path class="dg-line" d="M352 174 V180 H660 V174" fill="none"/>
  <text class="dg-code" x="506.0" y="196" text-anchor="middle">max_slot_wal_keep_size</text>
  <line class="dg-cross" x1="162.0" y1="180" x2="174.0" y2="192"/>
  <line class="dg-cross" x1="162.0" y1="192" x2="174.0" y2="180"/>
  <text class="dg-mono dg-accent-text" x="180.0" y="190">S2 INVALIDATED</text>
  </g>
</svg>
