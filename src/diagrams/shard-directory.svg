  <rect class="dg-box" x="24" y="222" width="96" height="122" rx="6"/>
  <text class="dg-sub" x="72" y="242" text-anchor="middle">shard 1</text>
  <rect class="dg-chip" x="34" y="252" width="76" height="24" rx="4"/>
