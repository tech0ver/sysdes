<svg class="diagram-svg" viewBox="0 0 600 232" role="img" aria-labelledby="history-compaction-title history-compaction-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="history-compaction-title">A history compaction removes old versions of a key</title>
  <desc id="history-compaction-desc">The key /kv/nodes/node-09 has versions written at revisions 1100, 1300, 1500, and 1700. Before compaction, all four can be read. After a compaction at revision 1500, the versions from 1100 and 1300 are removed: a read at revision 1300 or a watch from revision 1200 fails, while a watch from 1600 still works.</desc>
  <defs>
    <marker id="history-compaction-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="history-compaction-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-code" x="30" y="28" text-anchor="start">/kv/nodes/node-09</text>
  <text class="dg-mono dg-muted-text" x="90" y="56" text-anchor="middle">REVISION 1100</text>
  <text class="dg-mono dg-muted-text" x="230" y="56" text-anchor="middle">REVISION 1300</text>
  <text class="dg-mono dg-muted-text" x="370" y="56" text-anchor="middle">REVISION 1500</text>
  <text class="dg-mono dg-muted-text" x="510" y="56" text-anchor="middle">REVISION 1700</text>
  <text class="dg-mono dg-muted-text" x="30" y="78" text-anchor="start">BEFORE</text>
  <rect class="dg-box" x="30" y="86" width="120" height="30" rx="4"/>
  <text class="dg-code" x="90.0" y="105.0" text-anchor="middle">version 1</text>
  <rect class="dg-box" x="170" y="86" width="120" height="30" rx="4"/>
  <text class="dg-code" x="230.0" y="105.0" text-anchor="middle">version 2</text>
  <rect class="dg-box" x="310" y="86" width="120" height="30" rx="4"/>
  <text class="dg-code" x="370.0" y="105.0" text-anchor="middle">version 3</text>
  <rect class="dg-box" x="450" y="86" width="120" height="30" rx="4"/>
  <text class="dg-code" x="510.0" y="105.0" text-anchor="middle">version 4</text>
  <text class="dg-mono dg-muted-text" x="30" y="144" text-anchor="start">AFTER COMPACTING AT 1500</text>
  <rect class="dg-box-failed" x="30" y="152" width="120" height="30" rx="4"/>
  <text class="dg-code-muted" x="90.0" y="171.0" text-anchor="middle">removed</text>
  <rect class="dg-box-failed" x="170" y="152" width="120" height="30" rx="4"/>
  <text class="dg-code-muted" x="230.0" y="171.0" text-anchor="middle">removed</text>
  <rect class="dg-box" x="310" y="152" width="120" height="30" rx="4"/>
  <text class="dg-code" x="370.0" y="171.0" text-anchor="middle">version 3</text>
  <rect class="dg-box" x="450" y="152" width="120" height="30" rx="4"/>
  <text class="dg-code" x="510.0" y="171.0" text-anchor="middle">version 4</text>
  <text class="dg-mono dg-accent-text" x="30" y="214" text-anchor="start">READ AT 1300: FAILS</text>
  <text class="dg-mono dg-accent-text" x="200" y="214" text-anchor="start">WATCH FROM 1200: FAILS</text>
  <text class="dg-mono dg-muted-text" x="400" y="214" text-anchor="start">WATCH FROM 1600: WORKS</text>
</svg>
