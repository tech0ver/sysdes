<svg class="diagram-svg" viewBox="0 0 708 300" role="img" aria-labelledby="update-recheck-title update-recheck-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="update-recheck-title">Two updates of one counter under read committed and repeatable read</title>
  <desc id="update-recheck-desc">Both panels: T1 and T2 run UPDATE homes SET views = views + 1 on a row with views = 10. T1 updates first, T2 waits for its row lock, and T1 commits. Left, read committed: T2 reads the committed row again and writes 12. Right, repeatable read: T2 fails with a serialization error and the app retries the whole transaction.</desc>
  <defs>
    <marker id="update-recheck-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="update-recheck-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-6 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="292"/>
  <text class="dg-name" x="180" y="22" text-anchor="middle">Read committed</text>
  <text class="dg-mono dg-muted-text" x="98.0" y="58" text-anchor="middle">T1</text>
  <text class="dg-mono dg-muted-text" x="262.0" y="58" text-anchor="middle">T2</text>
  <line class="dg-lifeline" x1="98.0" y1="66" x2="98.0" y2="262"/>
  <line class="dg-lifeline" x1="262.0" y1="66" x2="262.0" y2="262"/>
  <rect class="dg-box" x="23.0" y="76" width="150" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="93" text-anchor="middle">UPDATE: 10 → 11</text>
  <rect class="dg-box-accent dg-empty" x="187.0" y="112" width="150" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="129" text-anchor="middle">UPDATE: waits</text>
  <rect class="dg-box" x="23.0" y="148" width="150" height="26" rx="4"/>
  <text class="dg-code" x="98.0" y="165" text-anchor="middle">COMMIT</text>
  <rect class="dg-box-accent" x="187.0" y="184" width="150" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="201" text-anchor="middle">reread 11, write 12</text>
  <rect class="dg-box" x="187.0" y="220" width="150" height="26" rx="4"/>
  <text class="dg-code" x="262.0" y="237" text-anchor="middle">COMMIT</text>
  <text class="dg-result" x="180.0" y="288" text-anchor="middle">views = 12</text>
  <text class="dg-name" x="540" y="22" text-anchor="middle">Repeatable read</text>
  <text class="dg-mono dg-muted-text" x="458.0" y="58" text-anchor="middle">T1</text>
  <text class="dg-mono dg-muted-text" x="622.0" y="58" text-anchor="middle">T2</text>
  <line class="dg-lifeline" x1="458.0" y1="66" x2="458.0" y2="262"/>
  <line class="dg-lifeline" x1="622.0" y1="66" x2="622.0" y2="262"/>
  <rect class="dg-box" x="383.0" y="76" width="150" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="93" text-anchor="middle">UPDATE: 10 → 11</text>
  <rect class="dg-box-accent dg-empty" x="547.0" y="112" width="150" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="129" text-anchor="middle">UPDATE: waits</text>
  <rect class="dg-box" x="383.0" y="148" width="150" height="26" rx="4"/>
  <text class="dg-code" x="458.0" y="165" text-anchor="middle">COMMIT</text>
  <rect class="dg-box-accent" x="547.0" y="184" width="150" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="201" text-anchor="middle">serialization error</text>
  <rect class="dg-box" x="547.0" y="220" width="150" height="26" rx="4"/>
  <text class="dg-code" x="622.0" y="237" text-anchor="middle">retry</text>
  <text class="dg-result" x="540.0" y="288" text-anchor="middle">T2 retries</text>
  </g>
</svg>
