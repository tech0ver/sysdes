  <rect class="dg-box-accent" x="40" y="120" width="88" height="24" rx="4"/>
  <text class="dg-code" x="84.0" y="136.0" text-anchor="middle">15</text>
  <rect class="dg-box-accent" x="140" y="120" width="100" height="24" rx="4"/>
  <text class="dg-code" x="190.0" y="136.0" text-anchor="middle">4,410</text>
  <rect class="dg-box" x="40" y="150" width="88" height="24" rx="4"/>
