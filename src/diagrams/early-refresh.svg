<svg class="diagram-svg" viewBox="0 0 627 290" role="img" aria-labelledby="early-refresh-title early-refresh-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="early-refresh-title">The chance that a read refreshes early</title>
  <desc id="early-refresh-desc">With B = 1, the chance that one read refreshes the value grows as the expiry nears. With a rebuild time of 80 ms it stays near zero until about 0.3 seconds before the expiry. With a rebuild time of 400 ms it starts to grow about 1.5 seconds before. Both reach 100% at the expiry.</desc>
