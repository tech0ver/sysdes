<svg class="diagram-svg" viewBox="0 0 664 170" role="img" aria-labelledby="torn-record-title torn-record-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="torn-record-title">Records with a length and a checksum; the last one is cut off</title>
  <desc id="torn-record-desc">The end of the file holds records. Each record starts with its length and a checksum, then the data. The last record was cut off by a crash: it is too short and fails the checksum, so recovery drops it.</desc>
  <defs>
    <marker id="torn-record-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="torn-record-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="16" y="30" text-anchor="start">End of the file</text>
  <text class="dg-mono dg-muted-text" x="36" y="54" text-anchor="middle">LENGTH</text>
  <text class="dg-mono dg-muted-text" x="96" y="54" text-anchor="middle">CHECKSUM</text>
  <text class="dg-mono dg-muted-text" x="186" y="54" text-anchor="middle">DATA</text>
  <rect class="dg-box" x="16" y="62" width="40" height="32" rx="0"/>
  <rect class="dg-box" x="56" y="62" width="80" height="32" rx="0"/>
  <rect class="dg-box" x="136" y="62" width="100" height="32" rx="0"/>
  <text class="dg-code" x="36" y="82" text-anchor="middle">24</text>
  <text class="dg-code" x="96" y="82" text-anchor="middle">9f3a</text>
  <text class="dg-code" x="144" y="82">xyz,https:…</text>
  <rect class="dg-box" x="250" y="62" width="40" height="32" rx="0"/>
  <rect class="dg-box" x="290" y="62" width="80" height="32" rx="0"/>
  <rect class="dg-box" x="370" y="62" width="100" height="32" rx="0"/>
  <text class="dg-code" x="270" y="82" text-anchor="middle">24</text>
  <text class="dg-code" x="330" y="82" text-anchor="middle">9f3a</text>
  <text class="dg-code" x="378" y="82">abc,https:…</text>
  <rect class="dg-box-accent" x="484" y="62" width="40" height="32" rx="0"/>
  <rect class="dg-box-accent" x="524" y="62" width="80" height="32" rx="0"/>
  <rect class="dg-box-accent" x="604" y="62" width="44" height="32" rx="0"/>
  <text class="dg-code" x="504" y="82" text-anchor="middle">24</text>
  <text class="dg-code" x="564" y="82" text-anchor="middle">7c01</text>
  <text class="dg-code" x="612" y="82">qr</text>
  <text class="dg-sub" x="484" y="120">cut off by the crash: too short,</text>
  <text class="dg-sub" x="484" y="138">fails the checksum</text>
  <text class="dg-mono dg-muted-text" x="484" y="160">RECOVERY DROPS IT</text>
</svg>
