<svg class="diagram-svg" viewBox="0 0 714 270" role="img" aria-labelledby="redis-roles-title redis-roles-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-roles-title">One Redis for everything and one Redis per role</title>
  <desc id="redis-roles-desc">Left: one server holds the cache, sessions, the job queue, and pub/sub, so all of them share one eviction policy, one persistence setting, and one main thread; a problem in one role hits all. Right: four servers, each with settings for its role: the cache with allkeys-lru and no AOF, sessions and the queue with noeviction and the AOF, pub/sub with no persistence.</desc>
  <defs>
    <marker id="redis-roles-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-roles-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-3 0)">
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">One server</text>
  <text class="dg-sub" x="180.0" y="40" text-anchor="middle">shared settings</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">A server per role</text>
  <text class="dg-sub" x="540.0" y="40" text-anchor="middle">settings per role</text>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="262"/>
  <rect class="dg-box" x="40" y="60" width="280" height="150" rx="6"/>
  <rect class="dg-chip" x="60" y="76" width="116" height="24" rx="4"/>
  <text class="dg-code" x="118.0" y="92.0" text-anchor="middle">cache</text>
  <rect class="dg-chip" x="184" y="76" width="116" height="24" rx="4"/>
  <text class="dg-code" x="242.0" y="92.0" text-anchor="middle">sessions</text>
  <rect class="dg-chip" x="60" y="108" width="116" height="24" rx="4"/>
  <text class="dg-code" x="118.0" y="124.0" text-anchor="middle">job queue</text>
  <rect class="dg-chip" x="184" y="108" width="116" height="24" rx="4"/>
  <text class="dg-code" x="242.0" y="124.0" text-anchor="middle">pub/sub</text>
  <text class="dg-code-muted" x="180" y="162" text-anchor="middle">one eviction policy</text>
  <text class="dg-code-muted" x="180" y="180" text-anchor="middle">one persistence setting</text>
  <text class="dg-code-muted" x="180" y="198" text-anchor="middle">one main thread</text>
  <rect class="dg-box-accent" x="384" y="60" width="152" height="66" rx="6"/>
  <text class="dg-name" x="460.0" y="91.0" text-anchor="middle">cache</text>
  <text class="dg-sub" x="460.0" y="107.0" text-anchor="middle">allkeys-lru, no AOF</text>
  <rect class="dg-box-accent" x="548" y="60" width="152" height="66" rx="6"/>
  <text class="dg-name" x="624.0" y="91.0" text-anchor="middle">sessions</text>
  <text class="dg-sub" x="624.0" y="107.0" text-anchor="middle">noeviction, AOF</text>
  <rect class="dg-box-accent" x="384" y="138" width="152" height="66" rx="6"/>
  <text class="dg-name" x="460.0" y="169.0" text-anchor="middle">job queue</text>
  <text class="dg-sub" x="460.0" y="185.0" text-anchor="middle">noeviction, AOF</text>
  <rect class="dg-box-accent" x="548" y="138" width="152" height="66" rx="6"/>
  <text class="dg-name" x="624.0" y="169.0" text-anchor="middle">pub/sub</text>
  <text class="dg-sub" x="624.0" y="185.0" text-anchor="middle">no persistence</text>
  <text class="dg-result" x="180" y="254" text-anchor="middle">A problem in one role hits all</text>
  <text class="dg-result" x="540" y="254" text-anchor="middle">A problem stays in one role</text>
  </g>
</svg>
