<svg class="diagram-svg" viewBox="0 0 720 236" role="img" aria-labelledby="client-rights-title client-rights-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="client-rights-title">Examples of the narrowest rights for each kind of client</title>
  <desc id="client-rights-desc">Examples: the controller may write the shard map and the controller key. Routers may read the shard map but not write it. Node 9 may write only its own keys: its record and its liveness key.</desc>
  <defs>
    <marker id="client-rights-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="client-rights-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="dg-zone" x="232" y="16" width="256" height="204" rx="8"/>
  <text class="dg-mono dg-muted-text" x="247" y="36">EXAMPLES OF RIGHTS</text>
  <rect class="dg-chip" x="248" y="48" width="224" height="28" rx="4"/>
  <text class="dg-code" x="360.0" y="66.0" text-anchor="middle">/kv/controller</text>
  <rect class="dg-chip" x="248" y="88" width="224" height="28" rx="4"/>
  <text class="dg-code" x="360.0" y="106.0" text-anchor="middle">/kv/shards/</text>
  <rect class="dg-chip" x="248" y="128" width="224" height="28" rx="4"/>
  <text class="dg-code" x="360.0" y="146.0" text-anchor="middle">/kv/nodes/node-09</text>
  <rect class="dg-chip" x="248" y="168" width="224" height="28" rx="4"/>
  <text class="dg-code" x="360.0" y="186.0" text-anchor="middle">/kv/alive/node-09</text>
  <rect class="dg-box" x="16" y="48" width="140" height="68" rx="6"/>
  <text class="dg-name" x="86.0" y="87.0" text-anchor="middle">Controller</text>
  <path class="dg-arrow" d="M156 62 H240" marker-end="url(#client-rights-head)"/>
  <path class="dg-arrow" d="M156 96 H240" marker-end="url(#client-rights-head)"/>
  <text class="dg-mono dg-muted-text" x="198" y="54" text-anchor="middle">WRITE</text>
  <rect class="dg-box" x="16" y="160" width="140" height="36" rx="6"/>
  <text class="dg-name" x="86.0" y="183.0" text-anchor="middle">Routers</text>
  <path class="dg-arrow" d="M248 110 H210 V178 H164" marker-end="url(#client-rights-head)"/>
  <text class="dg-mono dg-muted-text" x="204" y="150" text-anchor="end">READ ONLY</text>
  <rect class="dg-box" x="564" y="128" width="140" height="68" rx="6"/>
  <text class="dg-name" x="634.0" y="167.0" text-anchor="middle">Node 9</text>
  <path class="dg-arrow" d="M564 142 H480" marker-end="url(#client-rights-head)"/>
  <path class="dg-arrow" d="M564 182 H480" marker-end="url(#client-rights-head)"/>
  <text class="dg-mono dg-muted-text" x="522" y="134" text-anchor="middle">WRITE OWN</text>
</svg>
