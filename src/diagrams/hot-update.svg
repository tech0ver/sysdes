<svg class="diagram-svg" viewBox="0 0 720 340" role="img" aria-labelledby="hot-update-title hot-update-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hot-update-title">An update that is not HOT and a HOT update</title>
  <desc id="hot-update-desc">The same update of the views counter of home 1042, in Lisbon, price 120, host 7, in a table with eight indexes, none of them on views. Left, not HOT: the new version goes to page 9 at TID (9,1), and every index gets a new entry pointing to it, although no indexed value changed. Right, HOT: the new version fits on page 4 at (4,2) and is chained to the old one; the indexes keep pointing to (4,1) and are not written.</desc>
  <defs>
    <marker id="hot-update-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="hot-update-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="332"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Not HOT</text>
  <rect class="dg-box" x="16" y="46" width="160" height="70" rx="6"/>
  <text class="dg-mono dg-muted-text" x="28" y="63">INDEX ON CITY</text>
  <rect class="dg-box" x="28" y="71" width="136" height="18" rx="4"/>
  <text class="dg-code" x="96.0" y="84.0" text-anchor="middle">Lisbon → (4,1)</text>
  <rect class="dg-box-accent" x="28" y="92" width="136" height="18" rx="4"/>
  <text class="dg-code" x="96.0" y="105.0" text-anchor="middle">Lisbon → (9,1)</text>
  <rect class="dg-box" x="16" y="124" width="160" height="70" rx="6"/>
  <text class="dg-mono dg-muted-text" x="28" y="141">INDEX ON PRICE</text>
  <rect class="dg-box" x="28" y="149" width="136" height="18" rx="4"/>
  <text class="dg-code" x="96.0" y="162.0" text-anchor="middle">120 → (4,1)</text>
  <rect class="dg-box-accent" x="28" y="170" width="136" height="18" rx="4"/>
  <text class="dg-code" x="96.0" y="183.0" text-anchor="middle">120 → (9,1)</text>
  <rect class="dg-box" x="16" y="202" width="160" height="70" rx="6"/>
  <text class="dg-mono dg-muted-text" x="28" y="219">INDEX ON HOST_ID</text>
  <rect class="dg-box" x="28" y="227" width="136" height="18" rx="4"/>
  <text class="dg-code" x="96.0" y="240.0" text-anchor="middle">7 → (4,1)</text>
  <rect class="dg-box-accent" x="28" y="248" width="136" height="18" rx="4"/>
  <text class="dg-code" x="96.0" y="261.0" text-anchor="middle">7 → (9,1)</text>
  <text class="dg-mono dg-muted-text" x="16" y="294">+ 5 MORE INDEXES</text>
  <rect class="dg-box" x="196" y="46" width="148" height="148" rx="6"/>
  <text class="dg-mono dg-muted-text" x="208" y="66">PAGE 4</text>
  <rect class="dg-box-failed" x="208" y="80" width="124" height="24" rx="4"/>
  <text class="dg-code-muted" x="270.0" y="96.0" text-anchor="middle">(4,1) v1 · 41</text>
  <rect class="dg-box" x="196" y="202" width="148" height="82" rx="6"/>
  <text class="dg-mono dg-muted-text" x="208" y="222">PAGE 9</text>
  <rect class="dg-box" x="208" y="236" width="124" height="24" rx="4"/>
  <text class="dg-code" x="270.0" y="252.0" text-anchor="middle">(9,1) v2 · 42</text>
  <text class="dg-result" x="180" y="326" text-anchor="middle">8 new index entries</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">HOT</text>
  <rect class="dg-box" x="376" y="46" width="160" height="70" rx="6"/>
  <text class="dg-mono dg-muted-text" x="388" y="63">INDEX ON CITY</text>
  <rect class="dg-box" x="388" y="71" width="136" height="18" rx="4"/>
  <text class="dg-code" x="456.0" y="84.0" text-anchor="middle">Lisbon → (4,1)</text>
  <rect class="dg-box" x="376" y="124" width="160" height="70" rx="6"/>
  <text class="dg-mono dg-muted-text" x="388" y="141">INDEX ON PRICE</text>
  <rect class="dg-box" x="388" y="149" width="136" height="18" rx="4"/>
  <text class="dg-code" x="456.0" y="162.0" text-anchor="middle">120 → (4,1)</text>
  <rect class="dg-box" x="376" y="202" width="160" height="70" rx="6"/>
  <text class="dg-mono dg-muted-text" x="388" y="219">INDEX ON HOST_ID</text>
  <rect class="dg-box" x="388" y="227" width="136" height="18" rx="4"/>
  <text class="dg-code" x="456.0" y="240.0" text-anchor="middle">7 → (4,1)</text>
  <text class="dg-mono dg-muted-text" x="376" y="294">+ 5 MORE INDEXES</text>
  <rect class="dg-box" x="556" y="46" width="148" height="148" rx="6"/>
  <text class="dg-mono dg-muted-text" x="568" y="66">PAGE 4</text>
  <rect class="dg-box-failed" x="568" y="80" width="124" height="24" rx="4"/>
  <text class="dg-code-muted" x="630.0" y="96.0" text-anchor="middle">(4,1) v1 · 41</text>
  <rect class="dg-box" x="556" y="202" width="148" height="82" rx="6"/>
  <text class="dg-mono dg-muted-text" x="568" y="222">PAGE 9</text>
  <rect class="dg-box" x="568" y="140" width="124" height="24" rx="4"/>
  <text class="dg-code" x="630.0" y="156.0" text-anchor="middle">(4,2) v2 · 42</text>
  <path class="dg-arrow dg-message" d="M630 104 V140" marker-end="url(#hot-update-head-accent)"/>
  <text class="dg-result" x="540" y="326" text-anchor="middle">no index writes</text>
</svg>
