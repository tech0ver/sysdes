<svg class="diagram-svg" viewBox="0 0 694 330" role="img" aria-labelledby="composite-index-title composite-index-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="composite-index-title">What an index on (city, price) reads for two queries</title>
  <desc id="composite-index-desc">The same eight entries of an index on city and price, in index order, in both panels. Left, city = Lisbon: the four Lisbon entries lie together, already sorted by price, and the scan reads only them. Right, price &lt; 100: the matching entries, Faro 80, Lisbon 60, Lisbon 95, and Porto 70, are spread across the cities, so the scan reads the whole index.</desc>
