<svg class="diagram-svg" viewBox="0 0 720 402" role="img" aria-labelledby="encoding-rename-directions-title encoding-rename-directions-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="encoding-rename-directions-title">A considered rename and its reading directions</title>
  <desc id="encoding-rename-directions-desc">Consider renaming delivery_note to delivery_instructions. Binary Protobuf keeps field number 6 and the string type. JSON and ProtoJSON use names. A new Avro reader can alias the old name if its implementation supports aliases; that does not teach the new name to an unchanged old reader. The service ultimately keeps delivery_note as a string.</desc>
  <defs>
    <marker id="encoding-rename-directions-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="encoding-rename-directions-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-code" x="360" y="28" text-anchor="middle">delivery_note → delivery_instructions</text>
  <text class="dg-mono dg-muted-text" x="24" y="68">PATH</text>
  <text class="dg-mono dg-muted-text" x="358" y="68" text-anchor="middle">OLD DATA → NEW READER</text>
  <text class="dg-mono dg-muted-text" x="586" y="68" text-anchor="middle">NEW DATA → OLD READER</text>
  <text class="dg-name" x="24" y="118" text-anchor="start">Binary Protobuf</text>
  <rect class="dg-box" x="248" y="88" width="220" height="70" rx="6"/>
  <text class="dg-code" x="358" y="116" text-anchor="middle">number 6, string</text>
  <text class="dg-sub" x="358" y="138" text-anchor="middle">same binary identity</text>
  <rect class="dg-box" x="476" y="88" width="220" height="70" rx="6"/>
  <text class="dg-code" x="586" y="116" text-anchor="middle">number 6, string</text>
  <text class="dg-sub" x="586" y="138" text-anchor="middle">same binary identity</text>
  <text class="dg-name" x="24" y="206" text-anchor="start">JSON / ProtoJSON</text>
  <rect class="dg-box" x="248" y="176" width="220" height="70" rx="6"/>
  <text class="dg-code" x="358" y="204" text-anchor="middle">old name in data</text>
  <text class="dg-sub" x="358" y="226" text-anchor="middle">name mapping needed</text>
  <rect class="dg-box" x="476" y="176" width="220" height="70" rx="6"/>
  <text class="dg-code" x="586" y="204" text-anchor="middle">new name in data</text>
  <text class="dg-sub" x="586" y="226" text-anchor="middle">name mapping needed</text>
  <text class="dg-name" x="24" y="294" text-anchor="start">Avro</text>
  <rect class="dg-box-accent" x="248" y="264" width="220" height="70" rx="6"/>
  <text class="dg-code" x="358" y="292" text-anchor="middle">new reader alias</text>
  <text class="dg-sub" x="358" y="314" text-anchor="middle">can match the old name</text>
  <rect class="dg-box" x="476" y="264" width="220" height="70" rx="6"/>
  <text class="dg-code" x="586" y="292" text-anchor="middle">old reader unchanged</text>
  <text class="dg-sub" x="586" y="314" text-anchor="middle">alias does not add knowledge</text>
  <text class="dg-sub" x="360" y="378" text-anchor="middle">Avro alias support depends on the implementation</text>
</svg>
