<svg class="diagram-svg" viewBox="0 0 331 300" role="img" aria-labelledby="skip-locked-title skip-locked-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="skip-locked-title">Three workers claim jobs with SKIP LOCKED</title>
  <desc id="skip-locked-desc">Nine jobs in run_at order. Worker A claims the first three and locks them. Worker B reads from the top, skips the three locked jobs, and claims the next three. Worker C skips six and claims the last three. No worker waits for another.</desc>
  <defs>
    <marker id="skip-locked-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="skip-locked-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-220 0)">
  <text class="dg-mono dg-muted-text" x="380.0" y="26" text-anchor="middle">JOBS, BY RUN_AT</text>
  <rect class="dg-box" x="300" y="36" width="160" height="24" rx="4"/>
  <text class="dg-code" x="380.0" y="52.0" text-anchor="middle">88121 · email</text>
  <rect class="dg-box" x="300" y="64" width="160" height="24" rx="4"/>
