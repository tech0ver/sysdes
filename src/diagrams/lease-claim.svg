<svg class="diagram-svg" viewBox="0 0 682 330" role="img" aria-labelledby="lease-claim-title lease-claim-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lease-claim-title">A lease that runs out, and the claim check on delete</title>
  <desc id="lease-claim-desc">Worker A claims job 88121, which sets attempts to 1 and a lease until 10:05. A runs past its lease, so at 10:05 worker B claims the job again, with attempts 2. When A finishes, its delete asks for attempts = 1 and matches no row. B's delete with attempts = 2 removes the job.</desc>
  <defs>
    <marker id="lease-claim-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="lease-claim-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-38 0)">
  <text class="dg-mono dg-muted-text" x="100" y="24" text-anchor="middle">WORKER A</text>
  <line class="dg-lifeline" x1="100" y1="34" x2="100" y2="318"/>
  <text class="dg-mono dg-muted-text" x="360" y="24" text-anchor="middle">JOB 88121</text>
  <line class="dg-lifeline" x1="360" y1="34" x2="360" y2="318"/>
  <text class="dg-mono dg-muted-text" x="620" y="24" text-anchor="middle">WORKER B</text>
  <line class="dg-lifeline" x1="620" y1="34" x2="620" y2="318"/>
  <text class="dg-mono dg-muted-text" x="230.0" y="56" text-anchor="middle">CLAIM</text>
  <path class="dg-arrow" d="M100 64 H352" marker-end="url(#lease-claim-head)"/>
  <rect class="dg-box" x="270.0" y="76" width="180" height="26" rx="4"/>
  <text class="dg-code" x="360.0" y="93.0" text-anchor="middle">attempts 1, until 10:05</text>
  <rect class="dg-box-failed" x="55.0" y="92" width="90" height="158" rx="4"/>
  <text class="dg-code-muted" x="100" y="109" text-anchor="middle">working</text>
  <path class="dg-guide" d="M150 136 H704" fill="none"/>
  <text class="dg-mono dg-accent-text" x="160" y="128">10:05 LEASE ENDS</text>
  <text class="dg-mono dg-muted-text" x="490.0" y="162" text-anchor="middle">CLAIM</text>
  <path class="dg-arrow" d="M620 170 H368" marker-end="url(#lease-claim-head)"/>
  <rect class="dg-box" x="270.0" y="182" width="180" height="26" rx="4"/>
  <text class="dg-code" x="360.0" y="199.0" text-anchor="middle">attempts 2, until 10:10</text>
  <text class="dg-mono dg-accent-text" x="230.0" y="262" text-anchor="middle">DELETE, ATTEMPTS = 1</text>
  <path class="dg-arrow dg-message" d="M100 270 H352" marker-end="url(#lease-claim-head-accent)"/>
  <text class="dg-mono dg-accent-text" x="372" y="274">0 ROWS</text>
  <text class="dg-mono dg-muted-text" x="490.0" y="298" text-anchor="middle">DELETE, ATTEMPTS = 2</text>
  <path class="dg-arrow" d="M620 306 H368" marker-end="url(#lease-claim-head)"/>
  <text class="dg-mono dg-muted-text" x="348" y="310" text-anchor="end">1 ROW</text>
  </g>
</svg>
