<svg class="diagram-svg" viewBox="0 0 720 300" role="img" aria-labelledby="redis-deployments-title redis-deployments-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="redis-deployments-title">Three ways to run Redis</title>
  <desc id="redis-deployments-desc">Left: a single primary with two replicas; when the primary fails, an operator promotes a replica. Middle: the same primary and replicas, watched by three Sentinels that promote a replica by themselves. Right: a cluster of three shards, each a primary with its own replica and its own part of the keys; the nodes fail over by themselves, without Sentinel.</desc>
  <defs>
    <marker id="redis-deployments-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="redis-deployments-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="120.0" y="22" text-anchor="middle">Single primary</text>
  <text class="dg-sub" x="120.0" y="40" text-anchor="middle">replicas optional</text>
  <text class="dg-name" x="360.0" y="22" text-anchor="middle">Sentinel</text>
  <text class="dg-sub" x="360.0" y="40" text-anchor="middle">all keys on one primary</text>
  <text class="dg-name" x="600.0" y="22" text-anchor="middle">Cluster</text>
  <text class="dg-sub" x="600.0" y="40" text-anchor="middle">keys split over primaries</text>
  <line class="dg-rule" x1="240" y1="8" x2="240" y2="292"/>
  <line class="dg-rule" x1="480" y1="8" x2="480" y2="292"/>
  <rect class="dg-box" x="60" y="72" width="120" height="36" rx="6"/>
  <text class="dg-name" x="120.0" y="95.0" text-anchor="middle">Primary</text>
  <rect class="dg-box" x="16" y="150" width="96" height="32" rx="6"/>
  <text class="dg-name" x="64.0" y="171.0" text-anchor="middle">Replica</text>
  <rect class="dg-box" x="128" y="150" width="96" height="32" rx="6"/>
  <text class="dg-name" x="176.0" y="171.0" text-anchor="middle">Replica</text>
  <path class="dg-arrow" d="M96 108 L68 144" marker-end="url(#redis-deployments-head)"/>
  <path class="dg-arrow" d="M144 108 L172 144" marker-end="url(#redis-deployments-head)"/>
  <rect class="dg-box" x="300" y="72" width="120" height="36" rx="6"/>
  <text class="dg-name" x="360.0" y="95.0" text-anchor="middle">Primary</text>
  <rect class="dg-box" x="256" y="150" width="96" height="32" rx="6"/>
  <text class="dg-name" x="304.0" y="171.0" text-anchor="middle">Replica</text>
  <rect class="dg-box" x="368" y="150" width="96" height="32" rx="6"/>
  <text class="dg-name" x="416.0" y="171.0" text-anchor="middle">Replica</text>
  <path class="dg-arrow" d="M336 108 L308 144" marker-end="url(#redis-deployments-head)"/>
  <path class="dg-arrow" d="M384 108 L412 144" marker-end="url(#redis-deployments-head)"/>
  <rect class="dg-box-accent" x="245" y="222" width="74" height="26" rx="4"/>
  <text class="dg-code" x="282.0" y="239.0" text-anchor="middle">Sentinel</text>
  <rect class="dg-box-accent" x="323" y="222" width="74" height="26" rx="4"/>
  <text class="dg-code" x="360.0" y="239.0" text-anchor="middle">Sentinel</text>
  <rect class="dg-box-accent" x="401" y="222" width="74" height="26" rx="4"/>
  <text class="dg-code" x="438.0" y="239.0" text-anchor="middle">Sentinel</text>
  <text class="dg-mono dg-accent-text" x="360" y="210" text-anchor="middle">WATCH THE PRIMARY</text>
  <rect class="dg-box-accent" x="488" y="72" width="70" height="36" rx="6"/>
  <text class="dg-name" x="523.0" y="95.0" text-anchor="middle">Primary</text>
  <rect class="dg-box" x="488" y="150" width="70" height="32" rx="6"/>
  <text class="dg-name" x="523.0" y="171.0" text-anchor="middle">Replica</text>
  <path class="dg-arrow" d="M523 108 V144" marker-end="url(#redis-deployments-head)"/>
  <text class="dg-mono dg-muted-text" x="523" y="200" text-anchor="middle">SHARD 1</text>
  <rect class="dg-box-accent" x="564" y="72" width="70" height="36" rx="6"/>
  <text class="dg-name" x="599.0" y="95.0" text-anchor="middle">Primary</text>
  <rect class="dg-box" x="564" y="150" width="70" height="32" rx="6"/>
  <text class="dg-name" x="599.0" y="171.0" text-anchor="middle">Replica</text>
  <path class="dg-arrow" d="M599 108 V144" marker-end="url(#redis-deployments-head)"/>
  <text class="dg-mono dg-muted-text" x="599" y="200" text-anchor="middle">SHARD 2</text>
  <rect class="dg-box-accent" x="640" y="72" width="70" height="36" rx="6"/>
  <text class="dg-name" x="675.0" y="95.0" text-anchor="middle">Primary</text>
  <rect class="dg-box" x="640" y="150" width="70" height="32" rx="6"/>
  <text class="dg-name" x="675.0" y="171.0" text-anchor="middle">Replica</text>
  <path class="dg-arrow" d="M675 108 V144" marker-end="url(#redis-deployments-head)"/>
  <text class="dg-mono dg-muted-text" x="675" y="200" text-anchor="middle">SHARD 3</text>
  <text class="dg-result" x="120" y="286" text-anchor="middle">Failover by hand</text>
  <text class="dg-result" x="360" y="286" text-anchor="middle">Automatic failover</text>
  <text class="dg-result" x="600" y="286" text-anchor="middle">Failover per shard</text>
</svg>
