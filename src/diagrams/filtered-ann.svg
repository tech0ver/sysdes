  <title id="filtered-ann-title">A filter applied after the approximate search</title>
  <desc id="filtered-ann-desc">Top, the default: HNSW returns 40 nearest candidates (ef_search = 40), and a filter that matches 10% of homes keeps 4 of them, so the query returns 4 rows instead of 20. Bottom, with an iterative scan: the index keeps reading candidates, here 200, until 20 rows pass the filter.</desc>
