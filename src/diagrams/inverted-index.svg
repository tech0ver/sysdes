<svg class="diagram-svg" viewBox="0 0 720 236" role="img" aria-labelledby="inverted-index-title inverted-index-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="inverted-index-title">An inverted index maps each word to the records that contain it</title>
  <desc id="inverted-index-desc">Three captions: 1 Beach sunset, 2 Pier sunset, 3 Running beach. Analysis splits them into words, lowercases them, and stems running to run. The index maps beach to posts 1 and 3, pier to 2, run to 3, and sunset to 1 and 2. The query beach AND sunset takes the lists 1, 3 and 1, 2 and keeps post 1, found in both.</desc>
  <defs>
    <marker id="inverted-index-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="inverted-index-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-name" x="16" y="24" text-anchor="start">Captions</text>
  <rect class="dg-chip" x="16" y="40" width="220" height="24" rx="4"/>
  <text class="dg-code" x="126.0" y="56.0" text-anchor="middle">1  Beach sunset</text>
  <rect class="dg-chip" x="16" y="70" width="220" height="24" rx="4"/>
  <text class="dg-code" x="126.0" y="86.0" text-anchor="middle">2  Pier sunset</text>
  <rect class="dg-chip" x="16" y="100" width="220" height="24" rx="4"/>
  <text class="dg-code" x="126.0" y="116.0" text-anchor="middle">3  Running beach</text>
  <path class="dg-arrow" d="M244 76 H344" marker-end="url(#inverted-index-head)"/>
  <text class="dg-mono dg-muted-text" x="294" y="68" text-anchor="middle">ANALYZE</text>
  <text class="dg-sub" x="16" y="148">split, lowercase, stem: running → run</text>
  <text class="dg-name" x="352" y="24" text-anchor="start">Inverted index</text>
  <rect class="dg-box-accent" x="352" y="40" width="352" height="24" rx="4"/>
  <text class="dg-code" x="528.0" y="56.0" text-anchor="middle">beach → 1, 3</text>
  <rect class="dg-box" x="352" y="68" width="352" height="24" rx="4"/>
  <text class="dg-code-muted" x="528.0" y="84.0" text-anchor="middle">pier → 2</text>
  <rect class="dg-box" x="352" y="96" width="352" height="24" rx="4"/>
  <text class="dg-code-muted" x="528.0" y="112.0" text-anchor="middle">run → 3</text>
  <rect class="dg-box-accent" x="352" y="124" width="352" height="24" rx="4"/>
  <text class="dg-code" x="528.0" y="140.0" text-anchor="middle">sunset → 1, 2</text>
  <line class="dg-rule" x1="0" y1="176" x2="720" y2="176"/>
  <rect class="dg-chip" x="16" y="196" width="200" height="24" rx="4"/>
  <text class="dg-code" x="116.0" y="212.0" text-anchor="middle">beach AND sunset</text>
  <path class="dg-arrow" d="M216 208 H300" marker-end="url(#inverted-index-head)"/>
  <text class="dg-code" x="308" y="213">{1, 3} ∩ {1, 2}</text>
  <path class="dg-arrow dg-message" d="M440 208 H552" marker-end="url(#inverted-index-head-accent)"/>
  <rect class="dg-box-accent" x="560" y="196" width="144" height="24" rx="4"/>
  <text class="dg-code" x="632.0" y="212.0" text-anchor="middle">post 1</text>
</svg>
