<svg class="diagram-svg" viewBox="0 0 720 398" role="img" aria-labelledby="ready-marker-title ready-marker-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ready-marker-title">A ready marker keeps ZooKeeper readers away from half a change</title>
  <desc id="ready-marker-desc">The controller deletes the ready znode, sets 0017 and 0042, and creates ready again. A reader that checks ready while it is gone waits. After ready is back, the reader reads 0017 and 0042 and gets both new values.</desc>
  <defs>
    <marker id="ready-marker-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ready-marker-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="110" y="20" text-anchor="middle">CONTROLLER</text>
  <line class="dg-lifeline" x1="110" y1="34" x2="110" y2="388"/>
  <text class="dg-mono dg-muted-text" x="360" y="20" text-anchor="middle">ZOOKEEPER</text>
  <line class="dg-lifeline" x1="360" y1="34" x2="360" y2="388"/>
  <text class="dg-mono dg-muted-text" x="610" y="20" text-anchor="middle">READER</text>
  <line class="dg-lifeline" x1="610" y1="34" x2="610" y2="388"/>
  <rect class="dg-box" x="310.0" y="44" width="100" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="60.0" text-anchor="middle">ready</text>
  <text class="dg-mono dg-muted-text" x="235.0" y="84" text-anchor="middle">DELETE ready</text>
  <path class="dg-arrow" d="M110 92 H352" marker-end="url(#ready-marker-head)"/>
  <rect class="dg-box-failed" x="310.0" y="102" width="100" height="24" rx="4"/>
  <text class="dg-code-muted" x="360.0" y="118.0" text-anchor="middle">no ready</text>
  <text class="dg-mono dg-muted-text" x="485.0" y="142" text-anchor="middle">DOES ready EXIST?</text>
  <path class="dg-arrow" d="M610 150 H368" marker-end="url(#ready-marker-head)"/>
  <text class="dg-mono dg-accent-text" x="485.0" y="168" text-anchor="middle">NO: WAIT</text>
  <path class="dg-arrow dg-message" d="M360 176 H602" marker-end="url(#ready-marker-head-accent)"/>
  <text class="dg-mono dg-muted-text" x="235.0" y="192" text-anchor="middle">SET 0017</text>
  <path class="dg-arrow" d="M110 200 H352" marker-end="url(#ready-marker-head)"/>
  <text class="dg-mono dg-muted-text" x="235.0" y="222" text-anchor="middle">SET 0042</text>
  <path class="dg-arrow" d="M110 230 H352" marker-end="url(#ready-marker-head)"/>
  <text class="dg-mono dg-muted-text" x="235.0" y="256" text-anchor="middle">CREATE ready</text>
  <path class="dg-arrow" d="M110 264 H352" marker-end="url(#ready-marker-head)"/>
  <rect class="dg-box" x="310.0" y="274" width="100" height="24" rx="4"/>
  <text class="dg-code" x="360.0" y="290.0" text-anchor="middle">ready</text>
  <text class="dg-mono dg-muted-text" x="485.0" y="314" text-anchor="middle">DOES ready EXIST?</text>
  <path class="dg-arrow" d="M610 322 H368" marker-end="url(#ready-marker-head)"/>
  <text class="dg-mono dg-muted-text" x="485.0" y="340" text-anchor="middle">YES</text>
  <path class="dg-arrow" d="M360 348 H602" marker-end="url(#ready-marker-head)"/>
  <rect class="dg-box" x="530.0" y="360" width="160" height="24" rx="4"/>
  <text class="dg-code" x="610.0" y="376.0" text-anchor="middle">read 0017, 0042</text>
</svg>
