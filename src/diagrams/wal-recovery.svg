<svg class="diagram-svg" viewBox="0 0 720 236" role="img" aria-labelledby="wal-recovery-title wal-recovery-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="wal-recovery-title">Recovery reads the log from the last checkpoint</title>
  <desc id="wal-recovery-desc">The log holds the changes of two transactions in the order they happened, a checkpoint, and the commit record of T1. The database crashes before T2 commits. Recovery starts at the checkpoint. T1 has a commit record, so it is kept and any of its changes missing on disk are written again. T2 has none, so its changes are removed.</desc>
  <defs>
    <marker id="wal-recovery-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="wal-recovery-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <text class="dg-mono dg-muted-text" x="16" y="30">THE LOG, OLDEST FIRST</text>
  <rect class="dg-box" x="16" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="58.0" y="61.0" text-anchor="middle">T1 order</text>
  <rect class="dg-box" x="108" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="150.0" y="61.0" text-anchor="middle">T1 seats</text>
  <rect class="dg-chip" x="200" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="242.0" y="61.0" text-anchor="middle">checkpoint</text>
  <rect class="dg-box" x="292" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="334.0" y="61.0" text-anchor="middle">T2 order</text>
  <rect class="dg-box" x="384" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="426.0" y="61.0" text-anchor="middle">T1 payment</text>
  <rect class="dg-box-accent" x="476" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="518.0" y="61.0" text-anchor="middle">T1 commit</text>
  <rect class="dg-box" x="568" y="42" width="84" height="30" rx="4"/>
  <text class="dg-code" x="610.0" y="61.0" text-anchor="middle">T2 seats</text>
  <line class="dg-cross" x1="658" y1="36" x2="658" y2="78"/>
  <text class="dg-mono dg-muted-text" x="664" y="62">CRASH</text>
  <path class="dg-arrow" d="M242 78 V100 H654" marker-end="url(#wal-recovery-head)"/>
  <text class="dg-mono dg-muted-text" x="250" y="118">RECOVERY READS FROM THE CHECKPOINT</text>
  <line class="dg-rule" x1="16" y1="140" x2="704" y2="140"/>
  <rect class="dg-box-accent" x="16" y="156" width="160" height="30" rx="4"/>
  <text class="dg-code" x="96.0" y="175.0" text-anchor="middle">T1: commit record</text>
  <text class="dg-note" x="192" y="176">kept: its changes are written again where they did not reach disk</text>
  <rect class="dg-box" x="16" y="196" width="160" height="30" rx="4"/>
  <text class="dg-code" x="96.0" y="215.0" text-anchor="middle">T2: no commit record</text>
  <text class="dg-note" x="192" y="216">removed: its changes are undone</text>
</svg>
