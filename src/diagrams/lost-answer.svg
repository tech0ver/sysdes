<svg class="diagram-svg" viewBox="0 0 706 326" role="img" aria-labelledby="lost-answer-title lost-answer-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lost-answer-title">A lost answer before the decision is undone; after it, the site finds out</title>
  <desc id="lost-answer-desc">Left: the answer to the authorization is lost. The attempt stays pending and the hold stays; a status query by ID gets no answer either, so when the set limit passes, the site cancels the authorization and returns the units. Right: the answer to the capture is lost. The booking keeps its units, a status query by ID answers captured, and the booking is confirmed and paid.</desc>
  <defs>
    <marker id="lost-answer-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="lost-answer-head-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <g transform="translate(-7 0)">
  <line class="dg-rule" x1="360" y1="8" x2="360" y2="318"/>
  <text class="dg-name" x="180.0" y="22" text-anchor="middle">Authorization times out</text>
  <text class="dg-mono dg-muted-text" x="100" y="62" text-anchor="middle">SITE</text>
  <line class="dg-lifeline" x1="100" y1="70" x2="100" y2="288"/>
  <text class="dg-mono dg-muted-text" x="296" y="62" text-anchor="middle">PROVIDER</text>
  <line class="dg-lifeline" x1="296" y1="70" x2="296" y2="288"/>
  <text class="dg-mono dg-muted-text" x="198.0" y="88" text-anchor="middle">AUTHORIZE</text>
  <path class="dg-arrow" d="M100 96 H288" marker-end="url(#lost-answer-head)"/>
  <text class="dg-mono dg-muted-text" x="198.0" y="124" text-anchor="middle">ANSWER LOST</text>
  <path class="dg-arrow dg-empty" d="M296 132 H108" marker-end="url(#lost-answer-head)"/>
  <line class="dg-cross" x1="192.0" y1="126" x2="204.0" y2="138"/>
  <line class="dg-cross" x1="192.0" y1="138" x2="204.0" y2="126"/>
  <rect class="dg-box" x="24" y="148" width="152" height="26" rx="4"/>
  <text class="dg-code" x="100.0" y="165.0" text-anchor="middle">pending, hold stays</text>
  <text class="dg-mono dg-muted-text" x="198.0" y="198" text-anchor="middle">STATUS BY ID</text>
  <path class="dg-arrow" d="M100 206 H288" marker-end="url(#lost-answer-head)"/>
  <path class="dg-arrow dg-empty" d="M296 236 H108" marker-end="url(#lost-answer-head)"/>
  <text class="dg-mono dg-muted-text" x="198.0" y="228" text-anchor="middle">NO ANSWER</text>
  <line class="dg-cross" x1="192.0" y1="230" x2="204.0" y2="242"/>
  <line class="dg-cross" x1="192.0" y1="242" x2="204.0" y2="230"/>
  <rect class="dg-box-accent" x="24" y="254" width="152" height="26" rx="4"/>
  <text class="dg-code" x="100.0" y="271.0" text-anchor="middle">limit: cancel it</text>
  <text class="dg-result" x="180" y="312" text-anchor="middle">Before the decision: undo</text>
  <text class="dg-name" x="540.0" y="22" text-anchor="middle">Capture times out</text>
  <text class="dg-mono dg-muted-text" x="460" y="62" text-anchor="middle">SITE</text>
  <line class="dg-lifeline" x1="460" y1="70" x2="460" y2="288"/>
  <text class="dg-mono dg-muted-text" x="656" y="62" text-anchor="middle">PROVIDER</text>
  <line class="dg-lifeline" x1="656" y1="70" x2="656" y2="288"/>
  <text class="dg-mono dg-muted-text" x="558.0" y="88" text-anchor="middle">CAPTURE</text>
  <path class="dg-arrow" d="M460 96 H648" marker-end="url(#lost-answer-head)"/>
  <text class="dg-mono dg-muted-text" x="558.0" y="124" text-anchor="middle">ANSWER LOST</text>
  <path class="dg-arrow dg-empty" d="M656 132 H468" marker-end="url(#lost-answer-head)"/>
  <line class="dg-cross" x1="552.0" y1="126" x2="564.0" y2="138"/>
  <line class="dg-cross" x1="552.0" y1="138" x2="564.0" y2="126"/>
  <rect class="dg-box" x="384" y="148" width="152" height="26" rx="4"/>
  <text class="dg-code" x="460.0" y="165.0" text-anchor="middle">booking keeps units</text>
  <text class="dg-mono dg-muted-text" x="558.0" y="198" text-anchor="middle">STATUS BY ID</text>
  <path class="dg-arrow" d="M460 206 H648" marker-end="url(#lost-answer-head)"/>
  <path class="dg-arrow" d="M656 236 H468" marker-end="url(#lost-answer-head)"/>
  <text class="dg-mono dg-muted-text" x="558.0" y="228" text-anchor="middle">CAPTURED</text>
  <rect class="dg-box-accent" x="384" y="254" width="152" height="26" rx="4"/>
  <text class="dg-code" x="460.0" y="271.0" text-anchor="middle">confirmed and paid</text>
  <text class="dg-result" x="540" y="312" text-anchor="middle">After the decision: find out</text>
  </g>
</svg>
